name: cacheman
description: "Type-safe cache semantics over app-owned storage: TTL and absolute expiry, sliding renewal, namespaces, pluggable serialization and a key-bound helper."
version: 0.8.1
homepage: https://github.com/icodejoo/dart-labs/tree/main/cacheman
repository: https://github.com/icodejoo/dart-labs/tree/main/cacheman
issue_tracker: https://github.com/icodejoo/dart-labs/issues

topics:
  - cache
  - storage
  - ttl
  - key-value

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
