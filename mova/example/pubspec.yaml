name: mova_example
description: "Demonstrates how to use the mova plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  mova:
    # When depending on this package from a real application you should use:
    #   mova: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.0
  media_kit_video: ^2.0.1
  sherpa_onnx: ^1.12.34
  mova_stt:
    path: ../../mova_stt
  file_picker: ^11.0.3

  # One-off, example-only: used by lib/perf_probe_just_audio.dart to compare
  # just_audio's in-process memory against mova's on identical audio content.
  # NOT a dependency of the mova package itself — deliberately confined here.
  #
  # just_audio has no first-party Windows implementation (official platforms
  # are Android/iOS/macOS/web), so a federated backend is required on desktop.
  # just_audio_windows (WinRT MediaPlayer) is chosen over just_audio_media_kit
  # because the latter wraps the very same libmpv mova uses, which would make
  # the comparison circular rather than informative.
  #
  # 一次性、仅 example 使用：供 lib/perf_probe_just_audio.dart 在相同音频内容上
  # 对比 just_audio 与 mova 的进程内内存。**不是** mova 包自身的依赖，刻意只放这里。
  #
  # just_audio 在 Windows 上没有第一方实现（官方平台为 Android/iOS/macOS/web），
  # 桌面必须外挂联邦后端。这里选 just_audio_windows（WinRT MediaPlayer）而非
  # just_audio_media_kit——后者包的正是 mova 用的同一个 libmpv，对比会变成循环论证。
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# Windows-only real-device verification of mova-libmpv's own CI-built
# libmpv-2.dll (dist/windows-x86_64/), swapped in for media_kit's upstream
# prebuilt one. See mova/packages/media_kit_libs_windows_video_slim.
# 2026-09-24 根因已查明并修复：此前用 gcc 16.2.0 编译该 slim dll 时踩到
# 编译器 miscompilation bug，导致 mpv_create() 内部悬空指针、必现 Access
# Violation。已改用 clang 重新编译，体积几乎无损失，问题解决——详见
# mova-libmpv/README.md 与 doc/plans/2026-09-17-windows-libmpv-slim.md
# 的「真机崩溃根因排查」一节。当前 override 保持启用，长期用这份自建
# slim 版本做真机验证。
dependency_overrides:
  media_kit_libs_windows_video:
    path: ../packages/media_kit_libs_windows_video_slim

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
