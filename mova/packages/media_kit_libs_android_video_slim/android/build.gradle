// [mova slim fork] Same package name as upstream media_kit_libs_android_video,
// so a dependency_overrides path/git override makes this the *sole* provider
// of com.alexmercerind.media_kit_libs_android_video — upstream never enters
// the dependency graph, so there is nothing to pickFirst against.
//
// Unlike upstream, this build.gradle has no downloadDependencies task: the
// two native libraries (libmpv.so — mova-libmpv's own slimmed build;
// libmediakitandroidhelper.so — extracted verbatim from upstream's release
// jar, since mova-libmpv doesn't build it) are committed directly under
// android/src/main/jniLibs/<abi>/ and picked up by AGP automatically.

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// 守卫：jniLibs 下的 libmpv.so 若仍是 Git LFS 指针（过小或以指针头开头）就让构建失败，
// 避免把指针当成 so 打进 APK。判定逻辑与 tool/libmpv_hydrate.py 保持一致。
def jniLibsDir = file("${projectDir}/src/main/jniLibs")
if (jniLibsDir.exists()) {
    jniLibsDir.eachDir { abiDir ->
        def so = new File(abiDir, 'libmpv.so')
        if (so.exists()) {
            def buf = new byte[40]
            def n = 0
            so.withInputStream { n = it.read(buf) }
            def head = new String(buf, 0, Math.max(n, 0), 'ISO-8859-1')
            if (so.length() < 1024 || head.startsWith('version https://git-lfs')) {
                throw new GradleException("${so} is a Git LFS pointer, not a real binary. " +
                    "Run: python tool/libmpv_hydrate.py (in the mova directory) first.")
            }
        }
    }
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }
}
