name: media_kit_libs_windows_video
description: >-
  [mova slim fork] Windows package providing video (& audio) native
  libraries for package:media_kit, using mova's own slimmed libmpv-2.dll
  instead of the upstream prebuilt archive.
version: 1.0.11
publish_to: 'none'

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MediaKitLibsWindowsVideoPluginCApi
