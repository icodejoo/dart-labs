name: mova
description: "media_kit (libmpv/ffmpeg) 视频播放器插件：手势、点播/直播控制条、清晰度切换与自适应、画中画。"
version: 0.2.0
homepage: https://github.com/icodejoo/dart-labs/tree/main/mova
repository: https://github.com/icodejoo/dart-labs/tree/main/mova
topics:
  - video
  - player
  - media-kit
  - hls
  - picture-in-picture

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.5
  # 固定到 media-kit master 某提交而非 pub.dev 发布版：埋点增强需要该提交新增的
  # `observeEvent`/`unobserveEvent` 公开 API（订阅原生 mpv 事件，见
  # doc/plans/2026-09-29-telemetry-enhancement.md「新架构决策」）。这是用户拍板的
  # 已知取舍：mova 因此暂时无法发布到 pub.dev（pub.dev 禁止已发布包依赖 git/path），
  # 与 CLAUDE.md 记录的"mova 已不打算走 pub.dev 独立发布"现状一致。
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: media_kit
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  meta: ^1.16.0
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.0.2
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  # Test-only, and already in the lock file via flutter_test: lets the ad
  # orchestration tests advance Timer deadlines (delay / duration / loadTimeout)
  # deterministically instead of sleeping for real seconds.
  #
  # 仅测试用，且经 flutter_test 本就已在 lock 文件里：使广告编排测试能确定性地
  # 推进 Timer 到期（delay / duration / loadTimeout），而不必真的睡上几秒。
  fake_async: ^1.3.1

# media_kit_video 自身在 pubspec 里把 media_kit 声明为 hosted 依赖（即便版本号
# 兼容），pub 仍会把"同一个包一边来自 git 一边来自 hosted"判成来源冲突——必须用
# dependency_overrides 强制整张依赖图都走上面锁定的同一个 git 提交。
dependency_overrides:
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: media_kit

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.icodejoo.mova
        pluginClass: MovaPlugin
      ios:
        pluginClass: MovaPlugin
      windows:
        pluginClass: MovaPluginCApi

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
