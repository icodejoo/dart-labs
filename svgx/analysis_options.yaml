include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # cargokit's own build_tool Dart package (vendored by flutter_rust_bridge
    # setup), has its own pubspec.yaml/deps not installed by our `dart pub
    # get` — not part of svgx itself.
    - cargokit/**
    # F baseline, relocated out of lib/ (see benchmark/baseline_f/README.md) —
    # not part of the shipped package, not wired into pubspec.yaml.
    - benchmark/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
