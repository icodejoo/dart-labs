# Cargokit per-crate build options.
#
# cargokit 的 crate 级构建选项。
#
# Only the `release` configuration is size-optimised with nightly build-std.
# Debug (`flutter run`) and profile (`flutter run --profile`, used by
# benchmark/bench_app) intentionally stay on stable so day-to-day development
# and benchmarking never require a nightly toolchain.
#
# 只有 `release` 配置走 nightly build-std 瘦身;debug(`flutter run`)与 profile
# (`flutter run --profile`,基准测试用)刻意留在 stable,日常开发/压测不需要
# nightly 工具链。
#
# `toolchain` (pinned dated nightly) and `env` are svgx-local extensions to
# upstream cargokit — see the SVGX-LOCAL comments in
# `cargokit/build_tool/lib/src/options.dart`, `builder.dart` and `rustup.dart`.
# Upgrading the vendored cargokit requires re-applying them.
#
# `toolchain`(带日期的固定 nightly)和 `env` 是 svgx 对上游 cargokit 的本地扩展,
# 见上述三个文件里的 SVGX-LOCAL 注释;升级 vendor 的 cargokit 时需要重新打上。
#
# `-Z build-std=std,panic_abort` + `RUSTFLAGS=-Cpanic=immediate-abort` recompiles
# std itself with the immediate-abort panic strategy, shrinking the native
# library ~21%. Bumping the nightly date must be deliberate (flag spellings have
# changed before) and kept in sync with `rust/build-release.ps1`,
# `.github/workflows/svgx-ci.yml`, `README.md` and `CLAUDE.md`.
cargo:
  release:
    toolchain: nightly-2026-06-24
    extra_flags:
      - -Z
      - build-std=std,panic_abort
    env:
      RUSTFLAGS: -Zunstable-options -Cpanic=immediate-abort
