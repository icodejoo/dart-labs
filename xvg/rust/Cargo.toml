[package]
name = "xvg"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Size optimization (re-applied 2026-08-26 after the fsvg→xvg rename lost it
# to an accidental `git checkout`): usvg 0.49's optional features are `text`, `system-fonts`,
# `memmap-fonts`, `svgz`, `writer` (`flate2`/`base64`/`xmlwriter` are optional
# deps behind them) — all are disabled here to drop the font-shaping,
# system-font-loading and gzip machinery from the release binary.
# Static-path `<text>` is sacrificed as a result (silently skipped, see the
# `usvg::Node::Text` arm in `src/api/svg.rs`); the animation path's `<text>`
# support (Flutter `TextPainter`-based) is a fully separate implementation and
# is unaffected.
#
# 体积优化（2026-08-26 重新应用，fsvg→xvg 改名事故中被一次误操作的
# `git checkout` 丢弃后二次执行）：usvg 0.49 的可选 feature 为 `text`/`system-fonts`/
# `memmap-fonts`/`svgz`/`writer`（`flate2`/`base64`/`xmlwriter` 是挂在其后的
# 可选依赖），这里全部关闭，去掉字体排版/系统字体加载/gzip 相关代码以缩小
# release 体积。代价是静态路径的 `<text>` 不再展平为路径
# （静默跳过，见 `src/api/svg.rs` 的 `usvg::Node::Text` 分支）；动画路径的
# `<text>` 支持（基于 Flutter `TextPainter`，完全独立实现）不受影响。
usvg = { version = "0.49", default-features = false }
# CSS3/SVG named-colour table + `<transform-list>` grammar (MIT/Apache-2.0),
# the same crate usvg itself parses SVG values with. Backs `parse_color` /
# `parse_transform` so the Dart animation engine never hand-rolls either table.
#
# CSS3/SVG 具名颜色表 + `<transform-list>` 语法（MIT/Apache-2.0），与 usvg 自身
# 解析 SVG 取值用的是同一个 crate。为 `parse_color`/`parse_transform` 提供支撑，
# 使 Dart 动画引擎不必手写这两张表。
svgtypes = "0.16"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# FRB sync exports: parse_svg, parse_color, parse_transform and greet.
# init_app is #[frb(init)], dispatched through FRB's normal initialization path,
# not a #[frb(sync)] export. greet remains referenced by the Dart bindings.
# With panic="abort", catch_unwind is NOT a safety net (including init_app).
# Guard untrusted SVG with input-size and depth limits before usvg conversion;
# reject invalid/non-finite output explicitly instead of relying on unwinding.
# Source depth 128, reference depth 32 (debug + release 1 MiB probes).
# Every inline URL, marker shorthand, use/feImage/pattern/filter href share the
# graph (all duplicate-ID candidates). CSS follows simplecss 0.2.2 boundaries;
# ambiguous CSS links expanding resource interiors to non-gradient URL targets.
# No separate target-depth sum; gradient-only CSS always stays inline.
# <=4000 approximate rules/selectors, <=8,000,000 element-rule matches/CSS edges;
# No combinator count cap; sum(elements * depth^combinators) <=32,000,000.
# Checked recursive CSS references use a 64 MiB worker
# (32-bit: 16 MiB, unmeasured); gradient-only CSS parses inline.
# Conversion/Drop stay on the worker; recursive wire paints are checked there.
# wasm/no-thread targets parse inline. join cannot recover panic=abort/overflow;
# reject markup entities, embedded SVG images and cycles of >=3 resources
# before recursive parsing (one/two-resource cycles retain usvg semantics).
# Android/iOS and 32-bit stacks remain unmeasured; budgets are conservative,
# not a proof of all upstream recursion or a fixed CPU-time guarantee.
# The 64 MiB encoded-image output budget silently drops excess images.
# 输入上限 + 深度上限兜底，而不是 catch_unwind；保留 abort 的体积收益。
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
