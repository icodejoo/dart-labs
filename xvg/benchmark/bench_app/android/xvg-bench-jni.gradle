// 只替换本次基准的 :xvg JNI 输入，AGP 继续走正常打包流程。
def jniDir = file(providers.environmentVariable('XVG_BENCH_JNI_DIR').get())
if (!new File(jniDir, 'arm64-v8a/libxvg.so').isFile()) {
    throw new GradleException('XVG_BENCH_JNI_DIR must contain arm64-v8a/libxvg.so')
}
def xvg = project(':xvg')
xvg.plugins.withId('com.android.library') {
    xvg.androidComponents.finalizeDsl { android ->
        android.sourceSets.getByName('main').jniLibs.setSrcDirs([jniDir])
    }
}
