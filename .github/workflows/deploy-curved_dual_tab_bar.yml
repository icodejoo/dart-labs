name: Deploy curved_dual_tab_bar demo

on:
  push:
    branches: [main]
    paths:
      - 'curved_dual_tab_bar/lib/**'
      - 'curved_dual_tab_bar/example/lib/**'
      - 'curved_dual_tab_bar/example/web/**'
      - 'curved_dual_tab_bar/example/pubspec.yaml'
      - 'curved_dual_tab_bar/pubspec.yaml'
      - '.github/workflows/deploy-curved_dual_tab_bar.yml'
      - '.github/workflows/update-root-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-curved_dual_tab_bar
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy curved_dual_tab_bar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Package dependencies
        working-directory: curved_dual_tab_bar
        run: flutter pub get
      - name: Example dependencies
        working-directory: curved_dual_tab_bar/example
        run: flutter pub get
      - name: Build web
        working-directory: curved_dual_tab_bar/example
        run: flutter build web --release --base-href /dart-labs/curved_dual_tab_bar/
      - name: Deploy curved_dual_tab_bar/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: curved_dual_tab_bar/example/build/web
          destination_dir: curved_dual_tab_bar
          keep_files: true

  update-index:
    name: Update root index
    needs: deploy
    uses: ./.github/workflows/update-root-index.yml
    secrets: inherit
