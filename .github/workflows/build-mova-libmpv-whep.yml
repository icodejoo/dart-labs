name: Build mova libmpv WHEP

# WHEP 版 libmpv（ffmpeg n9.0.2 + whep demuxer + DTLS-SRTP，mpv v0.41.0）。
# 本 workflow 是 main 的正式 libmpv 构建（全平台以 n9 为主，n6 产物已从仓库移除）。
# 旧配方 build-mova-libmpv.yml（ffmpeg n6.0.1）仅作 Apple 平台移植参考，待 n9 的 Apple 构建落地后删除。
# 二进制不在本地入库，由本 workflow 编译后注入（沿用 "fetch+reset 重试 / 先 git lfs push / 再 push" 模式）：
#   - Android 四 ABI（arm64-v8a / armeabi-v7a / x86_64 / x86，矩阵构建）
#       -> mova/packages/media_kit_libs_android_video_slim_v041/android/src/main/jniLibs/<abi>/
#       libmpv.so（CI 编译）；libmediakitandroidhelper.so 是上游原样提取、已随包入库（同目录，不由 CI 改动）
#   - Windows x64   -> mova/libmpv/windows-x86_64-whep/{libmpv-2.dll,libmpv-2.def,libmpv.dll.a}
#       （目录名保持 -whep 不变，Windows 插件的 CMakeLists 直接引用）
#   - Linux         -> 只上传 artifact，不注入
# 以上路径均被 .gitattributes 的 LFS 规则覆盖（mova/packages/**/*.so、mova/libmpv/**）。
#
#   - iOS arm64 / iOS 模拟器 arm64 / macOS arm64+x86_64（apple-whep 矩阵 + apple-package）
#       Nix 流程：上游 media-kit/libmpv-darwin-build（钉 SHA）+ libmpv-darwin-build-mova-slim.patch
#       + libmpv-darwin-build-whep.patch（对齐 ffmpeg n9.0.2 / mpv v0.41.0 / libplacebo，TLS 换成静态 mbedtls + DTLS-SRTP）。
#       打包成 Mpv.xcframework 后直接替换：
#       mova/packages/media_kit_libs_{ios,macos}_video_slim/{ios,macos}/Frameworks/Mpv.xcframework/
#       设计与取舍见 mova-libmpv/doc/plans/2026-10-26-apple-whep-build-design.md。
#     需要证书/真机的部分 CI 做不了：macOS Developer ID 签名与公证、iOS 真机起播，见 README。
#
# 安全约束：
#   1. 触发只允许 main 的 push 与手动 dispatch；注入 step 要求 ref 必须是分支。
#   2. paths 过滤不含 mova/packages、mova/libmpv，且提交信息带 [skip ci]，产物提交不会再次触发本 workflow。
on:
  push:
    branches: [main]
    paths:
      - 'mova-libmpv/patches/ffmpeg-whep/**'
      - 'mova-libmpv/patches/mpv-v041/**'
      - 'mova-libmpv/patches/android-v041/**'
      - '!mova-libmpv/patches/android-v041/**.md'
      - 'mova-libmpv/tools/whep-flavor/build-*.sh'
      - 'mova-libmpv/flavors-mova-slim-n9.sh'
      - 'mova-libmpv/libmpv-darwin-build-mova-slim.patch'
      - 'mova-libmpv/libmpv-darwin-build-whep.patch'
      - 'mova-libmpv/patches/apple-n9/**'
      - 'mova-libmpv/tools/apple/**'
      - 'mova-libmpv/tools/whep-flavor/ci-platform'
      - '.github/workflows/build-mova-libmpv-whep.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform to build: android (all 4 ABIs) | windows | linux | apple (macOS+iOS) | macos | ios | all | none. auto = read mova-libmpv/tools/whep-flavor/ci-platform.'
        required: false
        default: auto
        type: choice
        options: [auto, android, windows, linux, apple, macos, ios, all, none]
      android_abi:
        description: 'Android 只构建指定 ABI（all | arm64-v8a | armeabi-v7a | x86_64 | x86），仅 dispatch 生效。'
        required: false
        default: all
        type: choice
        options: [all, arm64-v8a, armeabi-v7a, x86_64, x86]
      apple_reuse_run:
        description: '调试用：填一个已完成 run 的 id，Apple 切片直接取该 run 的 artifact，跳过 apple-whep 构建，只跑 apple-package。'
        required: false
        default: ''
        type: string
      commit_artifact:
        description: 'Commit built binaries back to the triggering branch (false = artifact upload only). On push to main this commits to main (with [skip ci]).'
        required: false
        default: true
        type: boolean

# 注入产物要 push 回分支，默认 GITHUB_TOKEN 只读，需显式授予写权限（LFS 对象上传同样需要）。
permissions:
  contents: write

# 同一分支同时只跑一个，避免两次触发的注入互相覆盖。
concurrency:
  group: build-mova-libmpv-whep-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 25.2.9519653
  NDK_ZIP_NAME: android-ndk-r25c-linux.zip
  # 注入目标（Android）：其下按 ABI 分目录（arm64-v8a / armeabi-v7a / x86_64 / x86）
  ANDROID_PKG_JNI_ROOT: mova/packages/media_kit_libs_android_video_slim_v041/android/src/main/jniLibs
  # 注入目标（Windows）
  WIN_WHEP_DIR: mova/libmpv/windows-x86_64-whep
  # Apple：上游构建仓库钉死到最近一次绿 run 实际用到的 commit（2026-09-14，原先没钉 ref，上游一动就可能无故变红）
  DARWIN_BUILD_REF: aadae8ce295dd15a222839c361c4c984ce9befb2
  # 注入目标（Apple）：直接替换 slim 包里的 xcframework
  IOS_PKG_FRAMEWORKS: mova/packages/media_kit_libs_ios_video_slim/ios/Frameworks
  MACOS_PKG_FRAMEWORKS: mova/packages/media_kit_libs_macos_video_slim/macos/Frameworks

jobs:
  # 每次只验证一个平台：由 dispatch 输入 platform 或仓库文件 ci-platform 决定（android|windows|linux|all|none）。
  # 流程：单平台逐个跑通 -> 把 ci-platform 改成 all 再整体构建一次。其余平台的 job 直接 skipped，不占 runner。
  plan:
    name: Select platform
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.sel.outputs.android }}
      windows: ${{ steps.sel.outputs.windows }}
      linux: ${{ steps.sel.outputs.linux }}
      apple: ${{ steps.sel.outputs.apple }}
      apple_full: ${{ steps.sel.outputs.apple_full }}
      apple_matrix: ${{ steps.sel.outputs.apple_matrix }}
      platform: ${{ steps.sel.outputs.platform }}
      android_matrix: ${{ steps.sel.outputs.android_matrix }}
    steps:
      - name: Checkout only the platform switch file
        uses: actions/checkout@v4
        with:
          sparse-checkout: mova-libmpv/tools/whep-flavor/ci-platform
          sparse-checkout-cone-mode: false

      - name: Decide platforms
        id: sel
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_ABI: ${{ inputs.android_abi }}
        run: |
          P="${INPUT_PLATFORM:-}"
          if [ -z "$P" ] || [ "$P" = auto ]; then P="$(tr -d ' \r\n' < mova-libmpv/tools/whep-flavor/ci-platform)"; fi
          case "$P" in
            android|windows|linux|apple|macos|ios|all|none) ;;
            *) echo "::error::invalid platform '$P' (want android|windows|linux|apple|macos|ios|all|none)"; exit 1 ;;
          esac
          for x in android windows linux; do
            if [ "$P" = "$x" ] || [ "$P" = all ]; then echo "$x=true" >> "$GITHUB_OUTPUT"; else echo "$x=false" >> "$GITHUB_OUTPUT"; fi
          done
          # Apple 矩阵：macos = arm64+x86_64；ios = 真机 arm64 + 模拟器 arm64；apple/all = 全部。
          # apple_full 为 true 时才跑 apple-package（xcframework 需要 macOS 与 iOS 的全部切片）。
          MAC='{"target":"macos-arm64","os":"macos","arch":"arm64","plat":"macos","archs":"arm64"},{"target":"macos-amd64","os":"macos","arch":"amd64","plat":"macos","archs":"x86_64"}'
          IOS='{"target":"ios-arm64","os":"ios","arch":"arm64","plat":"ios","archs":"arm64"},{"target":"iossimulator-arm64","os":"iossimulator","arch":"arm64","plat":"iossimulator","archs":"arm64"}'
          case "$P" in
            apple|all) AM="[$MAC,$IOS]"; echo "apple=true" >> "$GITHUB_OUTPUT"; echo "apple_full=true" >> "$GITHUB_OUTPUT" ;;
            macos) AM="[$MAC]"; echo "apple=true" >> "$GITHUB_OUTPUT"; echo "apple_full=false" >> "$GITHUB_OUTPUT" ;;
            ios) AM="[$IOS]"; echo "apple=true" >> "$GITHUB_OUTPUT"; echo "apple_full=false" >> "$GITHUB_OUTPUT" ;;
            *) AM='[]'; echo "apple=false" >> "$GITHUB_OUTPUT"; echo "apple_full=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "apple_matrix=$AM" >> "$GITHUB_OUTPUT"
          echo "platform=$P" >> "$GITHUB_OUTPUT"
          # Android 矩阵：按 android_abi 过滤（空/all 为全部）
          ALL='[{"arch":"arm64","abi":"arm64-v8a","optional":false},{"arch":"armv7l","abi":"armeabi-v7a","optional":false},{"arch":"x86_64","abi":"x86_64","optional":false},{"arch":"x86","abi":"x86","optional":true}]'
          A="${INPUT_ABI:-all}"
          if [ "$A" = all ]; then M="$ALL"; else M="$(echo "$ALL" | jq -c --arg a "$A" '[.[] | select(.abi == $a)]')"; fi
          echo "android_matrix=$M" >> "$GITHUB_OUTPUT"
          echo "### This run builds: $P" >> "$GITHUB_STEP_SUMMARY"

  android-whep:
    name: Android ${{ matrix.abi }} WHEP
    needs: plan
    if: ${{ needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-22.04
    # x86（32 位模拟器）为可选项：失败不拖垮整个 run，其余 ABI 照常注入。
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.android_matrix) }}
    # 全链从头构建（NDK + mbedtls/dav1d/libxml2/ffmpeg/freetype/libass/libplacebo/mpv）预计 40-90 分钟
    timeout-minutes: 150
    steps:
      - name: Checkout dart-labs (with LFS, for the helper .so)
        uses: actions/checkout@v4
        with:
          lfs: true

      # ubuntu runner 约 14GB 可用，NDK + 全部依赖源码 + 中间产物会很紧，先清掉用不到的大块。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip
          # 与默认 workflow 同一个 pin（apt 的 meson 太旧）
          pip3 install --user "meson==1.3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # NDK 直接从 Google CDN 取（sdkmanager 很慢），按版本缓存目录。
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/ndk/android-ndk-r25c
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK r25c
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ndk
          curl -fsSL -o "$RUNNER_TEMP/$NDK_ZIP_NAME" "https://dl.google.com/android/repository/$NDK_ZIP_NAME"
          unzip -q "$RUNNER_TEMP/$NDK_ZIP_NAME" -d ~/ndk
          rm -f "$RUNNER_TEMP/$NDK_ZIP_NAME"
          test -d ~/ndk/android-ndk-r25c

      # e2e-arm64.sh 要求工作目录不存在 ws/；全部在 RUNNER_TEMP 下做，不污染仓库工作区。
      # 脚本内部已含 download-deps 重试、url.insteadOf 镜像（GitHub 上也无害）。
      - name: Build WHEP libmpv (e2e-arm64.sh, ARCH=${{ matrix.arch }})
        env:
          WHEP: '1'
          JOBS: '4'
          ARCH: ${{ matrix.arch }}
        run: |
          bash mova-libmpv/patches/android-v041/e2e-arm64.sh "$RUNNER_TEMP/whep-android" "$HOME/ndk/android-ndk-r25c" 2>&1 | tee "$RUNNER_TEMP/e2e.log" | tail -n 400
          test "${PIPESTATUS[0]}" = 0
          grep -q E2E_DONE "$RUNNER_TEMP/e2e.log"
          test -f "$RUNNER_TEMP/whep-android/libmpv.${{ matrix.abi }}.stripped.so"

      - name: Verify symbols and report size
        run: |
          set -e
          NDK_TC=$(echo "$HOME"/ndk/android-ndk-r25c/toolchains/llvm/prebuilt/*)
          NM="$NDK_TC/bin/llvm-nm"
          STRIPPED="$RUNNER_TEMP/whep-android/libmpv.${{ matrix.abi }}.stripped.so"
          UNSTRIPPED="$RUNNER_TEMP/whep-android/libmpv.${{ matrix.abi }}.unstripped.so"
          fail=0
          # 导出符号（strip 后仍在动态符号表里）
          for s in mpv_lavc_set_java_vm mpv_create_weak_client mpv_wait_event; do
            "$NM" -D --defined-only "$STRIPPED" | grep -qw "$s" && echo "OK exported: $s" \
              || { echo "::error::missing exported symbol $s"; fail=1; }
          done
          # 局部符号（strip 后消失，只能查未 strip 版）
          for s in ff_whep_demuxer ff_dtls_protocol ff_h264_mediacodec_decoder ff_hevc_mediacodec_decoder ff_vp9_mediacodec_decoder ff_av1_mediacodec_decoder; do
            "$NM" "$UNSTRIPPED" | grep -qw "$s" && echo "OK symbol (unstripped): $s" \
              || { echo "::error::missing symbol $s in unstripped build"; fail=1; }
          done
          # 已摘除 vo_gpu_next
          if grep -aq "gpu-next" "$STRIPPED"; then
            echo "::error::'gpu-next' string still present - vo_gpu_next patch not effective"; fail=1
          else
            echo "OK: no gpu-next"
          fi
          test "$fail" = 0 || exit 1
          BYTES=$(stat -c%s "$STRIPPED")
          SHA=$(sha256sum "$STRIPPED" | cut -d' ' -f1)
          echo "libmpv.stripped.so: $BYTES bytes ($(numfmt --to=iec-i --suffix=B "$BYTES")), sha256=$SHA"
          {
            echo "### WHEP libmpv.so (android ${{ matrix.abi }})"
            echo "- size: $BYTES bytes ($(numfmt --to=iec-i --suffix=B "$BYTES"))"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$STRIPPED" "$GITHUB_WORKSPACE/libmpv-${{ matrix.abi }}-whep.so"
          # helper 已随 v041 包入库（LFS），这里只确认 checkout 拿到的是真 ELF，注入时不再拷贝
          head -c 4 "$ANDROID_PKG_JNI_ROOT/${{ matrix.abi }}/libmediakitandroidhelper.so" | grep -q ELF || { echo "::error::helper .so is missing or an LFS pointer, not a real ELF"; exit 1; }

      - name: Upload build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-android-${{ matrix.abi }}-whep-e2e-log
          path: ${{ runner.temp }}/e2e.log
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-android-${{ matrix.abi }}-whep
          path: libmpv-${{ matrix.abi }}-whep.so
          retention-days: 30

      - name: Commit built artifact to packages/ (current branch only)
        # 必须是分支 ref；dispatch 且 commit_artifact=false 时跳过。
        if: ${{ startsWith(github.ref, 'refs/heads/') && (github.event_name != 'workflow_dispatch' || inputs.commit_artifact) }}
        env:
          BRANCH: ${{ github.ref_name }}
          ABI: ${{ matrix.abi }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ANDROID_PKG_JNI="$ANDROID_PKG_JNI_ROOT/$ABI"
          # -f：本地 .gitignore 忽略了该包的 *.so，CI 注入必须强制加入
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p "$ANDROID_PKG_JNI"
            cp "$GITHUB_WORKSPACE/libmpv-$ABI-whep.so" "$ANDROID_PKG_JNI/libmpv.so"
            # helper 已在包内（reset --hard 后仍在），不再拷贝，只注入 libmpv.so
            git add -f "$ANDROID_PKG_JNI/libmpv.so"
            if git diff --cached --quiet; then
              echo "No content change, skip commit"
              exit 0
            fi
            git commit -m "chore(packages): inject WHEP libmpv.so (android $ABI) [skip ci]"
            # checkout 不装 LFS 钩子时普通 push 只推指针，先显式推 LFS 对象
            git lfs push origin HEAD
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            echo "push rejected (race with sibling job), retrying from a fresh baseline ($i/5)..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push WHEP android $ABI artifact after retries"
          exit 1

  windows-whep:
    name: Windows x86_64 WHEP
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-latest
    # 本机 20 核约 12 分钟；runner 只有 4 核，预计 40-80 分钟（ffmpeg 占大头）
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      # 依赖清单说明（S 档瘦身，见 mova-libmpv/doc/notes/2026-10-02-windows-s-tier-landed.md）：
      # libass/freetype/harfbuzz/win-iconv 由 build-windows.sh 钉 tag 源码构建（libass 仅 DirectWrite、无 fontconfig），
      # 所以不再装它们的 pacman 版（装了反而让 meson 可能选中 GNU libiconv/fontconfig）；
      # fribidi/libunibreak/zlib 仍用 pacman 的静态库（libass/freetype 的必需依赖，随 runner MSYS2 快照漂移）。
      # 源码构建需联网 clone win-iconv(github)、freetype(gitlab.freedesktop.org)、harfbuzz、libass。
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-jinja
            mingw-w64-x86_64-python-mako
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-libunibreak
            mingw-w64-x86_64-zlib

      - name: Pin meson via pip
        run: pip3 install "meson==1.3.2"

      - name: Resolve MSYS-style workspace path
        run: echo "WS=$(cygpath -u "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

      # build-windows.sh 默认 WORK 写死本机路径，这里指到 runner 工作区下（不入库：下面 add 只加指定文件）。
      - name: Build WHEP libmpv-2.dll
        env:
          MODE: whep
          TAG: whep
          WITH_WHEP: '1'
          WORK: ${{ env.WS }}/_whep-win
        run: |
          cd mova-libmpv
          bash tools/whep-flavor/build-windows.sh
          test -f "$WORK/whep/out/libmpv-2.dll"

      - name: Stage artifact and regress symbol check
        run: |
          OUT="$WS/_whep-win/whep/out"
          # check-symbols-windows.sh 约定 $LIBMPV_DIR/windows-x86_64/libmpv-2.dll（仅 CI 临时目录，非仓库路径）
          mkdir -p "$WS/_regress/windows-x86_64" "$WS/_stage"
          cp "$OUT/libmpv-2.dll" "$WS/_regress/windows-x86_64/libmpv-2.dll"
          cp "$OUT/libmpv-2.dll" "$OUT/libmpv-2.def" "$OUT/libmpv.dll.a" "$WS/_stage/"
          BYTES=$(stat -c%s "$OUT/libmpv-2.dll")
          SHA=$(sha256sum "$OUT/libmpv-2.dll" | cut -d' ' -f1)
          echo "libmpv-2.dll: $BYTES bytes, sha256=$SHA"
          {
            echo "### WHEP libmpv-2.dll (windows x86_64)"
            echo "- size: $BYTES bytes"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-windows-x86_64-whep
          path: |
            _stage/libmpv-2.dll
            _stage/libmpv-2.def
            _stage/libmpv.dll.a
          retention-days: 30

      # 放在 upload 之后：检查失败时二进制仍可下载排查，但不会被注入。
      - name: Regress symbol check
        env:
          LIBMPV_DIR: ${{ env.WS }}/_regress
          FFCONF_LOG: ${{ env.WS }}/_whep-win/whep/out/ffconf.log
        run: bash mova-libmpv/tools/regress/check-symbols-windows.sh

      # 与 job 级 `shell: msys2 {0}` 区分：此步只需 git/git-lfs，msys2 的 PATH 里没有 git-lfs.exe
      #（默认 workflow 2026-09-17 踩过：pre-push 报 git-lfs not found）。
      - name: Commit built artifact (current branch only)
        if: ${{ startsWith(github.ref, 'refs/heads/') && (github.event_name != 'workflow_dispatch' || inputs.commit_artifact) }}
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 产物目录 mova/libmpv/windows-x86_64-whep/（名字不改），由 media_kit_libs_windows_video_slim 的 CMakeLists 引用。
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p "$WIN_WHEP_DIR"
            cp "$WS/_stage/libmpv-2.dll" "$WS/_stage/libmpv-2.def" "$WS/_stage/libmpv.dll.a" "$WIN_WHEP_DIR/"
            git add -f "$WIN_WHEP_DIR"
            if git diff --cached --quiet; then
              echo "No content change, skip commit"
              exit 0
            fi
            git commit -m "chore(libmpv): inject WHEP libmpv-2.dll and devlib (windows x86_64) [skip ci]"
            git lfs push origin HEAD
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            echo "push rejected, retrying from a fresh baseline ($i/5)..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push WHEP windows artifact after retries"
          exit 1

  # 可选：Linux 冒烟，仅上传 artifact，不注入。
  linux-whep:
    name: Linux x86_64 WHEP (smoke, artifact only)
    needs: plan
    if: ${{ needs.plan.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip \
            libass-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libdav1d-dev \
            libssl-dev libvpx-dev zlib1g-dev libva-dev libvdpau-dev
          pip3 install --user "meson==1.3.2" jinja2 mako
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build WHEP libmpv.so
        env:
          WITH_WHEP: '1'
          WORK: ${{ runner.temp }}/whep-linux
          JOBS: '4'
        run: bash mova-libmpv/tools/whep-flavor/build-linux.sh

      - name: Smoke check and report
        run: |
          SO="$RUNNER_TEMP/whep-linux/out/linux-x86_64/libmpv.so"
          test -f "$SO"
          nm -D --defined-only "$SO" | grep -qw mpv_create
          nm -D --defined-only "$SO" | grep -qw mpv_create_weak_client
          BYTES=$(stat -c%s "$SO")
          echo "libmpv.so: $BYTES bytes, sha256=$(sha256sum "$SO" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$SO" "$GITHUB_WORKSPACE/libmpv-linux-x86_64-whep.so"
          cp "$RUNNER_TEMP/whep-linux/out/ffconf.log" "$GITHUB_WORKSPACE/ffconf-linux-whep.log" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-linux-x86_64-whep
          path: |
            libmpv-linux-x86_64-whep.so
            ffconf-linux-whep.log
          retention-days: 14

  # Apple（iOS 真机 / iOS 模拟器 / macOS arm64 / macOS x86_64）：Nix + 上游 libmpv-darwin-build 叠两份补丁。
  # 每个切片一条腿，产物是单文件 libmpv.dylib（ffmpeg/mpv/dav1d/libass/mbedtls/libplacebo 全静态折进去），
  # 之后由 apple-package 合成 universal 并装配成 Mpv.xcframework。
  apple-whep:
    name: Apple ${{ matrix.target }} WHEP
    needs: plan
    if: ${{ needs.plan.outputs.apple == 'true' && inputs.apple_reuse_run == '' }}
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apple_matrix) }}
    steps:
      - name: Platform info
        run: sw_vers; uname -m; xcodebuild -version; ls /Applications | grep -i xcode || true

      - name: Checkout dart-labs
        uses: actions/checkout@v4
        with:
          path: dart-labs

      - name: Checkout libmpv-darwin-build (pinned)
        uses: actions/checkout@v4
        with:
          repository: media-kit/libmpv-darwin-build
          path: build-root
          ref: ${{ env.DARWIN_BUILD_REF }}

      # Nix 的 git+file:// flake 源只看被 git 跟踪的文件：新增文件必须 git add（只要进 index，不用提交），
      # 否则报 "Path ... is not tracked by Git"。patches/mova 下放 mova 自己的补丁，由 default.nix 引用。
      - name: Apply mova patches
        working-directory: build-root
        run: |
          set -e
          git apply ../dart-labs/mova-libmpv/libmpv-darwin-build-mova-slim.patch
          git apply ../dart-labs/mova-libmpv/libmpv-darwin-build-whep.patch
          mkdir -p patches/mova
          cp -r ../dart-labs/mova-libmpv/patches/ffmpeg-whep ../dart-labs/mova-libmpv/patches/mpv-v041 ../dart-labs/mova-libmpv/patches/apple-n9 patches/mova/
          rm -f patches/mova/*/README.md
          git add -A
          git status --short | head -50

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Resolve Xcode path
        id: xcode
        run: |
          if [ -d /Applications/Xcode_16.1.0.app ]; then
            echo "path=$(realpath /Applications/Xcode_16.1.0.app)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Xcode_16.1.0.app not found, falling back to xcode-select's default ($(xcode-select -p))"
            echo "path=$(xcode-select -p | sed 's|/Contents/Developer||')" >> "$GITHUB_OUTPUT"
          fi

      # TARGET 命名：<package>-<format>-<os>-<arch>-<variant>-<flavor>
      - name: Build (${{ matrix.target }}, movaslim flavor, n9 + whep)
        working-directory: build-root
        run: nix develop -c make TARGET=mk-out-archive-libs-${{ matrix.os }}-${{ matrix.arch }}-video-movaslim XCODE_PATH="${{ steps.xcode.outputs.path }}" VERSION=mova-ci

      - name: Extract
        working-directory: build-root
        run: |
          set -e
          ARCHIVE=$(find -L result -name '*.tar.gz' | head -1)
          test -n "$ARCHIVE" || { echo "::error::no .tar.gz archive in result/"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out/raw"
          tar -xzf "$ARCHIVE" -C "$GITHUB_WORKSPACE/out/raw"
          find "$GITHUB_WORKSPACE/out/raw" -type f | sort
          DYLIB=$(find "$GITHUB_WORKSPACE/out/raw" -name 'libmpv.dylib' | head -1)
          test -n "$DYLIB" || { echo "::error::libmpv.dylib not found"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out/${{ matrix.target }}"
          cp "$DYLIB" "$GITHUB_WORKSPACE/out/${{ matrix.target }}/libmpv.unstripped.dylib"
          cp "$DYLIB" "$GITHUB_WORKSPACE/out/${{ matrix.target }}/libmpv.dylib"
          chmod u+w "$GITHUB_WORKSPACE/out/${{ matrix.target }}"/*.dylib
          # 配置日志：核对 ffmpeg 的 TLS/WHEP 配置、mpv 的特性开关
          # strip：-S 去调试符号、-x 去局部符号；导出表（mpv_*）不受影响
          strip -S -x "$GITHUB_WORKSPACE/out/${{ matrix.target }}/libmpv.dylib"
          ls -l "$GITHUB_WORKSPACE/out/${{ matrix.target }}"

      - name: Collect configure logs
        if: always()
        run: |
          mkdir -p out/logs
          for d in /nix/store/*-ffmpeg-*; do
            [ -f "$d/share/ffmpeg/configure.log" ] && cp "$d/share/ffmpeg/configure.log" "out/logs/ffmpeg-configure-$(basename $d).log" || true
          done
          for d in /nix/store/*-mpv-*; do
            [ -f "$d/share/mpv/configure.log" ] && cp "$d/share/mpv/configure.log" "out/logs/mpv-configure-$(basename $d).log" || true
          done
          ls -la out/logs || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-${{ matrix.target }}-whep
          path: |
            out/${{ matrix.target }}/
            out/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Mach-O check (deps whitelist / platform / exports / version strings)
        run: |
          STRICT_EXPORTS=1 bash dart-labs/mova-libmpv/tools/apple/apple-macho-check.sh \
            "out/${{ matrix.target }}/libmpv.dylib" "${{ matrix.plat }}" "${{ matrix.archs }}" 2>&1 | tee macho.log
          test "${PIPESTATUS[0]}" = 0
          {
            echo "### ${{ matrix.target }} libmpv.dylib"
            echo '```'
            tail -n 5 macho.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 把四个切片装配成 Mpv.xcframework（iOS 真机+模拟器、macOS universal），做端到端冒烟与 Flutter 链接检查，
  # 通过后直接替换 slim 包里的 xcframework（注入沿用 "fetch+reset 重试 / 先 git lfs push / 再 push"）。
  apple-package:
    name: Apple xcframework package + verify
    needs: [plan, apple-whep]
    # apple-whep 被 apple_reuse_run 跳过时也要跑（此时切片取自指定 run）
    if: ${{ !cancelled() && needs.plan.outputs.apple_full == 'true' && (needs.apple-whep.result == 'success' || needs.apple-whep.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: '3.47.0'
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Download slices
        if: ${{ inputs.apple_reuse_run == '' }}
        uses: actions/download-artifact@v4
        with:
          path: art
          pattern: mova-libmpv-*-whep
          merge-multiple: false

      - name: Download slices (reuse run ${{ inputs.apple_reuse_run }})
        if: ${{ inputs.apple_reuse_run != '' }}
        uses: actions/download-artifact@v4
        with:
          path: art
          pattern: mova-libmpv-*-whep
          merge-multiple: false
          run-id: ${{ inputs.apple_reuse_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect slices
        run: |
          set -e
          find art -maxdepth 3 | sort | head -40
          mkdir -p slices
          for t in macos-arm64 macos-amd64 ios-arm64 iossimulator-arm64; do
            src=$(find art -path "*/$t/libmpv.dylib" | head -1)
            test -n "$src" || { echo "::error::缺少切片 $t"; exit 1; }
            mkdir -p "slices/$t"; cp "$src" "slices/$t/libmpv.dylib"
          done
          ls -l slices/*/

      - name: Assemble xcframeworks
        run: bash mova-libmpv/tools/apple/apple-xcframework.sh slices pkg

      - name: Pack (tar keeps framework symlinks)
        run: |
          tar -czf mova-libmpv-apple-xcframeworks.tar.gz -C pkg ios/Mpv.xcframework macos/Mpv.xcframework
          ls -l mova-libmpv-apple-xcframeworks.tar.gz

      - name: Upload xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-apple-whep-xcframeworks
          path: mova-libmpv-apple-xcframeworks.tar.gz
          retention-days: 30

      - name: Mach-O check on packaged frameworks
        run: |
          set -e
          export STRICT_EXPORTS=1
          C=mova-libmpv/tools/apple/apple-macho-check.sh
          bash $C pkg/ios/Mpv.xcframework/ios-arm64/Mpv.framework/Mpv ios "arm64" "@rpath/Mpv.framework/Mpv"
          bash $C pkg/ios/Mpv.xcframework/ios-arm64-simulator/Mpv.framework/Mpv iossimulator "arm64" "@rpath/Mpv.framework/Mpv"
          bash $C pkg/macos/Mpv.xcframework/macos-arm64_x86_64/Mpv.framework/Versions/A/Mpv macos "arm64 x86_64" "@rpath/Mpv.framework/Mpv"
          codesign -vvv pkg/macos/Mpv.xcframework/macos-arm64_x86_64/Mpv.framework
          codesign -vvv pkg/ios/Mpv.xcframework/ios-arm64/Mpv.framework
          codesign -vvv pkg/ios/Mpv.xcframework/ios-arm64-simulator/Mpv.framework

      - name: WHEP end-to-end smoke (macOS arm64 native + iOS simulator)
        timeout-minutes: 30
        env:
          SIM_FRAMEWORK_DIR: ${{ github.workspace }}/pkg/ios/Mpv.xcframework/ios-arm64-simulator
          SIM_OPTIONAL: '1'
          WORK: ${{ runner.temp }}/e2e-arm64
        run: |
          FW="$GITHUB_WORKSPACE/pkg/macos/Mpv.xcframework/macos-arm64_x86_64"
          bash mova-libmpv/tools/apple/whep-e2e.sh "$FW/Mpv.framework/Versions/A/Mpv" arm64 "$FW" 2>&1 | tee e2e-arm64.log
          test "${PIPESTATUS[0]}" = 0

      - name: WHEP smoke (macOS x86_64 via Rosetta)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SKIP_HTTPS: '1'
          WORK: ${{ runner.temp }}/e2e-x86_64
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          arch -x86_64 /usr/bin/true || { echo "::warning::runner 上没有 Rosetta，跳过 x86_64 运行验证（仅做了静态 Mach-O 检查）"; exit 0; }
          FW="$GITHUB_WORKSPACE/pkg/macos/Mpv.xcframework/macos-arm64_x86_64"
          bash mova-libmpv/tools/apple/whep-e2e.sh "$FW/Mpv.framework/Versions/A/Mpv" x86_64 "$FW" 2>&1 | tee e2e-x86_64.log
          test "${PIPESTATUS[0]}" = 0

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-apple-e2e-logs
          path: |
            e2e-*.log
            ${{ runner.temp }}/e2e-arm64/*.log
            ${{ runner.temp }}/e2e-x86_64/*.log
          if-no-files-found: ignore
          retention-days: 14

      # ---- Flutter 链接检查：把新 xcframework 放进 slim 包，用 mova/example 编 macOS 与 iOS ----
      - name: Install into slim packages (workspace only)
        if: ${{ !cancelled() }}
        run: |
          set -e
          rm -rf "$IOS_PKG_FRAMEWORKS/Mpv.xcframework" "$MACOS_PKG_FRAMEWORKS/Mpv.xcframework"
          mkdir -p "$IOS_PKG_FRAMEWORKS" "$MACOS_PKG_FRAMEWORKS"
          cp -a pkg/ios/Mpv.xcframework "$IOS_PKG_FRAMEWORKS/"
          cp -a pkg/macos/Mpv.xcframework "$MACOS_PKG_FRAMEWORKS/"
          ls -la "$IOS_PKG_FRAMEWORKS" "$MACOS_PKG_FRAMEWORKS"

      - uses: subosito/flutter-action@v2
        if: ${{ !cancelled() }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get (example with slim overrides)
        if: ${{ !cancelled() }}
        working-directory: mova/example
        run: |
          printf 'dependency_overrides:\n  media_kit_libs_ios_video:\n    path: ../packages/media_kit_libs_ios_video_slim\n  media_kit_libs_macos_video:\n    path: ../packages/media_kit_libs_macos_video_slim\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml
          flutter --version
          flutter pub get

      - name: flutter build ios --simulator --no-codesign
        if: ${{ !cancelled() }}
        working-directory: mova/example
        run: |
          RC=0
          flutter build ios --no-codesign --simulator -v > ../../build-ios-sim.log 2>&1 || RC=$?
          grep -aE 'ignoring file|built for|ld: |Undefined symbols|referenced from|-arch |ARCHS=|EXCLUDED_ARCHS=' ../../build-ios-sim.log | cut -c1-300 | sort | uniq -c | sort -rn | head -40
          ls -la ../packages/media_kit_libs_ios_video_slim/ios/Frameworks/.symlinks/mpv/ || true
          tail -n 30 ../../build-ios-sim.log
          test "$RC" = 0

      - name: flutter build ios --no-codesign (device)
        if: ${{ !cancelled() }}
        working-directory: mova/example
        run: |
          flutter build ios --no-codesign 2>&1 | tee ../../build-ios.log | tail -n 120
          test "${PIPESTATUS[0]}" = 0

      - name: flutter build macos
        if: ${{ !cancelled() }}
        working-directory: mova/example
        run: |
          # example 目录没有 macos 工程，CI 里临时生成（不入库）
          flutter create --platforms=macos --org net.tbu --project-name mova_example . >/dev/null
          flutter build macos 2>&1 | tee ../../build-macos.log | tail -n 120
          test "${PIPESTATUS[0]}" = 0

      - name: Verify linked apps embed our Mpv.framework
        if: ${{ !cancelled() }}
        working-directory: mova/example
        run: |
          set -e
          APP=$(find build/macos -name '*.app' -maxdepth 6 | head -1)
          echo "macOS app: $APP"
          ls "$APP/Contents/Frameworks" | head -30
          test -f "$APP/Contents/Frameworks/Mpv.framework/Versions/A/Mpv"
          otool -L "$APP/Contents/Frameworks/Mpv.framework/Versions/A/Mpv" | head
          IOSAPP=$(find build/ios -name 'Runner.app' -maxdepth 5 | head -1)
          echo "iOS app: $IOSAPP"
          test -f "$IOSAPP/Frameworks/Mpv.framework/Mpv"

      - name: Upload flutter build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-apple-flutter-build-logs
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit xcframeworks into slim packages (current branch only)
        if: ${{ startsWith(github.ref, 'refs/heads/') && (github.event_name != 'workflow_dispatch' || inputs.commit_artifact) }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/stage" && mkdir -p "$RUNNER_TEMP/stage"
          cp -a pkg/ios/Mpv.xcframework "$RUNNER_TEMP/stage/ios.xcframework"
          cp -a pkg/macos/Mpv.xcframework "$RUNNER_TEMP/stage/macos.xcframework"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            rm -rf "$IOS_PKG_FRAMEWORKS/Mpv.xcframework" "$MACOS_PKG_FRAMEWORKS/Mpv.xcframework"
            mkdir -p "$IOS_PKG_FRAMEWORKS" "$MACOS_PKG_FRAMEWORKS"
            cp -a "$RUNNER_TEMP/stage/ios.xcframework" "$IOS_PKG_FRAMEWORKS/Mpv.xcframework"
            cp -a "$RUNNER_TEMP/stage/macos.xcframework" "$MACOS_PKG_FRAMEWORKS/Mpv.xcframework"
            git add -A -f "$IOS_PKG_FRAMEWORKS" "$MACOS_PKG_FRAMEWORKS"
            if git diff --cached --quiet; then
              echo "No content change, skip commit"
              exit 0
            fi
            git commit -m "chore(packages): inject WHEP Mpv.xcframework (iOS device+simulator, macOS universal) [skip ci]"
            git lfs push origin HEAD
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            echo "push rejected, retrying from a fresh baseline ($i/5)..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push Apple xcframeworks after retries"
          exit 1
