name: xvg prebuilt artifacts

# Produces the precompiled native libraries that xvg commits under
# `xvg/prebuilt/` (see xvg/PRECOMPILED_MIGRATION_PLAN.md).
#
# This is deliberately NOT part of xvg-ci.yml and deliberately NOT run on every
# push: a full `-Z build-std` + LTO release build for 13 target slices across
# three runner operating systems is expensive, and the artifacts only need to
# change when rust/** changes. xvg-ci.yml's cheap `cargo check` matrix is what
# guards every push.
#
# 产出 xvg 提交在 `xvg/prebuilt/` 下的预编译原生库。刻意不放进 xvg-ci.yml、也
# 刻意不在每次 push 上跑：13 个 slice 的完整 `-Z build-std` + LTO release 构建横跨
# 三种 runner 操作系统，代价很高，而产物只在 rust/** 变化时才需要更新。
#
# How to use / 用法:
#   1. Actions -> "xvg prebuilt artifacts" -> Run workflow.
#   2. Download the `xvg-prebuilt` artifact from the finished run.
#   3. Unzip it over `xvg/prebuilt/` in a local checkout.
#   4. `cd xvg && dart run tool/build_prebuilt.dart --restage`
#      (regenerates MANIFEST.json from the files now on disk)
#   5. `dart run tool/check_prebuilt.dart` -> must print OK, then commit.
#
# Step 3-5 is also how the Apple slices get produced without owning a Mac: the
# macos-latest runner builds them, you just commit the result.
#
# 第 3-5 步也是“没有 Mac 也能产出 Apple slice”的做法：macos-latest runner 负责构建，
# 你只需要把结果提交进来。
on:
  workflow_dispatch:
    inputs:
      legs:
        description: >-
          Comma-separated matrix legs to build (android,linux,windows,apple).
          Narrow this to iterate on one platform without paying for the rest.
        default: android,linux,windows,apple
      apple_groups:
        description: >-
          Groups the apple leg builds, e.g. `--group ios` for iOS only.
        default: --group ios --group macos
  push:
    tags:
      - 'xvg-v*'

env:
  FLUTTER_VERSION: '3.47.0'
  ANDROID_NDK_VERSION: '28.0.13004108'
  # A partial run (fewer legs, or a narrowed apple group set) cannot produce a
  # complete `prebuilt/` tree, so the `collect` job — which enforces exactly
  # that completeness — only runs for a full one.
  #
  # 部分运行（少跑几条 leg，或收窄 apple 的 group）不可能产出完整的 `prebuilt/`
  # 树，因此专门校验完整性的 `collect` job 只在完整运行时执行。
  FULL_LEGS: android,linux,windows,apple
  FULL_APPLE_GROUPS: --group ios --group macos

jobs:
  # Turns the dispatch inputs into the matrix actually run. A matrix cannot be
  # filtered by a job-level `if` (the `matrix` context is not available there),
  # so the filtering has to happen before the matrix exists.
  #
  # 把 dispatch 输入转成实际运行的矩阵。矩阵无法用 job 级 `if` 过滤（那里拿不到
  # `matrix` 上下文），所以必须在矩阵产生之前就筛好。
  plan:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        shell: bash
        env:
          LEGS: ${{ inputs.legs || env.FULL_LEGS }}
          APPLE_GROUPS: ${{ inputs.apple_groups || env.FULL_APPLE_GROUPS }}
        run: |
          # The linux leg is pinned: the glibc floor of the shipped .so is the
          # build image's glibc, and ubuntu-latest (26.04) raised it to 2.43.
          # ubuntu-24.04 keeps the documented GLIBC_2.34 floor.
          # The android leg is pinned too: its arm64 slice built on 26.04
          # (run 42137131487) crashed on device at startup (SIGSEGV in
          # frb_init_frb_dart_api_dl); the same NDK on 24.04 (run 42141378840)
          # was verified on device. Do not move either leg without a device test.
          # linux leg 固定版本：产物的 glibc 下限取决于构建镜像，ubuntu-latest
          # （26.04）会把它抬到 2.43；ubuntu-24.04 保持文档约定的 GLIBC_2.34。
          # android leg 同样固定：26.04 上编的 arm64 库真机启动即 SIGSEGV
          # （run 42137131487），同一 NDK 换 24.04 后真机验证正常（run 42141378840）。
          # 两条 leg 换镜像前都必须先上真机验证。
          all=$(jq -nc --arg ag "$APPLE_GROUPS" '[
            {name:"android", os:"ubuntu-24.04",   groups:"--group android"},
            {name:"linux",   os:"ubuntu-24.04",   groups:"--group linux"},
            {name:"windows", os:"windows-latest", groups:"--group windows"},
            {name:"apple",   os:"macos-latest",   groups:$ag}
          ]')
          matrix=$(jq -c --arg legs "$LEGS" \
            '[.[] | select(.name as $n | ($legs | split(",")) | index($n))]' <<<"$all")
          [ "$(jq length <<<"$matrix")" -gt 0 ] \
            || { echo "::error::legs=$LEGS matches no known leg"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$LEGS" = "$FULL_LEGS" ] && [ "$APPLE_GROUPS" = "$FULL_APPLE_GROUPS" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "::warning::partial run (legs=$LEGS, apple_groups=$APPLE_GROUPS) — the collect job is skipped."
          fi
          echo "matrix: $matrix"

  build:
    name: Build ${{ matrix.name }} slices
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The pinned dated nightly plus rust-src is what makes
      # `-Z build-std=std,panic_abort` + `-Cpanic=immediate-abort` possible;
      # that combination recompiles std with the immediate-abort panic strategy
      # and shrinks the shipped library by roughly 21%. The version lives in
      # xvg/tool/prebuilt_common.dart (kToolchain) — this reads it from there
      # rather than duplicating the string, so there is exactly one source of
      # truth.
      - name: Resolve pinned toolchain
        id: tc
        shell: bash
        run: |
          # sed instead of `grep -oP` (Perl regex `\K`): the macos-latest
          # runner's /usr/bin/grep is BSD grep, which rejects -P outright
          # ("invalid option -- P"). sed's basic substitution is portable
          # across BSD and GNU.
          #
          # 用 sed 而不是 `grep -oP`(Perl 正则 `\K`):macos-latest runner 的
          # /usr/bin/grep 是 BSD grep,直接拒绝 -P("invalid option -- P")。
          # sed 的基础替换语法在 BSD/GNU 上都通用。
          tc=$(sed -n "s/.*kToolchain = '\([^']*\)'.*/\1/p" xvg/tool/prebuilt_common.dart)
          echo "toolchain=$tc" >> "$GITHUB_OUTPUT"
          echo "pinned toolchain: $tc"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.toolchain }}
          components: rust-src

      - name: Install Android NDK
        if: matrix.name == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install aarch64 Linux cross compiler
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Package dependencies
        working-directory: xvg
        run: flutter pub get

      - name: Add Rust target triples
        working-directory: xvg
        shell: bash
        run: |
          for t in $(dart run tool/build_prebuilt.dart --list | awk '{print $2}'); do
            rustup target add --toolchain ${{ steps.tc.outputs.toolchain }} "$t" || true
          done

      # Every leg uploads the whole `prebuilt/` tree, and `collect` merges the
      # uploads with last-writer-wins. Without this step a leg also uploads the
      # *checked-out* (possibly stale) slices of other platforms, which can
      # overwrite the fresh build of that platform — run 42137131487 shipped
      # the committed pre-`commands` Linux .so this way. Start each leg empty
      # so it uploads only what it built.
      # 每条 leg 上传整个 `prebuilt/`，`collect` 合并时后写覆盖先写。不清空的话，
      # leg 会连带上传检出的（可能已过期的）其它平台产物，覆盖该平台的新构建——
      # run 42137131487 就这样把仓库里旧线格式的 Linux .so 发了出来。每条 leg
      # 从空目录开始，只上传自己构建的产物。
      - name: Drop checked-out prebuilt slices
        shell: bash
        working-directory: xvg
        run: rm -rf prebuilt ios/xvg.xcframework macos/xvg.framework

      - name: Build artifacts
        working-directory: xvg
        run: dart run tool/build_prebuilt.dart ${{ matrix.groups }}

      - name: Verify Android 16 KB page alignment
        if: matrix.name == 'android'
        working-directory: xvg
        run: |
          fail=0
          for so in prebuilt/android/jniLibs/*/libxvg.so; do
            # -W required — see the matching comment in xvg-ci.yml's "Assert
            # 16 KB page alignment in the APK" step for why (GNU readelf wraps
            # 64-bit ELF program headers onto two lines without it).
            aligns=$(readelf -lW "$so" | awk '/^  LOAD/ {print $NF}' | sort -u)
            echo "$so -> $aligns"
            for a in $aligns; do
              [ "$a" = "0x4000" ] || { echo "::error::$so LOAD align $a != 0x4000"; fail=1; }
            done
          done
          exit $fail

      - name: Report Linux glibc floor
        if: matrix.name == 'linux'
        working-directory: xvg
        run: |
          for so in prebuilt/linux/*/libxvg.so; do
            echo "$so requires up to: $(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done

      # Confirms each slice really is fat where it is meant to be and still
      # carries the flutter_rust_bridge exports. Both Apple platforms now ship
      # dynamic libraries, so the symbols must survive in the dylib's export
      # table: iOS as an XCFramework, macOS as one universal versioned
      # framework.
      #
      # 确认各 slice 该胖的地方确实是胖的，且仍带着 flutter_rust_bridge 导出。两个
      # Apple 平台现在都分发动态库，符号必须留在 dylib 的导出表里：iOS 是 XCFramework，
      # macOS 是一个通用的版本化 framework。
      - name: Report Apple artifact details
        if: matrix.name == 'apple'
        working-directory: xvg
        run: |
          for b in ios/xvg.xcframework/*/xvg.framework/xvg \
                   macos/xvg.framework/Versions/A/xvg; do
            [ -f "$b" ] || continue
            echo "=== $b ($(stat -f%z "$b") bytes) ==="
            lipo -info "$b"
            otool -D "$b" | tail -1 | sed 's/^/  install_name: /'
            nm -gU "$b" | grep -c ' _frb_' | sed 's/^/  frb_ exports: /'
          done
          for bundle in ios/xvg.xcframework macos/xvg.framework; do
            [ -d "$bundle" ] || continue
            echo "=== $bundle total (symlinks excluded) ==="
            find "$bundle" -type f -exec stat -f%z {} + \
              | awk '{t+=$1} END {print "  " t " bytes"}'
          done

      # Three roots: `prebuilt/` holds every artifact except the two Apple
      # bundles, which have to sit in their CocoaPods pod roots (see
      # kIosXcframework / kMacosFramework). All three paths are listed on every
      # leg so the uploaded tree is always rooted at `xvg/` and the legs merge
      # cleanly in `collect`.
      #
      # macOS uploads/commits only the real Versions/A files. Do not recreate
      # bundle symlinks here: pub would expand them into duplicate files. The
      # podspec restores them on the consumer's machine at pod install.
      #
      # 三个根：除两个 Apple bundle 外的全部产物在 `prebuilt/` 下，而这两个 bundle 必须
      # 放在各自 CocoaPods 的 pod 根目录（见 kIosXcframework / kMacosFramework）。每条
      # leg 都列出这三个路径，保证上传的树统一以 `xvg/` 为根，`collect` 里也能干净合并。
      #
      # macOS 只上传/提交 Versions/A 的真实文件，不在此重建 bundle 符号链接，否则 pub
      # 会将其展开成重复文件。podspec 在下游机器 pod install 时恢复链接。
      - uses: actions/upload-artifact@v4
        with:
          name: xvg-prebuilt-${{ matrix.name }}
          path: |
            xvg/prebuilt/
            xvg/ios/xvg.xcframework
            xvg/macos/xvg.framework
          if-no-files-found: error

  collect:
    name: Collect into one downloadable set
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Merging the per-runner uploads into one tree reproduces exactly the
      # `xvg/prebuilt/` layout that gets committed.
      - uses: actions/download-artifact@v4
        with:
          pattern: xvg-prebuilt-*
          merge-multiple: true
          path: xvg

      - name: Package dependencies
        working-directory: xvg
        run: flutter pub get

      # Each runner wrote a MANIFEST.json describing only its own slices;
      # --restage rewrites one manifest covering everything now on disk.
      - name: Regenerate MANIFEST.json across all slices
        working-directory: xvg
        # download-artifact 的 merge-multiple 会让四个切片同时写同一个 prebuilt/MANIFEST.json，
        # 交错写入会产生损坏的 JSON。restage 会按磁盘文件重算全部摘要，旧清单只用于沿用溯源信息，
        # 所以先换回仓库里那份完整清单再 restage。
        run: |
          git checkout -- prebuilt/MANIFEST.json
          dart run tool/build_prebuilt.dart --restage

      # Strict (no --allow-incomplete): a full artifact run must produce every
      # slice. If this fails, a matrix leg silently dropped something.
      - name: Verify completeness and source sync
        working-directory: xvg
        run: dart run tool/check_prebuilt.dart

      - name: Summarise
        working-directory: xvg
        run: |
          echo '### xvg prebuilt artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| artifact | bytes |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|' >> "$GITHUB_STEP_SUMMARY"
          find prebuilt ios/xvg.xcframework macos/xvg.framework -type f ! -name MANIFEST.json | sort | while read -r f; do
            echo "| ${f#prebuilt/} | $(stat -c%s "$f") |" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: xvg-prebuilt
          path: |
            xvg/prebuilt/
            xvg/ios/xvg.xcframework
            xvg/macos/xvg.framework
          if-no-files-found: error
