name: xvg CI

# xvg ships a Rust core (via flutter_rust_bridge) behind a Dart/Flutter plugin
# API. As of the precompiled-binary migration (see
# xvg/PRECOMPILED_MIGRATION_PLAN.md) the Rust crate is NOT compiled on a
# consumer's machine, and not compiled by this workflow either: the native
# libraries are committed under `xvg/prebuilt/` and the platform build files
# only reference them.
#
# That changes what CI has to prove, from "can cargokit cross-compile on each
# platform" to three separate things:
#
#   1. `prebuilt-sync` — do the committed binaries still correspond to the Rust
#      sources in the tree? Without this, editing rust/src/** and forgetting to
#      regenerate the binaries would ship a stale library silently. This is the
#      protection that replaces cargokit's content-hash mechanism.
#   2. `cargo-check` — does the Rust source still compile for every target
#      triple we ship? Type-check only (no build-std, no LTO, no link), so it is
#      cheap enough to run on every push while still catching platform-specific
#      breakage that a host-only `cargo test` would miss.
#   3. `build-*` — does a real downstream consumer build succeed, and does the
#      prebuilt binary actually end up inside the produced bundle? The second
#      half matters: the characteristic failure mode of precompiled distribution
#      is "the build passes but the library was never packaged", which then
#      explodes at runtime inside DynamicLibrary.open.
#
# Producing the binaries is a separate, manually triggered workflow:
# `.github/workflows/xvg-prebuilt.yml`.
on:
  push:
    branches: [main]
    paths:
      - 'xvg/**'
      - '.github/workflows/xvg-ci.yml'
      # Docs-only changes don't affect anything this workflow builds or
      # tests — excluding them keeps the full native build matrix from
      # running on pure documentation commits.
      - '!xvg/docs/**'
      - '!xvg/**/*.md'
      - '!xvg/LICENSE'
      - '!xvg/.gitignore'
      - '!xvg/.gitattributes'
      - '!xvg/.pubignore'
  pull_request:
    paths:
      - 'xvg/**'
      - '.github/workflows/xvg-ci.yml'
      - '!xvg/docs/**'
      - '!xvg/**/*.md'
      - '!xvg/LICENSE'
      - '!xvg/.gitignore'
      - '!xvg/.gitattributes'
      - '!xvg/.pubignore'
  # Manual run on any branch, e.g. to verify prebuilt slices without a PR.
  # 任意分支手动运行，例如不开 PR 也能验证预编译产物。
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'
  # NDK used for the `cargo check` legs of the Android triples. `cargo check`
  # still runs build scripts, and dart-sys compiles a C file, so a C compiler
  # for the target is required even though nothing is linked.
  ANDROID_NDK_VERSION: '28.0.13004108'

jobs:
  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xvg/rust/target
          key: xvg-cargo-${{ runner.os }}-${{ hashFiles('xvg/rust/Cargo.lock') }}
          restore-keys: |
            xvg-cargo-${{ runner.os }}-

      - name: cargo test
        working-directory: xvg/rust
        run: cargo test --all-features

  dart-analyze:
    name: Dart analyze + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: xvg
        run: flutter pub get

      - name: flutter analyze
        working-directory: xvg
        run: flutter analyze

      - name: dart format check
        working-directory: xvg
        # Scoped to the package's own sources. `dart format` (unlike
        # `flutter analyze`) does not honor analysis_options.yaml excludes, so a
        # bare `.` would also try to reformat benchmark/baseline_f.
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib

  flutter-test:
    name: Flutter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: xvg
        run: flutter pub get

      # Plain `flutter test` loads the native library from rust/target/release/
      # (frb_generated.dart ioDirectory); mirror the checked-in Linux prebuilt
      # there so native tests run without a platform build or PATH changes.
      # 纯 `flutter test` 从 rust/target/release/ 加载原生库（见
      # frb_generated.dart 的 ioDirectory）；镜像已入库的 Linux 预编译库，
      # 无需平台构建或修改 PATH 即可运行原生测试。
      - name: Prepare native library for flutter test
        working-directory: xvg
        run: |
          mkdir -p rust/target/release
          cp prebuilt/linux/x64/libxvg.so rust/target/release/libxvg.so

      - name: flutter test
        working-directory: xvg
        run: flutter test

  # ---------------------------------------------------------------------------
  # 1. Artifact/source sync — the staleness guard.
  # ---------------------------------------------------------------------------
  prebuilt-sync:
    name: Prebuilt artifacts match Rust sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: xvg
        run: flutter pub get

      # Recomputes the SHA-256 of rust/Cargo.lock + rust/Cargo.toml +
      # rust/src/** and compares it against what prebuilt/MANIFEST.json records
      # for each committed binary, plus verifies each binary's own checksum.
      # Strict: every slice must be present now that all platforms are committed.
      - name: Verify prebuilt/MANIFEST.json
        working-directory: xvg
        run: dart run tool/check_prebuilt.dart

  # ---------------------------------------------------------------------------
  # 2. Per-triple compile sentinel — cheap, catches platform-specific breakage.
  # ---------------------------------------------------------------------------
  cargo-check:
    name: cargo check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
            groups: --group android
          - name: linux
            os: ubuntu-latest
            groups: --group linux
          - name: windows
            os: windows-latest
            groups: --group windows
          - name: apple
            os: macos-latest
            groups: --group ios --group macos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Android NDK
        if: matrix.name == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install aarch64 Linux cross compiler
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add Rust target triples
        working-directory: xvg
        shell: bash
        run: |
          for t in $(dart run tool/build_prebuilt.dart --list | awk '{print $2}'); do
            rustup target add "$t" || true
          done

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xvg/rust/target
          key: xvg-check-${{ matrix.name }}-${{ hashFiles('xvg/rust/Cargo.lock') }}
          restore-keys: |
            xvg-check-${{ matrix.name }}-

      - name: Package dependencies
        working-directory: xvg
        run: flutter pub get

      # Type-check only: no -Z build-std, no LTO, no linking. The script reuses
      # the exact cross-compile environment (NDK clang, cross gcc) that the
      # artifact build uses, so a green check here means the same environment
      # would at least get as far as codegen.
      - name: cargo check per target
        working-directory: xvg
        run: dart run tool/build_prebuilt.dart --check ${{ matrix.groups }}

  # ---------------------------------------------------------------------------
  # 3. Downstream consumer builds — this is what a real user experiences.
  # ---------------------------------------------------------------------------
  # None of these install Rust, nightly, rust-src, or (for Android) an NDK.
  # That absence IS the test: if any of them still needed a Rust toolchain, the
  # migration would not have achieved its goal.
  build-windows:
    name: Consume prebuilt (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Example dependencies
        working-directory: xvg/example
        run: flutter pub get

      - name: flutter build windows
        working-directory: xvg/example
        run: flutter build windows

      # The build passing is not sufficient — assert the DLL was actually
      # bundled, and that it is byte-identical to the committed artifact.
      - name: Assert xvg.dll was bundled
        working-directory: xvg
        shell: bash
        run: |
          bundled="example/build/windows/x64/runner/Release/xvg.dll"
          test -f "$bundled" || { echo "::error::xvg.dll missing from the runner bundle"; exit 1; }
          a=$(sha256sum "$bundled" | cut -d' ' -f1)
          b=$(sha256sum prebuilt/windows/x64/xvg.dll | cut -d' ' -f1)
          echo "bundled=$a prebuilt=$b"
          test "$a" = "$b" || { echo "::error::bundled DLL differs from prebuilt/"; exit 1; }

  build-android:
    name: Consume prebuilt (Android debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: xvg-gradle-${{ hashFiles('xvg/example/android/**/*.gradle*', 'xvg/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            xvg-gradle-

      - name: Example dependencies
        working-directory: xvg/example
        run: flutter pub get

      - name: flutter build apk --debug
        working-directory: xvg/example
        run: flutter build apk --debug

      - name: Assert libxvg.so is in the APK
        working-directory: xvg/example
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libxvg.so' \
            || { echo "::error::libxvg.so missing from the APK"; exit 1; }
          unzip -l "$apk" | grep 'libxvg.so'

  build-android-release:
    name: Consume prebuilt (Android release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: xvg-gradle-${{ hashFiles('xvg/example/android/**/*.gradle*', 'xvg/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            xvg-gradle-

      - name: Example dependencies
        working-directory: xvg/example
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: xvg/example
        run: flutter build apk --release

      # 16 KB page alignment is a Google Play requirement for 64-bit native
      # libraries. tool/build_prebuilt.dart passes
      # `-Wl,-z,max-page-size=16384` when producing the .so files; this asserts
      # the property survived all the way into the packaged APK, since that is
      # the artifact Play actually inspects.
      - name: Assert 16 KB page alignment in the APK
        working-directory: xvg/example
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -o -q "$apk" 'lib/*/libxvg.so' -d /tmp/xvg-apk
          fail=0
          for so in /tmp/xvg-apk/lib/*/libxvg.so; do
            # -W (wide) is required: GNU readelf's default -l output wraps each
            # 64-bit ELF program header onto two lines (Offset/VirtAddr/PhysAddr
            # on one line, FileSiz/MemSiz/Flags/Align on the next). Without -W,
            # `awk '/^  LOAD/ {print $NF}'` grabs the last field of the FIRST
            # line (PhysAddr) instead of Align, silently misreporting alignment
            # for every 64-bit ABI (arm64-v8a/x86_64) while 32-bit ABIs — whose
            # narrower fields never wrap — happen to pass. Verified by
            # reproducing locally: llvm-readelf (single-line output, unaffected
            # by this bug) confirms both arm64-v8a and x86_64 are correctly
            # 0x4000-aligned even when this unfixed script reported failure.
            #
            # -W(wide)是必需的:GNU readelf 默认的 -l 输出会把每条 64 位 ELF
            # 程序头拆成两行(第一行 Offset/VirtAddr/PhysAddr,第二行
            # FileSiz/MemSiz/Flags/Align)。不加 -W 时,
            # `awk '/^  LOAD/ {print $NF}'` 取到的是第一行的最后一个字段
            # (PhysAddr),而不是 Align,导致每个 64 位 ABI(arm64-v8a/x86_64)都被
            # 静默误报对齐失败;32 位 ABI 字段较窄从不换行,才侥幸通过。本地用
            # llvm-readelf(单行输出,不受此 bug 影响)复现确认:即便这个未修复的
            # 脚本报告失败,arm64-v8a 和 x86_64 实际都正确 0x4000 对齐。
            aligns=$(readelf -lW "$so" | awk '/^  LOAD/ {print $NF}' | sort -u)
            echo "$so -> $aligns"
            for a in $aligns; do
              [ "$a" = "0x4000" ] || { echo "::error::$so has LOAD align $a, expected 0x4000 (16 KB)"; fail=1; }
            done
          done
          exit $fail

  build-linux:
    name: Consume prebuilt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Example dependencies
        working-directory: xvg/example
        run: flutter pub get

      - name: flutter build linux
        working-directory: xvg/example
        run: flutter build linux

      - name: Assert libxvg.so was bundled
        working-directory: xvg/example
        run: |
          found=$(find build/linux -name libxvg.so -path '*bundle*' | head -1)
          test -n "$found" || { echo "::error::libxvg.so missing from the Linux bundle"; exit 1; }
          echo "bundled: $found"
          echo "--- max glibc requirement ---"
          objdump -T "$found" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

  build-ios:
    name: Consume prebuilt (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # TODO(migration): remove this guard once the iOS XCFramework is
      # committed. Until then this job reports honestly instead of failing on an
      # absence that is expected and already documented.
      - name: Check prebuilt iOS XCFramework exists
        id: guard
        run: |
          xcf=xvg/ios/xvg.xcframework
          if [ -f "$xcf/Info.plist" ] \
             && [ -f "$xcf/ios-arm64/xvg.framework/xvg" ] \
             && [ -f "$xcf/ios-arm64_x86_64-simulator/xvg.framework/xvg" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::xvg/prebuilt/ios/* not committed yet — run the xvg-prebuilt workflow to produce them."
          fi

      - name: Cache CocoaPods
        if: steps.guard.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            xvg/example/ios/Pods
          key: xvg-pods-ios-${{ hashFiles('xvg/example/ios/Podfile.lock') }}
          restore-keys: |
            xvg-pods-ios-

      - name: Example dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: flutter pub get

      # Both SDKs must build: the XCFramework has one device slice and one
      # simulator slice, and only building one of them verifies half the
      # packaging.
      - name: flutter build ios --no-codesign (device)
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: flutter build ios --no-codesign

      - name: flutter build ios --simulator
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: flutter build ios --simulator

      # xvg links the Rust core dynamically on iOS. Four things must hold, and
      # each of them has failed at least once during the migration:
      #   1. the vendored framework is actually embedded in the .app (otherwise
      #      dyld aborts at launch);
      #   2. Runner links it via @rpath (an absolute install_name would only
      #      work on the build machine);
      #   3. the flutter_rust_bridge exports are still in the framework's
      #      dynamic symbol table, i.e. `strip` did not take them — this is the
      #      dynamic-library equivalent of the old -force_load check, and the
      #      same property `Assert libxvg.so is in the APK` guards on Android;
      #   4. the same symbols are NOT duplicated into Runner, which is what a
      #      leftover static link would look like.
      #
      # xvg 在 iOS 上动态链接 Rust 核心。以下四点都必须成立（迁移过程中每一条都真实
      # 出过问题）：1) vendored framework 确实被嵌入 .app；2) Runner 通过 @rpath 链接
      # 它；3) flutter_rust_bridge 导出仍在 framework 的动态符号表中（等价于旧的
      # -force_load 校验，也与 Android 侧校验的性质相同）；4) 这些符号没有同时出现在
      # Runner 里——那才是残留静态链接的样子。
      - name: Assert dynamic linkage and exported symbols
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: |
          app=build/ios/iphoneos/Runner.app
          fw="$app/Frameworks/xvg.framework/xvg"
          test -f "$fw" \
            || { echo "::error::xvg.framework was not embedded in the app bundle"; exit 1; }
          otool -L "$app/Runner" | grep -q '@rpath/xvg.framework/xvg' \
            || { echo "::error::Runner does not link @rpath/xvg.framework/xvg"; exit 1; }
          otool -D "$fw" | grep -q '@rpath/xvg.framework/xvg' \
            || { echo "::error::xvg.framework install_name is not @rpath-based"; exit 1; }
          # -gU: defined, external (exported) symbols only.
          nm -gU "$fw" | grep -q '_frb_pde_ffi_dispatcher_primary$' \
            || { echo "::error::flutter_rust_bridge exports are missing from xvg.framework"; exit 1; }
          if nm "$app/Runner" | grep -q '_frb_pde_ffi_dispatcher_primary$'; then
            echo "::error::FRB symbols were also linked statically into Runner"; exit 1
          fi
          echo "dynamic linkage OK — $(nm -gU "$fw" | grep -c ' _frb_') frb_ exports, $(stat -f%z "$fw") bytes"
          lipo -info "$fw"

      # Runtime check on the simulator slice (the device slice needs a real
      # device): boot the first available iPhone simulator and run the
      # integration test, which loads the framework and decodes a scene.
      # 在模拟器 slice 上做运行时校验（设备 slice 需要真机）：启动第一个可用的
      # iPhone 模拟器并运行集成测试，真正加载 framework 并解码一个场景。
      # `flutter test` on a simulator occasionally hangs with no output after
      # "Xcode build done" (flutter/flutter#181771); a normal run takes ~9 min.
      # 模拟器上的 `flutter test` 偶发在 "Xcode build done" 后无输出挂起
      # （flutter/flutter#181771）；正常约 9 分钟。
      - name: Integration test on iOS simulator
        if: steps.guard.outputs.present == 'true'
        timeout-minutes: 20
        working-directory: xvg/example
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$udid" && [ "$udid" != null ] \
            || { echo "::error::no available iPhone simulator"; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          flutter test integration_test/simple_test.dart -d "$udid"

  build-macos:
    name: Consume prebuilt (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # TODO(migration): remove this guard once the macOS framework is
      # committed. The three symlinks are checked too (`-L`): a Windows
      # checkout with core.symlinks=false materialises them as plain text
      # files, which would break codesign in a way nothing else here catches.
      #
      # TODO(migration)：macOS framework 提交后删除此守卫。三个符号链接也一并检查
      # （`-L`）：Windows 上 core.symlinks=false 的检出会把它们落成普通文本文件，
      # 那会在别处都发现不了的地方搞垮 codesign。
      - name: Check prebuilt macOS framework exists
        id: guard
        run: |
          fw=xvg/macos/xvg.framework
          if [ -f "$fw/Versions/A/xvg" ] \
             && [ -f "$fw/Versions/A/Resources/Info.plist" ] \
             && [ -L "$fw/Versions/Current" ] \
             && [ -L "$fw/xvg" ] \
             && [ -L "$fw/Resources" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::xvg/macos/xvg.framework not committed (or its symlinks are missing) — run the xvg-prebuilt workflow to produce it."
          fi

      - name: Cache CocoaPods
        if: steps.guard.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            xvg/example/macos/Pods
          key: xvg-pods-macos-${{ hashFiles('xvg/example/macos/Podfile.lock') }}
          restore-keys: |
            xvg-pods-macos-

      - name: Example dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: flutter pub get

      - name: flutter build macos
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: flutter build macos

      # xvg links the Rust core dynamically on macOS, out of a *vendored*
      # framework (it used to be a pod-built one wrapping a -force_load'd static
      # archive). The same four properties the iOS job checks must hold, plus
      # one macOS-only structural check: the embedded bundle has to keep its
      # versioned layout, because Xcode's "Embed & Sign" phase codesigns it and
      # codesign rejects a flat framework on macOS.
      #
      # xvg 在 macOS 上动态链接 Rust 核心，且来自 *vendored* framework（此前是 pod
      # 自己编的 framework，里面 -force_load 一个静态归档）。iOS job 校验的四点在这里
      # 同样必须成立，另加一条 macOS 独有的结构校验：嵌入的 bundle 必须保持版本化布局，
      # 因为 Xcode 的 “Embed & Sign” 阶段会给它签名，而 macOS 的 codesign 不接受扁平
      # framework。
      - name: Assert dynamic linkage and exported symbols
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          bin="$app/Contents/MacOS/$(basename "$app" .app)"
          bundle="$app/Contents/Frameworks/xvg.framework"
          fw="$bundle/Versions/A/xvg"
          test -f "$fw" \
            || { echo "::error::xvg.framework was not embedded in the app bundle"; exit 1; }
          test -L "$bundle/Versions/Current" && test -L "$bundle/xvg" \
            || { echo "::error::the embedded xvg.framework lost its versioned-bundle symlinks"; exit 1; }
          otool -L "$bin" | grep -q '@rpath/xvg.framework/Versions/A/xvg' \
            || { echo "::error::the app does not link @rpath/xvg.framework"; exit 1; }
          otool -D "$fw" | grep -q '@rpath/xvg.framework/Versions/A/xvg' \
            || { echo "::error::xvg.framework install_name is not @rpath-based"; exit 1; }
          # -gU: defined, external (exported) symbols only.
          nm -gU "$fw" | grep -q '_frb_pde_ffi_dispatcher_primary$' \
            || { echo "::error::flutter_rust_bridge exports are missing from xvg.framework"; exit 1; }
          if nm "$bin" | grep -q '_frb_pde_ffi_dispatcher_primary$'; then
            echo "::error::FRB symbols were also linked statically into the app binary"; exit 1
          fi
          # Xcode signs the embedded bundle; a malformed layout only surfaces
          # here. Reported, not asserted, when the app itself is unsigned.
          #
          # Xcode 会给嵌入的 bundle 签名；布局有问题只有在这一步才暴露。App 本身未签名
          # 时这里只报告、不断言。
          codesign --verify --verbose "$bundle" || echo "::warning::codesign --verify on the embedded framework was not clean (see above)"
          echo "dynamic linkage OK — $(nm -gU "$fw" | grep -c ' _frb_') frb_ exports, $(stat -f%z "$fw") bytes"
          lipo -info "$fw"

      # Linking proves nothing about runtime: a CI-built Android slice once
      # linked fine and still crashed inside frb init. Load the framework and
      # decode a scene for real.
      # 链接通过不代表能运行：CI 编的 Android 库曾链接正常却在 frb 初始化时崩溃。
      # 这里真正加载 framework 并解码一个场景。
      - name: Integration test on macOS desktop
        if: steps.guard.outputs.present == 'true'
        working-directory: xvg/example
        run: flutter test integration_test/simple_test.dart -d macos
