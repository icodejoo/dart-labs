name: Build mova libmpv (all platforms)

# Only rebuilds when our build recipe changes — the ffmpeg/mpv/dav1d *source*
# itself isn't vendored in this repo (pulled fresh from upstream at build
# time per platform), so "source changes" here means our build recipe: the
# per-platform ffmpeg configure flavor + the buildscripts patch under
# mova-libmpv/ (the build-recipe subproject; built artifacts land in
# mova/tools/ffmpeg-slim/dist/ instead, see the commit steps below). See
# mova-libmpv/README.md's "多平台进度"
# table for what's real vs. still-being-verified — every job below now
# attempts a real build (no more no-op stubs), but darwin/linux/windows are
# first-attempt "v1"s that haven't been through a green CI run yet the way
# android-arm64/android-other-abi have (those needed a meson-version pin and
# an --enable-libdav1d fix before going green — expect the same kind of
# iteration here). Each platform's build toolchain is genuinely different —
# not a copy-paste of the Android shell-script pattern:
#   - android-arm64 / android-other-abi: media-kit/libmpv-android-video-build,
#     NDK cross-compile, shell flavor script (flavors-mova-slim.sh).
#   - darwin (macOS job) / ios: both drive media-kit/libmpv-darwin-build,
#     Nix + pinned Xcode. `darwin` builds every ios/iossimulator/macos target
#     in one bare `make` invocation, upstream's own default flavor. `ios` is
#     scoped to just `TARGET=mk-out-archive-libs-ios-arm64-video-movaslim`
#     (device arm64 only) for a fast iOS-only iteration loop, using mova's
#     own `movaslim` flavor added on top of upstream via
#     `mova-libmpv/libmpv-darwin-build-mova-slim.patch` (ffmpeg's own
#     component list ported from flavors-mova-slim-ios.sh, plus
#     securetransport instead of mbedtls) — see the `ios` job's own comment
#     for what's trimmed and what isn't (yet).
#   - linux: no upstream media-kit repo exists at all — native build on the
#     runner itself (no cross-compile), deps from apt instead of source.
#   - windows: same native-slim pattern as linux, on MSYS2/MINGW64 — NOT
#     media-kit/libmpv-win32-video-build (that repo is a Linux→Windows
#     cross-compile of a full GCC/LLVM toolchain + ~98 deps; it cannot run
#     on windows-latest and isn't our slim flavor). Deps from pacman.
on:
  push:
    branches: [main]
    paths:
      - 'mova-libmpv/**'
      - '!mova-libmpv/**.md'
      - '!mova-libmpv/doc/**'
      - '.github/workflows/build-mova-libmpv.yml'
  workflow_dispatch:

# The android-arm64 job commits the rebuilt artifact back to dist/ (see its
# last step) — the default GITHUB_TOKEN is read-only unless granted write
# here, so without this the build succeeds but the push-back 403s.
permissions:
  contents: write

env:
  # Pinned per tools/ffmpeg-slim/README.md's "实测结果" section — bump
  # deliberately, not implicitly, so a size regression can always be traced
  # back to either our flavor/patch or an explicit version bump here.
  ANDROID_LIBMPV_BUILD_REF: 1ecf510
  NDK_VERSION: 25.2.9519653
  NDK_ZIP_NAME: android-ndk-r25c-linux.zip

jobs:
  android-arm64:
    name: Android arm64-v8a (implemented)
    runs-on: ubuntu-22.04
    # paused — iOS-focused iteration (2026-09-17), see ios job below
    if: false
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip
          # ubuntu-22.04's apt meson is too old for mpv's build script (errors on
          # "unrecognized arguments: --prefer-static") — pin via pip to the version
          # verified working in the local WSL2 dry-run (Ubuntu 24.04's apt default).
          pip3 install --user "meson==1.3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone libmpv-android-video-build
        run: |
          git clone https://github.com/media-kit/libmpv-android-video-build build-root
          cd build-root
          git checkout "$ANDROID_LIBMPV_BUILD_REF"

      - name: Apply mova slim-build patch
        working-directory: build-root
        run: git apply ../mova-libmpv/libmpv-android-video-build.patch

      - name: Copy mova ffmpeg flavor into place
        run: cp mova-libmpv/flavors-mova-slim.sh build-root/buildscripts/scripts/ffmpeg.sh

      # sdkmanager's official NDK download is extremely slow (~0.12MB/s per
      # tools/ffmpeg-slim/README.md's "环境准备" section) — pull the zip
      # directly from Google's CDN instead and place it where build.sh expects it.
      # Both caches are keyed on pinned versions (NDK_VERSION /
      # ANDROID_LIBMPV_BUILD_REF), not on file hashes — the download scripts
      # themselves already skip re-fetching anything that's on disk (see
      # download-deps.sh's `[ ! -d dav1d ] && git clone ...` pattern), so a
      # cache hit here just needs to restore that disk state instead of
      # re-fetching ~500MB of NDK + several source trees on every single run
      # (arm64/armeabi-v7a/x86/x86_64 all fetch identically, so the same key
      # is shared across all 4 jobs — whichever runs first populates it).
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/sdk/android-sdk-linux/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK (direct, skip sdkmanager)
        run: |
          if [ -d "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION" ]; then
            echo "NDK restored from cache, skipping download"
          else
            mkdir -p "build-root/buildscripts/sdk/android-sdk-linux/ndk"
            curl -fsSL -o "$NDK_ZIP_NAME" "https://dl.google.com/android/repository/$NDK_ZIP_NAME"
            unzip -q "$NDK_ZIP_NAME" -d /tmp/ndk-extract
            mv /tmp/ndk-extract/android-ndk-r25c "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION"
          fi

      - name: Cache ffmpeg/mpv/dav1d/etc. source deps
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/deps
          key: android-deps-${{ env.ANDROID_LIBMPV_BUILD_REF }}

      - name: Download ffmpeg/mpv/dav1d/etc. sources
        working-directory: build-root/buildscripts
        run: ./include/download-deps.sh

      - name: Apply upstream source patches
        working-directory: build-root/buildscripts
        run: ./patch.sh

      - name: Clear stale mpv build directory (2026-09-17, Android x86 fix)
        working-directory: build-root/buildscripts
        # See the identical step in android-other-abi for why: the "deps"
        # cache is keyed only on ANDROID_LIBMPV_BUILD_REF, not per-arch, so
        # a stale already-configured build dir from an earlier point in the
        # cache's history can make meson silently keep old flags instead of
        # the current --default-library shared. Applying the same guard here
        # even though arm64-v8a hasn't shown the symptom, for consistency.
        run: rm -rf deps/mpv/_build-arm64

      - name: Build libmpv for arm64-v8a
        working-directory: build-root/buildscripts
        run: ./build.sh --arch arm64 mpv

      - name: Strip and verify
        working-directory: build-root/buildscripts
        run: |
          NDK_TOOLCHAIN=$(echo sdk/android-sdk-linux/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/*)
          LIBMPV=prefix/arm64-v8a/usr/local/lib/libmpv.so
          "$NDK_TOOLCHAIN/bin/llvm-strip" --strip-all "$LIBMPV"

          echo "### libmpv.so size (arm64-v8a)" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$LIBMPV")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES"))" >> "$GITHUB_STEP_SUMMARY"

          # Critical-path symbol check — silent MediaCodec fallback-to-software
          # is otherwise invisible (see README's mpv_lavc_set_java_vm note).
          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q mpv_lavc_set_java_vm \
            || { echo "::error::mpv_lavc_set_java_vm missing — MediaCodec JavaVM binding broken"; exit 1; }
          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q dav1d_open \
            || { echo "::error::dav1d_open missing — AV1 software fallback silently dropped (see README's --enable-libdav1d pitfall)"; exit 1; }
          for sym in h264_mediacodec_decoder hevc_mediacodec_decoder vp9_mediacodec_decoder av1_mediacodec_decoder; do
            "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q "$sym" \
              || echo "::warning::$sym not found in dynamic symbols (expected for a static hwdec wrapper — check unstripped build if this is unexpected)"
          done

          cp "$LIBMPV" "$GITHUB_WORKSPACE/libmpv-arm64-v8a.so"

      - name: Upload libmpv.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-android-arm64-v8a
          path: libmpv-arm64-v8a.so
          retention-days: 30

      - name: Commit built artifact to dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # This job runs concurrently with android-other-abi's 3 matrix legs
          # (and now darwin/linux/windows too) — all push to the same branch,
          # each touching a disjoint dist/<abi>/ path. Every retry starts from
          # a fresh fetch+reset baseline and creates a brand-new commit on top
          # of it, instead of rebasing an already-made local commit — the old
          # "commit once, then rebase on conflict" approach could hit
          # `cannot rebase: You have unstaged changes` if the working tree
          # wasn't pristine when the rebase ran (see mova-libmpv/README.md's
          # 2026-09-17 windows CI finding).
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p mova/tools/ffmpeg-slim/dist/arm64-v8a
            cp libmpv-arm64-v8a.so mova/tools/ffmpeg-slim/dist/arm64-v8a/libmpv.so
            git add mova/tools/ffmpeg-slim/dist/arm64-v8a/libmpv.so
            if git diff --cached --quiet; then
              echo "No size/content change, skip commit"
              exit 0
            fi
            git commit -m "chore(mova): rebuild slimmed libmpv.so (android arm64-v8a) [skip ci]"
            # actions/checkout doesn't install LFS hooks, so a plain `git
            # push` here would push the pointer commit while silently
            # leaving the actual binary missing from the LFS store (404 for
            # anyone who later checks it out) — push LFS content explicitly.
            git lfs push origin main
            if git push; then exit 0; fi
            echo "push rejected (race with a sibling job), retrying from a fresh baseline ($i/5)..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/arm64-v8a/ after retries"
          exit 1

  # --- Everything below is a deliberate no-op scaffold, NOT a real build ---
  # Each stub documents which upstream build repo the real job needs to drive
  # and what's platform-specific about it (see README's "多平台进度" table).
  # Flip `if: false` → real steps once that platform's flavor script/patch
  # exists under tools/ffmpeg-slim/ and has been hand-verified once, the same
  # way android-arm64 was.

  android-other-abi:
    name: "Android ${{ matrix.abi }} (implemented)"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7l
            abi: armeabi-v7a
          - arch: x86
            abi: x86
          - arch: x86_64
            abi: x86_64
    # paused — iOS-focused iteration (2026-09-17), see ios job below
    if: false
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip
          pip3 install --user "meson==1.3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone libmpv-android-video-build
        run: |
          git clone https://github.com/media-kit/libmpv-android-video-build build-root
          cd build-root
          git checkout "$ANDROID_LIBMPV_BUILD_REF"

      - name: Apply mova slim-build patch
        working-directory: build-root
        run: git apply ../mova-libmpv/libmpv-android-video-build.patch

      - name: Copy mova ffmpeg flavor into place
        run: cp mova-libmpv/flavors-mova-slim.sh build-root/buildscripts/scripts/ffmpeg.sh

      # Both caches are keyed on pinned versions (NDK_VERSION /
      # ANDROID_LIBMPV_BUILD_REF), not on file hashes — the download scripts
      # themselves already skip re-fetching anything that's on disk (see
      # download-deps.sh's `[ ! -d dav1d ] && git clone ...` pattern), so a
      # cache hit here just needs to restore that disk state instead of
      # re-fetching ~500MB of NDK + several source trees on every single run
      # (arm64/armeabi-v7a/x86/x86_64 all fetch identically, so the same key
      # is shared across all 4 jobs — whichever runs first populates it).
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/sdk/android-sdk-linux/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK (direct, skip sdkmanager)
        run: |
          if [ -d "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION" ]; then
            echo "NDK restored from cache, skipping download"
          else
            mkdir -p "build-root/buildscripts/sdk/android-sdk-linux/ndk"
            curl -fsSL -o "$NDK_ZIP_NAME" "https://dl.google.com/android/repository/$NDK_ZIP_NAME"
            unzip -q "$NDK_ZIP_NAME" -d /tmp/ndk-extract
            mv /tmp/ndk-extract/android-ndk-r25c "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION"
          fi

      - name: Cache ffmpeg/mpv/dav1d/etc. source deps
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/deps
          key: android-deps-${{ env.ANDROID_LIBMPV_BUILD_REF }}

      - name: Download ffmpeg/mpv/dav1d/etc. sources
        working-directory: build-root/buildscripts
        run: ./include/download-deps.sh

      - name: Apply upstream source patches
        working-directory: build-root/buildscripts
        run: ./patch.sh

      - name: Clear stale mpv build directory (2026-09-17, Android x86 fix)
        working-directory: build-root/buildscripts
        run: |
          # The "deps" cache above is keyed only on ANDROID_LIBMPV_BUILD_REF,
          # not per-architecture, and mpv's own per-arch _build-<suffix>
          # directories live inside it. x86's build (run 35186650404 and
          # earlier) produced a static libmpv.a despite mpv.sh always passing
          # --default-library shared — meson was reusing a stale, already-
          # configured build directory from an earlier point in this cache's
          # history instead of applying the current flags ("Run meson setup
          # --reconfigure to force Meson to regenerate" appeared repeatedly
          # in that log, which is meson's signal that it's reusing existing
          # config rather than re-evaluating it). Force a clean directory per
          # arch so this can't happen regardless of what the shared cache
          # last held.
          suffix=""
          case "${{ matrix.arch }}" in
            arm64) suffix="-arm64" ;;
            x86) suffix="-x86" ;;
            x86_64) suffix="-x64" ;;
          esac
          rm -rf "deps/mpv/_build${suffix}"

      - name: Build libmpv for ${{ matrix.abi }}
        working-directory: build-root/buildscripts
        run: ./build.sh --arch ${{ matrix.arch }} mpv

      - name: Strip and verify
        working-directory: build-root/buildscripts
        run: |
          NDK_TOOLCHAIN=$(echo sdk/android-sdk-linux/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/*)
          LIBMPV=prefix/${{ matrix.abi }}/usr/local/lib/libmpv.so
          "$NDK_TOOLCHAIN/bin/llvm-strip" --strip-all "$LIBMPV"

          echo "### libmpv.so size (${{ matrix.abi }})" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$LIBMPV")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES"))" >> "$GITHUB_STEP_SUMMARY"

          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q mpv_lavc_set_java_vm \
            || { echo "::error::mpv_lavc_set_java_vm missing — MediaCodec JavaVM binding broken"; exit 1; }
          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q dav1d_open \
            || { echo "::error::dav1d_open missing — AV1 software fallback silently dropped (see README's --enable-libdav1d pitfall)"; exit 1; }

          cp "$LIBMPV" "$GITHUB_WORKSPACE/libmpv-${{ matrix.abi }}.so"

      - name: Upload libmpv.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-android-${{ matrix.abi }}
          path: libmpv-${{ matrix.abi }}.so
          retention-days: 30

      - name: Commit built artifact to dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 3 matrix legs (armeabi-v7a/x86/x86_64) push to the same branch
          # concurrently — each only touches its own dist/<abi>/ path. Every
          # retry starts from a fresh fetch+reset baseline and creates a
          # brand-new commit on top of it, instead of rebasing an
          # already-made local commit (see arm64-v8a job above for why).
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p mova/tools/ffmpeg-slim/dist/${{ matrix.abi }}
            cp "$GITHUB_WORKSPACE/libmpv-${{ matrix.abi }}.so" mova/tools/ffmpeg-slim/dist/${{ matrix.abi }}/libmpv.so
            git add mova/tools/ffmpeg-slim/dist/${{ matrix.abi }}/libmpv.so
            if git diff --cached --quiet; then
              echo "No size/content change, skip commit"
              exit 0
            fi
            git commit -m "chore(mova): rebuild slimmed libmpv.so (android ${{ matrix.abi }}) [skip ci]"
            git lfs push origin main
            if git push; then exit 0; fi
            echo "push rejected (race with a sibling matrix leg), retrying from a fresh baseline ($i/5)..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/${{ matrix.abi }}/libmpv.so after retries"
          exit 1

  # macOS movaslim job (2026-09-18) — reuses the exact same upstream repo,
  # Nix/Xcode toolchain and mova-slim patch as the `ios` job below, just with
  # a macos-arm64 TARGET instead of ios-arm64. Investigated first (see
  # mova-libmpv chat history / memory): the movaslim flavor added by
  # libmpv-darwin-build-mova-slim.patch has zero os-specific branching — every
  # gate in the patch is `flavor == movaslim`, not `os == ios` — and `macos`
  # is already a valid os/TARGET combination in the upstream flake
  # (nix/utils/constants/oses.nix, nix/utils/targets/libs-frameworks.nix list
  # macos-arm64/amd64/universal). securetransport (used instead of mbedtls)
  # is Apple's native Security.framework, available on macOS the same as
  # iOS. So this patch needs zero changes — only the TARGET string differs.
  # Scoped to macos-arm64 only for the first pass (skip amd64/universal until
  # arm64 is green — universal lipo-merges two arch outputs, an extra
  # untested step; amd64 uses a 10.9 deployment target that's never been
  # exercised by this patch).
  # Deliberately does NOT commit to mova/tools/ffmpeg-slim/dist/ yet — same
  # as `ios`, this is a validation pass first.
  darwin:
    name: "macOS arm64 (media-kit/libmpv-darwin-build, movaslim flavor)"
    runs-on: macos-15
    if: true
    steps:
      - name: Platform info
        run: sw_vers; uname -m

      - name: Checkout dart-labs
        uses: actions/checkout@v4
        with:
          path: dart-labs

      - name: Checkout libmpv-darwin-build
        uses: actions/checkout@v4
        with:
          repository: media-kit/libmpv-darwin-build
          path: build-root
          # No pinned ref yet (first attempt at this TARGET) — same as the
          # `ios` job's identical note; pin once a build here succeeds.

      - name: Apply mova slim-build patch
        working-directory: build-root
        # Same patch, same `git add -A` requirement as the `ios` job below
        # (Nix's git+file:// flake source only sees git-tracked files).
        run: |
          git apply ../dart-labs/mova-libmpv/libmpv-darwin-build-mova-slim.patch
          git add -A

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Resolve Xcode path
        id: xcode
        run: |
          # Same fallback as the `ios` job's identical step.
          if [ -d /Applications/Xcode_16.1.0.app ]; then
            echo "path=$(realpath /Applications/Xcode_16.1.0.app)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Xcode_16.1.0.app not found, falling back to xcode-select's default — may not match what the flake expects"
            echo "path=$(xcode-select -p | sed 's|/Contents/Developer||')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (macOS arm64 only, mova movaslim flavor)
        working-directory: build-root
        run: nix develop -c make TARGET=mk-out-archive-libs-macos-arm64-video-movaslim XCODE_PATH="${{ steps.xcode.outputs.path }}" VERSION=mova-ci

      - name: Verify and extract
        working-directory: build-root
        run: |
          ls -la result/
          # -L: dereference the Nix-store symlink, same reasoning as the
          # `ios` job's identical step (bit us there in run 35193860905).
          ARCHIVE=$(find -L result -name '*.tar.gz' | head -1)
          test -n "$ARCHIVE" || { echo "::error::no .tar.gz archive in result/"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/darwin-out"
          tar -xzvf "$ARCHIVE" -C "$GITHUB_WORKSPACE/darwin-out"

          find "$GITHUB_WORKSPACE/darwin-out" -name '*.dylib' -exec strip -S -x {} \;

          DYLIB=$(find "$GITHUB_WORKSPACE/darwin-out" -iname 'libmpv*.dylib' | head -1)
          test -n "$DYLIB" || { echo "::error::libmpv*.dylib not found inside archive"; find "$GITHUB_WORKSPACE/darwin-out" -type f -print; exit 1; }

          # Symbol export check: cross-file/default.nix now appends
          # -fvisibility=hidden to movaslim's c_args (compile-slimming
          # commit), which applies to mpv itself too, not just its
          # statically-folded deps — mpv is expected to stay safe because
          # its public client API is annotated MPV_EXPORT
          # (visibility("default")), but that was never verified against a
          # real build, only reasoned about (see commit that added
          # -fvisibility=hidden). Fail loudly here instead of finding out
          # only after this ships into mova and something using libmpv.h
          # fails to link/dlopen.
          echo "### exported symbol check (libmpv.dylib, macOS arm64)" >> "$GITHUB_STEP_SUMMARY"
          MISSING_SYMS=""
          for sym in mpv_create mpv_initialize mpv_command mpv_command_async mpv_set_option mpv_observe_property mpv_render_context_create mpv_render_context_render mpv_wait_event mpv_terminate_destroy; do
            if nm -gU "$DYLIB" | grep -q " T _${sym}\$"; then
              echo "✅ $sym" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $sym MISSING" >> "$GITHUB_STEP_SUMMARY"
              MISSING_SYMS="$MISSING_SYMS $sym"
            fi
          done
          if [ -n "$MISSING_SYMS" ]; then
            echo "::error::libmpv.dylib is missing expected exported symbols:$MISSING_SYMS (likely -fvisibility=hidden swallowed the public API — check MPV_EXPORT annotations survived)"
            exit 1
          fi

          echo "### libmpv.dylib (macOS arm64, movaslim flavor)" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$DYLIB" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -f%z "$DYLIB")
          echo "$SIZE_BYTES bytes ($(echo "scale=2; $SIZE_BYTES/1048576" | bc) MiB)" >> "$GITHUB_STEP_SUMMARY"
          size -m "$DYLIB" >> "$GITHUB_STEP_SUMMARY" || true

          echo "### total bundle size (all .dylib files, macOS arm64, movaslim flavor)" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$GITHUB_WORKSPACE/darwin-out"/*/*.dylib >> "$GITHUB_STEP_SUMMARY"
          TOTAL_BYTES=$(find "$GITHUB_WORKSPACE/darwin-out" -name '*.dylib' -exec stat -f%z {} \; | awk '{s+=$1} END {print s}')
          echo "$TOTAL_BYTES bytes ($(echo "scale=2; $TOTAL_BYTES/1048576" | bc) MiB) total across $(find "$GITHUB_WORKSPACE/darwin-out" -name '*.dylib' | wc -l | tr -d ' ') files" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-macos-arm64-movaslim
          path: darwin-out/*
          retention-days: 14

  # iOS-only fast-iteration job (2026-09-17, v3) — replaces the previous
  # from-scratch custom cross-build (which built ffmpeg/dav1d/freetype/
  # fribidi/harfbuzz/libass/mpv all by hand and never went green). Reuses the
  # same upstream repo/toolchain as the `darwin` job above
  # (media-kit/libmpv-darwin-build, Nix + pinned Xcode) but scopes the build
  # to a single flake target — device arm64, libs format, video variant —
  # instead of `darwin`'s bare `make` (every ios/iossimulator/macos
  # combination). This mirrors how android-arm64 bootstrapped from
  # media-kit/libmpv-android-video-build before mova's custom flavor patch
  # was layered on: got a real green build on upstream's own default flavor
  # first (run 35194396206), then slimmed it (v3.1, 2026-09-17) via a new
  # `movaslim` flavor added by `libmpv-darwin-build-mova-slim.patch` —
  # trimmed decoder/demuxer/parser/bsf list (mirrors mova's already-designed
  # but previously orphaned flavors-mova-slim-ios.sh) + securetransport
  # instead of mbedtls + skips libxml2/uchardet from the bundled dylibs.
  # NOTE: the `libs` archive format bundles ffmpeg/mpv/dav1d/libass/
  # freetype/harfbuzz/fribidi as SEPARATE .dylib files (mk-out-libs/
  # default.nix's `deps` list, copied verbatim regardless of what mpv
  # actually links) — this patch trims each library's own content but does
  # NOT merge them into one statically-linked libmpv.dylib the way Android's
  # single .so (or the old, never-green v2 iOS line) does. Getting there
  # would mean re-linking mpv+ffmpeg statically inside this Nix/meson
  # pipeline — a real follow-up, not done in this pass. Expect the total
  # bundle size to shrink meaningfully but likely still exceed Android's
  # single-file ~6.5MiB for that architectural reason.
  # Deliberately does NOT commit to mova/tools/ffmpeg-slim/dist/ yet — this
  # is a validation pass, not a shipping artifact.
  ios:
    name: "iOS arm64 (v3.1: media-kit/libmpv-darwin-build, movaslim flavor)"
    runs-on: macos-15
    # re-enabled (2026-09-18) alongside darwin to verify the shared movaslim
    # patch's latest changes (webm_dash_manifest removal, full LTO) don't
    # regress iOS — both jobs consume the same patch, only the TARGET arch
    # differs.
    if: true
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4
        with:
          path: dart-labs

      - name: Checkout libmpv-darwin-build
        uses: actions/checkout@v4
        with:
          repository: media-kit/libmpv-darwin-build
          path: build-root
          # No pinned ref yet (first attempt at this TARGET) — same as
          # `darwin`'s note above; pin once a build here succeeds.

      - name: Apply mova slim-build patch
        working-directory: build-root
        # dart-labs was checked out to path: dart-labs (not the default
        # $GITHUB_WORKSPACE root, unlike the Android jobs' single checkout) —
        # the patch lives under that subdirectory, not a sibling of build-root.
        #
        # `git add -A` after apply: `nix develop`/`make` reads this checkout
        # via a `git+file://` flake source, which Nix filters to ONLY
        # git-tracked files — a plain `git apply` leaves new files (like the
        # patch's new mk-pkg-libass/meson.options) untracked, so Nix silently
        # never sees them and the build fails with "Path ... is not tracked
        # by Git" (hit this in run 35197895620, 2026-09-17). Config-only
        # `git add`, no commit needed — Nix only cares about the index/tree,
        # not history.
        run: |
          git apply ../dart-labs/mova-libmpv/libmpv-darwin-build-mova-slim.patch
          git add -A

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Resolve Xcode path
        id: xcode
        run: |
          # Same fallback as the `darwin` job's identical step.
          if [ -d /Applications/Xcode_16.1.0.app ]; then
            echo "path=$(realpath /Applications/Xcode_16.1.0.app)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Xcode_16.1.0.app not found, falling back to xcode-select's default — may not match what the flake expects"
            echo "path=$(xcode-select -p | sed 's|/Contents/Developer||')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (iOS device arm64 only, mova movaslim flavor)
        working-directory: build-root
        # TARGET name built from nix/utils/flake/create-cross-package.nix's
        # naming scheme: <packageName>-<format>-<os>-<arch>-<variant>-<flavor>.
        # packageName is the literal nix/packages/ subdirectory name
        # (packages-with-targets.nix derives it via readDir), which is
        # "mk-out-archive" — NOT the package's internal `name = "archive"`
        # variable used only for its derivation's own `name`/`pname`
        # attributes. First run (35192404441, 2026-09-17) used the wrong
        # "archive-..." prefix and failed with "flake ... does not provide
        # attribute ... archive-libs-ios-arm64-video-default"; this is the
        # corrected attribute. This is the smallest single flake output that
        # produces a real libmpv for iOS device — no simulator, no macOS, no
        # xcframework zip.
        run: nix develop -c make TARGET=mk-out-archive-libs-ios-arm64-video-movaslim XCODE_PATH="${{ steps.xcode.outputs.path }}" VERSION=mova-ci

      - name: Verify and extract
        working-directory: build-root
        run: |
          ls -la result/
          # -L: `result` is a symlink into the Nix store — plain `find result`
          # (no trailing slash, no -L) does not dereference it and silently
          # matches nothing, even though `ls -la result/` above (trailing
          # slash forces dereference) shows the archive right there. This
          # bit the first real build (run 35193860905, 2026-09-17): the nix
          # build succeeded and produced the tar.gz, but this step still
          # errored "no .tar.gz archive in result/".
          ARCHIVE=$(find -L result -name '*.tar.gz' | head -1)
          test -n "$ARCHIVE" || { echo "::error::no .tar.gz archive in result/"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/ios-out"
          tar -xzvf "$ARCHIVE" -C "$GITHUB_WORKSPACE/ios-out"

          # Nix's build doesn't strip these — cheap size win before even
          # touching static linking. -S drops debug info, -x drops global
          # symbols not needed for linking (same combo the old v2 iOS line
          # used; see its "Strip and verify" step history).
          find "$GITHUB_WORKSPACE/ios-out" -name '*.dylib' -exec strip -S -x {} \;

          DYLIB=$(find "$GITHUB_WORKSPACE/ios-out" -iname 'libmpv*.dylib' | head -1)
          test -n "$DYLIB" || { echo "::error::libmpv*.dylib not found inside archive"; find "$GITHUB_WORKSPACE/ios-out" -type f -print; exit 1; }

          # Symbol export check: same rationale and check as the `darwin`
          # job's identical step — movaslim's -fvisibility=hidden (cross-file/
          # default.nix) applies to mpv itself here too, and this was only
          # ever verified on the macOS build (run 35300824995), never on
          # this iOS target directly. host `nm -gU` reads the iOS arm64
          # Mach-O's symbol table fine even though it can't execute it.
          echo "### exported symbol check (libmpv.dylib, iOS arm64)" >> "$GITHUB_STEP_SUMMARY"
          MISSING_SYMS=""
          for sym in mpv_create mpv_initialize mpv_command mpv_command_async mpv_set_option mpv_observe_property mpv_render_context_create mpv_render_context_render mpv_wait_event mpv_terminate_destroy; do
            if nm -gU "$DYLIB" | grep -q " T _${sym}\$"; then
              echo "✅ $sym" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $sym MISSING" >> "$GITHUB_STEP_SUMMARY"
              MISSING_SYMS="$MISSING_SYMS $sym"
            fi
          done
          if [ -n "$MISSING_SYMS" ]; then
            echo "::error::libmpv.dylib is missing expected exported symbols:$MISSING_SYMS (likely -fvisibility=hidden swallowed the public API — check MPV_EXPORT annotations survived)"
            exit 1
          fi

          echo "### libmpv.dylib (iOS arm64, movaslim flavor)" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$DYLIB" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -f%z "$DYLIB")
          echo "$SIZE_BYTES bytes ($(echo "scale=2; $SIZE_BYTES/1048576" | bc) MiB)" >> "$GITHUB_STEP_SUMMARY"
          size -m "$DYLIB" >> "$GITHUB_STEP_SUMMARY" || true

          # libmpv.dylib alone isn't the whole story — the `libs` archive
          # format ships it alongside separately-linked ffmpeg/dav1d/libass/
          # freetype/harfbuzz/fribidi/etc. dylibs (see this job's top-of-file
          # comment). Report the whole bundle's total size too, since that's
          # the real number comparable to Android's single statically-linked
          # libmpv.so.
          echo "### total bundle size (all .dylib files, iOS arm64, movaslim flavor)" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$GITHUB_WORKSPACE/ios-out"/*/*.dylib >> "$GITHUB_STEP_SUMMARY"
          TOTAL_BYTES=$(find "$GITHUB_WORKSPACE/ios-out" -name '*.dylib' -exec stat -f%z {} \; | awk '{s+=$1} END {print s}')
          echo "$TOTAL_BYTES bytes ($(echo "scale=2; $TOTAL_BYTES/1048576" | bc) MiB) total across $(find "$GITHUB_WORKSPACE/ios-out" -name '*.dylib' | wc -l | tr -d ' ') files" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-ios-arm64-movaslim
          path: ios-out/*
          retention-days: 14

  # No upstream media-kit repo exists for Linux (unlike Android/darwin/win32)
  # — this builds ffmpeg+mpv from source natively on the runner itself, no
  # cross-compile toolchain needed. Dependencies (libass/freetype/harfbuzz/
  # fribidi/dav1d/mbedtls) come from apt instead of being built from source
  # like the Android buildscripts do, since a native Ubuntu build can just
  # link the system dev packages — there's no NDK-style sysroot to flatten.
  linux:
    name: "Linux x86_64 (implemented, v1: native build)"
    runs-on: ubuntu-22.04
    # paused — iOS-focused iteration (2026-09-17), see ios job below. The
    # dist/linux-x86_64/ artifact currently committed predates this job's
    # -Dgpl=false meson flag (see the mpv build step below); rebuild once
    # re-enabled.
    if: false
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build + runtime dependencies
        run: |
          sudo apt-get update
          # libmbedtls-dev dropped for libssl-dev (2026-09-17, see below).
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip \
            libass-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libdav1d-dev \
            libssl-dev libvpx-dev zlib1g-dev libva-dev libvdpau-dev
          pip3 install --user "meson==1.3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download ffmpeg and mpv sources
        run: |
          # n6.0.1, not n6.0: n6.0's inline asm in libavcodec/x86/mathops.h
          # feeds a non-immediate operand to shr/sar, which binutils >= 2.41
          # rejects ("operand type mismatch for 'shr'") — same bug the windows
          # job hit, fixed the same way. ubuntu-22.04's binutils 2.38 happens
          # to predate that threshold so n6.0 built here by luck, not because
          # the recipe was actually safe (2026-08-13 local WSL2 verification
          # on binutils 2.42 reproduced the failure) — a runner image bump
          # would have broken this silently. Locked to n6.0.1 pre-emptively.
          git clone --depth 1 --branch n6.0.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          # mpv's main branch needs a newer libavcodec than ffmpeg n6.0 ships
          # (meson: "found 60.3.100 but need >= 60.31.102") — pin to the same
          # mpv commit the Android build already verified pairs with ffmpeg
          # 6.0.x (see tools/ffmpeg-slim/README.md's "实测结果" section),
          # instead of guessing another ref.
          git clone https://github.com/mpv-player/mpv.git mpv-src
          git -C mpv-src checkout 78d43740f52db817d98bcf24fb30a76ab6fa13ff

      - name: Build slimmed ffmpeg (native, static)
        working-directory: ffmpeg-src
        run: |
          # 2026-08-13 local WSL2 verification (mova-libmpv/README.md "Linux
          # 瘦身构建"): mbedtls -> openssl is size-neutral (+64 bytes noise —
          # these deps are dynamically linked .so's on Linux, unlike Android/
          # iOS/Windows, so swapping which one you use barely touches
          # libmpv.so's own bytes) but drops --enable-version3 (mbedtls's
          # dual-licensing was the only reason for it), so the shipped
          # license goes back to LGPLv2.1 — same reasoning as the Windows
          # SChannel switch. --disable-symver: ffmpeg is statically linked in
          # here, so its ELF symbol-versioning scheme (@@LIBAVCODEC_60) is
          # dead weight — free win, no functional effect.
          # -fvisibility=hidden + -ffunction-sections/-fdata-sections +
          # --gc-sections: verified -368,608 bytes (-4.5%) on top of the
          # openssl baseline, dynamic export count 4,003 -> 443 (same order
          # of magnitude as Android's 4692->610). mpv's own MPV_EXPORT-marked
          # public API stays exported (mpv sets visibility("default")
          # explicitly on those symbols), so hiding everything else by
          # default doesn't touch the real API surface. This is real here
          # (ELF) — the same flag measured zero-effect on Windows's PE/COFF
          # target, see doc/plans/2026-09-17-windows-libmpv-slim.md §0.3.
          # NOT adding -flto: tried and it broke mpv's final link
          # ("relocation R_X86_64_PC32 against undefined symbol ... recompile
          # with -fPIC" — ffmpeg's x86 NASM objects don't satisfy LTO
          # bitcode's -fPIC requirement when mixed at link time). Not our
          # config's fault, ffmpeg's own asm generation limits it; Android/
          # iOS's LTO success doesn't transfer, they cross-compile via a
          # different meson-only toolchain path with no raw NASM objects.
          ./configure \
            --disable-gpl --disable-nonfree \
            --enable-static --disable-shared --pkg-config-flags=--static \
            --disable-doc --disable-programs --disable-avdevice --disable-postproc \
            --disable-muxers --disable-decoders --disable-encoders --disable-demuxers \
            --disable-parsers --disable-protocols --disable-devices --disable-filters \
            --enable-small --enable-optimizations --disable-symver \
            --extra-cflags="-fvisibility=hidden -ffunction-sections -fdata-sections" \
            --extra-ldflags="-Wl,--gc-sections" \
            --enable-openssl --enable-zlib --enable-libdav1d \
            --enable-vaapi --enable-vdpau \
            --enable-avutil --enable-avcodec --enable-avfilter --enable-avformat \
            --enable-swscale --enable-swresample \
            --enable-decoder=h264,hevc,vp9,libdav1d,png,aac,aac_latm,mp3,mp3float,opus,ac3,eac3,flac,vorbis,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_u8,ass,ssa,subrip,text,webvtt,movtext \
            --enable-encoder=png \
            --enable-parser=h264,hevc,vp9,av1,png,aac,aac_latm,ac3,flac,opus,vorbis,mpegaudio \
            --enable-demuxer=mov,matroska,webm_dash_manifest,mpegts,hls,flv,live_flv,data,mp3,flac,ogg,wav,aac,ac3,eac3,ass,srt,webvtt \
            --enable-protocol=file,fd,pipe,data,http,https,tcp,tls,crypto,rtmp,rtmps,rtmpt,rtmpts,ffrtmpcrypt,ffrtmphttp,udp,rtp \
            --enable-bsf=null,extract_extradata,h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc,vp9_superframe,vp9_superframe_split,av1_frame_split,av1_frame_merge,mov2textsub,dump_extradata,setts \
            --enable-network \
            --prefix="$GITHUB_WORKSPACE/prefix" 2>&1 | tee "$GITHUB_WORKSPACE/ffconf.log"
          grep -q 'License: LGPL version 2.1' "$GITHUB_WORKSPACE/ffconf.log" \
            || { echo "::error::License is not LGPLv2.1 — openssl switch didn't take effect or a version3-only component crept back in"; exit 1; }
          for proto in https tls rtmps; do
            grep -qw "$proto" "$GITHUB_WORKSPACE/ffconf.log" \
              || { echo "::error::protocol '$proto' missing after the openssl switch — TLS backend isn't actually working"; exit 1; }
          done
          make -j"$(nproc)"
          make install

      - name: Build mpv (native, against system libass/freetype and our ffmpeg)
        working-directory: mpv-src
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          # Force plain "lib" (not Ubuntu's multiarch "lib/x86_64-linux-gnu")
          # so Strip and verify can find prefix/lib/libmpv.so without guessing.
          # -Dgpl=false is not optional: mpv defaults to GPL, and this whole
          # slim build exists to stay LGPL (same flag the android flavor sets).
          # The dist/linux-x86_64/ artifact from run 31092096967 predates this
          # flag and must be rebuilt before it can ship.
          # buildtype=minsize (-Os) + debug=false (minsize alone silently
          # turns debug=true back on) + b_ndebug=true (drop asserts): mpv's
          # meson build never had a buildtype set before, so it was building
          # at meson's debugoptimized default (-O2 + debug=true) this whole
          # time — a pure missing-config gap. Verified -286,624 bytes (-3.7%)
          # on top of the ffmpeg-side gains above. -fvisibility=hidden +
          # -ffunction-sections/-fdata-sections + --gc-sections here too, for
          # the same reason as ffmpeg above.
          meson setup build --prefix="$GITHUB_WORKSPACE/prefix" --libdir=lib --default-library=shared \
            -Dbuildtype=minsize -Ddebug=false -Db_ndebug=true \
            -Dc_args="-fvisibility=hidden -ffunction-sections -fdata-sections" \
            -Dc_link_args="-Wl,--gc-sections" \
            -Dgpl=false -Dlibmpv=true -Dcplayer=false -Dtests=false
          ninja -C build
          ninja -C build install

      - name: Strip and verify
        run: |
          # Resolve via the unversioned symlink (not a libmpv.so* glob — that
          # expands to multiple paths and breaks strip's single-arg expectation).
          # --libdir=lib above lands it here; without that meson uses Ubuntu's
          # multiarch lib/x86_64-linux-gnu and this path 404s (run 31090200118).
          test -e "$GITHUB_WORKSPACE/prefix/lib/libmpv.so" \
            || { echo "::error::libmpv.so not at prefix/lib/ — check meson --libdir"; find "$GITHUB_WORKSPACE/prefix" -name 'libmpv.so*' -print; exit 1; }
          LIBMPV=$(readlink -f "$GITHUB_WORKSPACE/prefix/lib/libmpv.so")
          strip --strip-all "$LIBMPV"

          echo "### libmpv.so size (linux x86_64)" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$LIBMPV")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES"))" >> "$GITHUB_STEP_SUMMARY"

          # Android statically embeds dav1d (defined-only nm check). This Linux
          # v1 links system libdav1d.so, so dav1d_open is undefined + DT_NEEDED
          # rather than defined — accept either shape.
          nm -D --defined-only "$LIBMPV" | grep -q dav1d_open \
            || ldd "$LIBMPV" | grep -q libdav1d \
            || { echo "::error::dav1d not linked (no defined dav1d_open, no libdav1d NEEDED) — AV1 decode silently dropped"; exit 1; }

          # -fvisibility=hidden (2026-09-17) hides everything by default —
          # confirm mpv's actual public API (MPV_EXPORT-marked, explicit
          # visibility("default")) survived. Dynamic symbol table isn't
          # touched by `strip --strip-all`, so this works post-strip.
          for s in mpv_create mpv_initialize mpv_command mpv_set_option_string \
                   mpv_render_context_create mpv_terminate_destroy; do
            nm -D --defined-only "$LIBMPV" | grep -qw "$s" \
              || { echo "::error::public API symbol $s missing — -fvisibility=hidden over-hid it"; exit 1; }
          done

          cp "$LIBMPV" "$GITHUB_WORKSPACE/libmpv-linux-x86_64.so"

      - name: Upload libmpv.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-linux-x86_64
          path: libmpv-linux-x86_64.so
          retention-days: 30

      - name: Commit built artifact to dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Every retry starts from a fresh fetch+reset baseline and creates
          # a brand-new commit on top of it, instead of rebasing an
          # already-made local commit (see arm64-v8a job for why).
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p mova/tools/ffmpeg-slim/dist/linux-x86_64
            cp "$GITHUB_WORKSPACE/libmpv-linux-x86_64.so" mova/tools/ffmpeg-slim/dist/linux-x86_64/libmpv.so
            git add mova/tools/ffmpeg-slim/dist/linux-x86_64/libmpv.so
            if git diff --cached --quiet; then
              echo "No size/content change, skip commit"
              exit 0
            fi
            git commit -m "chore(mova): add linux x86_64 libmpv build, v1 native [skip ci]"
            git lfs push origin main
            if git push; then exit 0; fi
            echo "push rejected, retrying from a fresh baseline ($i/5)..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/linux-x86_64/ after retries"
          exit 1

  # Same native-slim recipe as the linux job, on MSYS2 MINGW64. Do NOT drive
  # media-kit/libmpv-win32-video-build here — that project is a Linux→Windows
  # cross-compile that builds its own GCC/LLVM toolchain + ~98 deps from
  # source (LD_PRELOAD/mimalloc, Docker, rustup); it cannot run usefully on
  # windows-latest and ships the upstream full flavor, not our slim list.
  # Deps (libass/freetype/harfbuzz/fribidi/dav1d/mbedtls) come from pacman.
  # Hardaccel: d3d11va/dxva2 instead of linux's vaapi/vdpau.
  windows:
    name: "Windows x86_64 (implemented, v1: native MSYS2 slim)"
    runs-on: windows-latest
    # paused — iOS-focused iteration (2026-09-17), see ios job below. Never
    # gone green before — expect iteration once re-enabled.
    if: false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-zlib
          # mbedtls dropped (Task 1: TLS backend switches to system SChannel,
          # zero extra bytes + LGPLv2.1 instead of v3) and dav1d dropped (Task 4:
          # built from source below — pacman's build isn't size-optimized and,
          # combined with -ffunction-sections, is a net *regression*; see
          # doc/plans/2026-09-17-windows-libmpv-slim.md §12 for the measurements
          # behind every flag choice in this job from here on).

      - name: Pin meson via pip
        run: |
          # Same pin as android/linux — keep meson versions aligned across jobs.
          pip3 install "meson==1.3.2"

      - name: Resolve MSYS-style workspace path
        run: |
          # $GITHUB_WORKSPACE is a Windows path (D:\a\dart-labs\dart-labs). Its
          # drive-letter colon collides with the ':' separator in
          # PKG_CONFIG_PATH, which is why meson couldn't see our libavcodec.pc
          # (run 31093497599) — every path below uses this POSIX form instead.
          echo "WS=$(cygpath -u "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

      - name: Download ffmpeg and mpv sources
        run: |
          # n6.0.1, not n6.0 like the android/linux jobs: ffmpeg 6.0's inline
          # asm in libavcodec/x86/mathops.h feeds a non-immediate operand to
          # shr/sar, which binutils >= 2.41 (what MSYS2 ships) rejects with
          # "operand type mismatch for `shr'" on aacdec/aacsbr/aacps
          # (run 31092943243). Upstream's fix is backported into 6.0.1, and
          # 6.0.x stays libavcodec 60.3.x so the mpv pairing below still holds.
          git clone --depth 1 --branch n6.0.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          # Same mpv↔ffmpeg 6.0 pairing the linux/android jobs already verified.
          git clone https://github.com/mpv-player/mpv.git mpv-src
          git -C mpv-src checkout 78d43740f52db817d98bcf24fb30a76ab6fa13ff

      - name: Patch mpv for current mingw-w64 headers
        run: |
          # ksmedia.h needs mmreg.h's WAVE_FORMAT_* macros but only includes
          # ks.h, and current mingw-w64 no longer pulls mmreg.h in transitively
          # (run 31094204221). Order matters: mmreg.h must come *before*
          # ksguid.h, because ksguid.h switches DEFINE_GUIDSTRUCT from emitting
          # extern declarations to emitting real GUID objects — put mmreg.h
          # after it and its GUIDs collide with ksmedia.h's (run 31095299330).
          # This is the include order upstream mpv uses under __MINGW32__; the
          # pinned commit predates that fix.
          FILES=$(grep -rl '#include <ksmedia.h>' mpv-src/audio mpv-src/osdep || true)
          test -n "$FILES" || { echo "::error::no ksmedia.h include found — mpv layout changed, revisit this patch"; exit 1; }
          for f in $FILES; do
            grep -q '^#include <ksguid.h>' "$f" || { echo "::error::$f includes ksmedia.h without ksguid.h — revisit this patch"; exit 1; }
            sed -i 's|^#include <ksguid.h>|#include <mmreg.h>\n#include <ksguid.h>\n#include <mmsystem.h>|' "$f"
            echo "patched $f"
          done

      - name: Build dav1d from source (Task 4, static, -Os, no section splitting)
        run: |
          # 2026-09-17 verified: pacman's mingw-w64-x86_64-dav1d ships tools/
          # tests/every SIMD variant, distro-generic optimization. Rebuilding
          # from source with buildtype=minsize (-Os) — deliberately WITHOUT
          # -ffunction-sections/-fdata-sections, which measured as a
          # regression here just like on ffmpeg below (same reason: dav1d's
          # AV1 decode paths are almost entirely reachable, so section
          # splitting is pure overhead) — measured -223,232 bytes (-1.6%) on
          # the final linked DLL, and the archive itself shrinks
          # 3,109,140 -> 2,842,692 bytes. -Dbitdepths=8,16 keeps 10-bit AV1
          # (desktop HDR content is common enough that dropping it to save a
          # few hundred KB isn't a good trade — see plan §6.1 for Android's
          # opposite call on mobile).
          #
          # Must run BEFORE ffmpeg's build: ffmpeg's --enable-libdav1d needs
          # dav1d.pc discoverable via pkg-config at ffmpeg's *configure* time,
          # and the mingw-w64-x86_64-dav1d pacman package is no longer
          # installed (see the setup-msys2 install list above) — CI hit this
          # exact ordering bug once already ("dav1d >= 0.5.0 not found using
          # pkg-config", run 35186094304) before this step was moved here.
          git clone --depth 1 --branch 1.2.1 https://code.videolan.org/videolan/dav1d.git dav1d-src
          cd dav1d-src
          meson setup _build --prefix="$WS/prefix" --libdir=lib \
            --default-library=static --buildtype=minsize \
            -Ddebug=false -Db_ndebug=true \
            -Denable_tools=false -Denable_tests=false -Denable_examples=false \
            -Dbitdepths=8,16
          ninja -C _build
          ninja -C _build install

      - name: Build slimmed ffmpeg (native, static)
        working-directory: ffmpeg-src
        run: |
          # MSYS2/MINGW64 gcc is already the target toolchain — no --cross-prefix.
          # Windows hardaccel is d3d11va/dxva2 (not vaapi/vdpau).
          # dav1d now lives in $WS/prefix (Task 4, built from source above),
          # not pacman's default /mingw64 prefix that pkg-config searches
          # automatically — must add it explicitly or configure can't find it.
          export PKG_CONFIG_PATH="$WS/prefix/lib/pkgconfig:/mingw64/lib/pkgconfig"
          # Task 1 (2026-09-17 verified): mbedtls -> system SChannel. Zero extra
          # bytes (SChannel is a Windows system API, not vendored code) and it
          # drops --enable-version3 (mbedtls's dual Apache-2.0/GPL-2.0 licensing
          # was the only reason that flag was needed), so the shipped license
          # goes back from LGPLv3 to LGPLv2.1. Verified https/tls/rtmps stay
          # enabled; only ffrtmpcrypt (RTMPE, not TLS-based) drops, which is
          # fine — rtmps still works. Measured: -773,632 bytes (-5.0%).
          #
          # Deliberately NOT adding --extra-cflags="-ffunction-sections ..."
          # here (that was this plan's original Task 2): measured on this exact
          # ffmpeg build, it made libavcodec.a balloon 27.5MB -> 32.9MB (+20%)
          # and the final linked+stripped DLL went from 14.70MiB to 32.58MiB
          # (+124%). ffmpeg's decoder code paths are almost entirely reachable
          # at runtime, so --gc-sections has essentially no dead code to
          # recover here — the flag is pure per-function section/relocation
          # overhead with no offsetting benefit. See
          # doc/plans/2026-09-17-windows-libmpv-slim.md §12 "发现 2" for the
          # full measurement and the (opposite) mpv-only result.
          ./configure \
            --target-os=mingw32 \
            --arch=x86_64 \
            --disable-gpl --disable-nonfree \
            --enable-static --disable-shared --pkg-config-flags=--static \
            --disable-doc --disable-programs --disable-avdevice --disable-postproc \
            --disable-muxers --disable-decoders --disable-encoders --disable-demuxers \
            --disable-parsers --disable-protocols --disable-devices --disable-filters \
            --enable-small --enable-optimizations \
            --enable-schannel --enable-zlib --enable-libdav1d \
            --enable-d3d11va --enable-dxva2 \
            --enable-avutil --enable-avcodec --enable-avfilter --enable-avformat \
            --enable-swscale --enable-swresample \
            --enable-decoder=h264,hevc,vp9,libdav1d,png,aac,aac_latm,mp3,mp3float,opus,ac3,eac3,flac,vorbis,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_u8,ass,ssa,subrip,text,webvtt,movtext \
            --enable-encoder=png \
            --enable-parser=h264,hevc,vp9,av1,png,aac,aac_latm,ac3,flac,opus,vorbis,mpegaudio \
            --enable-demuxer=mov,matroska,webm_dash_manifest,mpegts,hls,flv,live_flv,data,mp3,flac,ogg,wav,aac,ac3,eac3,ass,srt,webvtt \
            --enable-protocol=file,fd,pipe,data,http,https,tcp,tls,crypto,rtmp,rtmps,rtmpt,rtmpts,ffrtmpcrypt,ffrtmphttp,udp,rtp \
            --enable-bsf=null,extract_extradata,h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc,vp9_superframe,vp9_superframe_split,av1_frame_split,av1_frame_merge,mov2textsub,dump_extradata,setts \
            --enable-network \
            --prefix="$WS/prefix" 2>&1 | tee "$WS/ffconf.log"
          grep -q 'License: LGPL version 2.1' "$WS/ffconf.log" \
            || { echo "::error::License is not LGPLv2.1 — SChannel switch didn't take effect or a version3-only component crept back in"; exit 1; }
          for proto in https tls rtmps; do
            grep -qw "$proto" "$WS/ffconf.log" \
              || { echo "::error::protocol '$proto' missing after the SChannel switch — TLS backend isn't actually working"; exit 1; }
          done
          make -j"$(nproc)"
          make install

      - name: Build mpv (native, against pacman libass/freetype and our ffmpeg)
        working-directory: mpv-src
        run: |
          export PKG_CONFIG_PATH="$WS/prefix/lib/pkgconfig:/mingw64/lib/pkgconfig"
          # -Dgpl=false is not optional: mpv defaults to GPL, and this whole
          # slim build exists to stay LGPL (same flag the android flavor sets).
          # --prefer-static: our ffmpeg is static-only, and a mingw DLL cannot
          # carry undefined symbols, so its Libs.private deps (mbedtls/dav1d/
          # zlib) have to come in at link time. It also keeps the shipped DLL
          # self-contained instead of trailing a dozen MSYS2 runtime DLLs.
          # -lstdc++/-ldwrite: static libharfbuzz.a is C++ and uses DirectWrite,
          # but libmpv is a C target so the C driver links neither (the
          # operator new/delete undefined refs in run 31096129335).
          # Local verification (2026-09-17, doc/plans/2026-09-17-windows-libmpv-slim.md
          # Task 0) found the DLL was NOT actually self-contained despite the comment
          # above: it dynamically imported libgcc_s_seh-1.dll/libstdc++-6.dll/
          # libwinpthread-1.dll. -static-libgcc alone drops the first; plain
          # -static-libstdc++ has no effect here because we invoke the C driver with
          # an explicit -lstdc++ (the flag only substitutes a C++ driver's own
          # auto-added -lstdc++, not one we pass ourselves) — -Wl,-Bstatic ...
          # -Wl,-Bdynamic bracketing the two problem libs is what actually works.
          # Cost: +107,008 bytes (+0.7%) locally verified, correctness over size.
          #
          # Task 3 + extra (2026-09-17 verified, doc/plans/2026-09-17-windows-
          # libmpv-slim.md §12): buildtype=minsize (-Os) + -Ddebug=false (minsize
          # alone turns debug=true back on) + -Db_ndebug=true (drop asserts) +
          # -ffunction-sections/-fdata-sections + -Wl,--gc-sections together:
          # -424,448 bytes. Unlike ffmpeg/dav1d above, mpv's own object files
          # DO have real dead code (many optional subsystems compiled in but
          # unreachable with cplayer=false etc.), so section splitting pays off
          # here specifically — it's a net loss everywhere else in this job.
          # -Oz was tried in place of buildtype's default -Os (locally measured
          # -1,575,424 bytes, -11.2%) but real CI produced a DLL only ~11,776
          # bytes smaller than the plain -Os build (14,042,624 vs the -Os
          # baseline's 14,054,400) — nowhere near the local win, and the gap
          # was never root-caused (possible meson/gcc flag-merge-order
          # difference between the local toolchain snapshot and CI's). Given
          # the discrepancy is unexplained, reverted to -Os (buildtype=minsize's
          # own default — no explicit -O override needed) rather than ship an
          # optimization level whose real-world effect couldn't be confirmed.
          meson setup build --prefix="$WS/prefix" --libdir=lib --default-library=shared \
            --prefer-static \
            -Dbuildtype=minsize -Ddebug=false -Db_ndebug=true \
            -Dc_args="-ffunction-sections -fdata-sections -fomit-frame-pointer" \
            -Dcpp_args="-ffunction-sections -fdata-sections -fomit-frame-pointer" \
            -Dc_link_args="-Wl,-Bstatic -lstdc++ -lwinpthread -Wl,-Bdynamic -ldwrite -lole32 -lrpcrt4 -static-libgcc -Wl,--gc-sections -Wl,-Map=$(cygpath -m "$WS")/libmpv.map" \
            -Dcpp_link_args="-Wl,--gc-sections" \
            -Dgpl=false -Dlibmpv=true -Dcplayer=false -Dtests=false
          ninja -C build
          ninja -C build install

      - name: Strip and verify
        run: |
          # Meson on mingw names the shared lib libmpv-2.dll (soversion baked in).
          DLL=$(find "$WS/prefix" -iname 'libmpv*.dll' | head -1)
          test -n "$DLL" || { echo "::error::libmpv*.dll not found under prefix/"; find "$WS/prefix" -type f -print; exit 1; }

          # Task 0 (doc/plans/2026-09-17-windows-libmpv-slim.md): size attribution
          # by input archive/object, from the linker map, BEFORE strip removes the
          # symbol names the map references. Must not change the DLL's bytes.
          if [ -f "$WS/libmpv.map" ]; then
            echo "### 体积归因（按输入归档，链接期字节，未 strip）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            awk '
              /^ \.[^ ]+$/ { pending=1; next }
              {
                if (pending) { line = " x " $0; pending = 0 } else { line = $0 }
                n = split(line, f, /[ \t]+/)
                if (n >= 5 && f[3] ~ /^0x/ && f[4] ~ /^0x/ && f[5] ~ /\.(a|o)/) {
                  obj = f[5]; sub(/\(.*/, "", obj)
                  size[obj] += strtonum(f[4])
                }
              }
              END { for (o in size) printf "%12d  %s\n", size[o], o }
            ' "$WS/libmpv.map" | sort -rn | head -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::libmpv.map 未生成，体积归因缺失（检查 -Wl,-Map 是否被 meson 吞掉）"
          fi

          # Self-containment check: this build's whole point is one standalone
          # DLL, not one that hunts for MSYS2 runtime DLLs on the user's machine.
          # 2026-09-17 local verification caught this actually failing (see the
          # -Wl,-Bstatic/-static-libgcc comment on the meson setup step above) —
          # hard-fail so it can't silently regress again.
          echo "### DLL 导入表" >> "$GITHUB_STEP_SUMMARY"
          objdump -p "$DLL" | grep -i 'DLL Name' | sort -u >> "$GITHUB_STEP_SUMMARY"
          for bad in libstdc++ libgcc_s libwinpthread; do
            objdump -p "$DLL" | grep -i 'DLL Name' | grep -qi "$bad" \
              && { echo "::error::产物导入了 $bad —— 不再自包含，用户机器上会因缺少 MinGW 运行时而加载失败"; exit 1; }
          done

          # Symbol check, BEFORE strip (these are internal symbols, not part of
          # mpv's public export table, so they disappear from `nm` once
          # stripped — see plan §8). --gc-sections is now active on the mpv
          # link (Task 3), which is the first point in this job with a real
          # "silently discarded live code" risk, so check every dependency
          # this build actually exercises, not just dav1d.
          fail=0
          for s in mpv_create mpv_initialize mpv_command mpv_set_option_string \
                   mpv_render_context_create mpv_terminate_destroy \
                   dav1d_open ass_library_init ass_renderer_init ass_set_fonts \
                   hb_shape FT_Init_FreeType fribidi_get_par_embedding_levels_ex; do
            nm --defined-only "$DLL" 2>/dev/null | grep -qw "$s" \
              || { echo "::error::缺少符号 $s —— 被 --gc-sections 砍掉或依赖没链进来"; fail=1; }
          done
          test "$fail" = 0 || exit 1

          strip -s "$DLL"

          echo "### libmpv.dll size (windows x86_64)" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$DLL")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES" 2>/dev/null || echo "$SIZE_BYTES B"))" >> "$GITHUB_STEP_SUMMARY"

          # dav1d (and everything else) already checked above, before strip —
          # post-strip nm can't see internal symbols and dav1d is no longer
          # auto-exported now that it's built from source (2026-09-17 local
          # verification), so a post-strip check here would always fail.

          cp "$DLL" "$WS/libmpv-2-windows-x86_64.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-windows-x86_64
          path: libmpv-2-windows-x86_64.dll
          retention-days: 30

      - name: Commit built artifact to dist/
        # Override the job-wide `shell: msys2 {0}` default — this step only
        # needs git/git-lfs, not the MSYS2 toolchain, and MSYS2's PATH doesn't
        # include the Windows Git install where git-lfs.exe actually lives
        # (2026-09-17: every push attempt failed pre-push with "git-lfs was
        # not found on your path" under msys2, never a real content clash).
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-09-17: this job hit `cannot rebase: You have unstaged
          # changes` here because the old flow committed locally first and
          # only then tried to rebase that commit on conflict — any stray
          # dirty state in the tree (MSYS2 line-ending conversion, etc.) made
          # the rebase itself fail. Every retry now starts from a fresh
          # fetch+reset baseline and creates a brand-new commit on top of it
          # instead, which sidesteps the dirty-tree case entirely regardless
          # of what caused it.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p mova/tools/ffmpeg-slim/dist/windows-x86_64
            cp "$WS/libmpv-2-windows-x86_64.dll" mova/tools/ffmpeg-slim/dist/windows-x86_64/libmpv-2.dll
            git add mova/tools/ffmpeg-slim/dist/windows-x86_64/libmpv-2.dll
            if git diff --cached --quiet; then
              echo "No size/content change, skip commit"
              exit 0
            fi
            git commit -m "chore(mova): add windows x86_64 libmpv-2.dll build, v1 native MSYS2 slim [skip ci]"
            git lfs push origin main
            if git push; then exit 0; fi
            echo "push rejected, retrying from a fresh baseline ($i/5)..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/windows-x86_64/ after retries"
          exit 1
