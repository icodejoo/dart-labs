name: Build mova libmpv (all platforms)

# Only rebuilds when our build recipe changes — the ffmpeg/mpv/dav1d *source*
# itself isn't vendored in this repo (pulled fresh from upstream at build
# time per platform), so "source changes" here means our build recipe: the
# per-platform ffmpeg configure flavor + the buildscripts patch under
# tools/ffmpeg-slim/. See mova/tools/ffmpeg-slim/README.md's "多平台进度"
# table for what's real vs. still-being-verified — every job below now
# attempts a real build (no more no-op stubs), but darwin/linux/windows are
# first-attempt "v1"s that haven't been through a green CI run yet the way
# android-arm64/android-other-abi have (those needed a meson-version pin and
# an --enable-libdav1d fix before going green — expect the same kind of
# iteration here). Each platform's build toolchain is genuinely different —
# not a copy-paste of the Android shell-script pattern:
#   - android-arm64 / android-other-abi: media-kit/libmpv-android-video-build,
#     NDK cross-compile, shell flavor script (flavors-mova-slim.sh).
#   - darwin (iOS+macOS, one job — there's no separate ios/macos repo):
#     media-kit/libmpv-darwin-build, Nix + pinned Xcode, builds every
#     ios/iossimulator/macos target in one `make` invocation. v1 ships the
#     repo's own default flavor as-is (not our custom decoder/demuxer list).
#   - linux: no upstream media-kit repo exists at all — native build on the
#     runner itself (no cross-compile), deps from apt instead of source.
#   - windows: same native-slim pattern as linux, on MSYS2/MINGW64 — NOT
#     media-kit/libmpv-win32-video-build (that repo is a Linux→Windows
#     cross-compile of a full GCC/LLVM toolchain + ~98 deps; it cannot run
#     on windows-latest and isn't our slim flavor). Deps from pacman.
on:
  push:
    branches: [main]
    paths:
      - 'mova/tools/ffmpeg-slim/**'
      - '.github/workflows/build-mova-libmpv.yml'
  workflow_dispatch:

# The android-arm64 job commits the rebuilt artifact back to dist/ (see its
# last step) — the default GITHUB_TOKEN is read-only unless granted write
# here, so without this the build succeeds but the push-back 403s.
permissions:
  contents: write

env:
  # Pinned per tools/ffmpeg-slim/README.md's "实测结果" section — bump
  # deliberately, not implicitly, so a size regression can always be traced
  # back to either our flavor/patch or an explicit version bump here.
  ANDROID_LIBMPV_BUILD_REF: 1ecf510
  NDK_VERSION: 25.2.9519653
  NDK_ZIP_NAME: android-ndk-r25c-linux.zip

jobs:
  android-arm64:
    name: Android arm64-v8a (implemented)
    runs-on: ubuntu-22.04
    # Already green — temporarily disabled while iterating on linux/windows fixes.
    if: false
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip
          # ubuntu-22.04's apt meson is too old for mpv's build script (errors on
          # "unrecognized arguments: --prefer-static") — pin via pip to the version
          # verified working in the local WSL2 dry-run (Ubuntu 24.04's apt default).
          pip3 install --user "meson==1.3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone libmpv-android-video-build
        run: |
          git clone https://github.com/media-kit/libmpv-android-video-build build-root
          cd build-root
          git checkout "$ANDROID_LIBMPV_BUILD_REF"

      - name: Apply mova slim-build patch
        working-directory: build-root
        run: git apply ../mova/tools/ffmpeg-slim/libmpv-android-video-build.patch

      - name: Copy mova ffmpeg flavor into place
        run: cp mova/tools/ffmpeg-slim/flavors-mova-slim.sh build-root/buildscripts/scripts/ffmpeg.sh

      # sdkmanager's official NDK download is extremely slow (~0.12MB/s per
      # tools/ffmpeg-slim/README.md's "环境准备" section) — pull the zip
      # directly from Google's CDN instead and place it where build.sh expects it.
      # Both caches are keyed on pinned versions (NDK_VERSION /
      # ANDROID_LIBMPV_BUILD_REF), not on file hashes — the download scripts
      # themselves already skip re-fetching anything that's on disk (see
      # download-deps.sh's `[ ! -d dav1d ] && git clone ...` pattern), so a
      # cache hit here just needs to restore that disk state instead of
      # re-fetching ~500MB of NDK + several source trees on every single run
      # (arm64/armeabi-v7a/x86/x86_64 all fetch identically, so the same key
      # is shared across all 4 jobs — whichever runs first populates it).
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/sdk/android-sdk-linux/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK (direct, skip sdkmanager)
        run: |
          if [ -d "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION" ]; then
            echo "NDK restored from cache, skipping download"
          else
            mkdir -p "build-root/buildscripts/sdk/android-sdk-linux/ndk"
            curl -fsSL -o "$NDK_ZIP_NAME" "https://dl.google.com/android/repository/$NDK_ZIP_NAME"
            unzip -q "$NDK_ZIP_NAME" -d /tmp/ndk-extract
            mv /tmp/ndk-extract/android-ndk-r25c "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION"
          fi

      - name: Cache ffmpeg/mpv/dav1d/etc. source deps
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/deps
          key: android-deps-${{ env.ANDROID_LIBMPV_BUILD_REF }}

      - name: Download ffmpeg/mpv/dav1d/etc. sources
        working-directory: build-root/buildscripts
        run: ./include/download-deps.sh

      - name: Apply upstream source patches
        working-directory: build-root/buildscripts
        run: ./patch.sh

      - name: Build libmpv for arm64-v8a
        working-directory: build-root/buildscripts
        run: ./build.sh --arch arm64 mpv

      - name: Strip and verify
        working-directory: build-root/buildscripts
        run: |
          NDK_TOOLCHAIN=$(echo sdk/android-sdk-linux/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/*)
          LIBMPV=prefix/arm64-v8a/usr/local/lib/libmpv.so
          "$NDK_TOOLCHAIN/bin/llvm-strip" --strip-all "$LIBMPV"

          echo "### libmpv.so size (arm64-v8a)" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$LIBMPV")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES"))" >> "$GITHUB_STEP_SUMMARY"

          # Critical-path symbol check — silent MediaCodec fallback-to-software
          # is otherwise invisible (see README's mpv_lavc_set_java_vm note).
          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q mpv_lavc_set_java_vm \
            || { echo "::error::mpv_lavc_set_java_vm missing — MediaCodec JavaVM binding broken"; exit 1; }
          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q dav1d_open \
            || { echo "::error::dav1d_open missing — AV1 software fallback silently dropped (see README's --enable-libdav1d pitfall)"; exit 1; }
          for sym in h264_mediacodec_decoder hevc_mediacodec_decoder vp9_mediacodec_decoder av1_mediacodec_decoder; do
            "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q "$sym" \
              || echo "::warning::$sym not found in dynamic symbols (expected for a static hwdec wrapper — check unstripped build if this is unexpected)"
          done

          cp "$LIBMPV" "$GITHUB_WORKSPACE/libmpv-arm64-v8a.so"

      - name: Upload libmpv.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-android-arm64-v8a
          path: libmpv-arm64-v8a.so
          retention-days: 30

      - name: Commit built artifact to dist/
        run: |
          mkdir -p mova/tools/ffmpeg-slim/dist/arm64-v8a
          cp libmpv-arm64-v8a.so mova/tools/ffmpeg-slim/dist/arm64-v8a/libmpv.so
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mova/tools/ffmpeg-slim/dist/arm64-v8a/libmpv.so
          if git diff --cached --quiet; then
            echo "No size/content change, skip commit"
            exit 0
          fi
          git commit -m "chore(mova): rebuild slimmed libmpv.so (android arm64-v8a) [skip ci]"
          # This job runs concurrently with android-other-abi's 3 matrix legs
          # (and now darwin/linux/windows too) — all push to the same branch,
          # each touching a disjoint dist/<abi>/ path, so retry on rejection.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (race with a sibling job), rebasing and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/arm64-v8a/ after retries"
          exit 1

  # --- Everything below is a deliberate no-op scaffold, NOT a real build ---
  # Each stub documents which upstream build repo the real job needs to drive
  # and what's platform-specific about it (see README's "多平台进度" table).
  # Flip `if: false` → real steps once that platform's flavor script/patch
  # exists under tools/ffmpeg-slim/ and has been hand-verified once, the same
  # way android-arm64 was.

  android-other-abi:
    name: "Android ${{ matrix.abi }} (implemented)"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7l
            abi: armeabi-v7a
          - arch: x86
            abi: x86
          - arch: x86_64
            abi: x86_64
    # Already green — temporarily disabled while iterating on linux/windows fixes.
    if: false
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip
          pip3 install --user "meson==1.3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone libmpv-android-video-build
        run: |
          git clone https://github.com/media-kit/libmpv-android-video-build build-root
          cd build-root
          git checkout "$ANDROID_LIBMPV_BUILD_REF"

      - name: Apply mova slim-build patch
        working-directory: build-root
        run: git apply ../mova/tools/ffmpeg-slim/libmpv-android-video-build.patch

      - name: Copy mova ffmpeg flavor into place
        run: cp mova/tools/ffmpeg-slim/flavors-mova-slim.sh build-root/buildscripts/scripts/ffmpeg.sh

      # Both caches are keyed on pinned versions (NDK_VERSION /
      # ANDROID_LIBMPV_BUILD_REF), not on file hashes — the download scripts
      # themselves already skip re-fetching anything that's on disk (see
      # download-deps.sh's `[ ! -d dav1d ] && git clone ...` pattern), so a
      # cache hit here just needs to restore that disk state instead of
      # re-fetching ~500MB of NDK + several source trees on every single run
      # (arm64/armeabi-v7a/x86/x86_64 all fetch identically, so the same key
      # is shared across all 4 jobs — whichever runs first populates it).
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/sdk/android-sdk-linux/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK (direct, skip sdkmanager)
        run: |
          if [ -d "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION" ]; then
            echo "NDK restored from cache, skipping download"
          else
            mkdir -p "build-root/buildscripts/sdk/android-sdk-linux/ndk"
            curl -fsSL -o "$NDK_ZIP_NAME" "https://dl.google.com/android/repository/$NDK_ZIP_NAME"
            unzip -q "$NDK_ZIP_NAME" -d /tmp/ndk-extract
            mv /tmp/ndk-extract/android-ndk-r25c "build-root/buildscripts/sdk/android-sdk-linux/ndk/$NDK_VERSION"
          fi

      - name: Cache ffmpeg/mpv/dav1d/etc. source deps
        uses: actions/cache@v4
        with:
          path: build-root/buildscripts/deps
          key: android-deps-${{ env.ANDROID_LIBMPV_BUILD_REF }}

      - name: Download ffmpeg/mpv/dav1d/etc. sources
        working-directory: build-root/buildscripts
        run: ./include/download-deps.sh

      - name: Apply upstream source patches
        working-directory: build-root/buildscripts
        run: ./patch.sh

      - name: Build libmpv for ${{ matrix.abi }}
        working-directory: build-root/buildscripts
        run: ./build.sh --arch ${{ matrix.arch }} mpv

      - name: Strip and verify
        working-directory: build-root/buildscripts
        run: |
          NDK_TOOLCHAIN=$(echo sdk/android-sdk-linux/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/*)
          LIBMPV=prefix/${{ matrix.abi }}/usr/local/lib/libmpv.so
          "$NDK_TOOLCHAIN/bin/llvm-strip" --strip-all "$LIBMPV"

          echo "### libmpv.so size (${{ matrix.abi }})" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$LIBMPV")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES"))" >> "$GITHUB_STEP_SUMMARY"

          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q mpv_lavc_set_java_vm \
            || { echo "::error::mpv_lavc_set_java_vm missing — MediaCodec JavaVM binding broken"; exit 1; }
          "$NDK_TOOLCHAIN/bin/llvm-nm" -D --defined-only "$LIBMPV" | grep -q dav1d_open \
            || { echo "::error::dav1d_open missing — AV1 software fallback silently dropped (see README's --enable-libdav1d pitfall)"; exit 1; }

          cp "$LIBMPV" "$GITHUB_WORKSPACE/libmpv-${{ matrix.abi }}.so"

      - name: Upload libmpv.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-android-${{ matrix.abi }}
          path: libmpv-${{ matrix.abi }}.so
          retention-days: 30

      - name: Commit built artifact to dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p mova/tools/ffmpeg-slim/dist/${{ matrix.abi }}
          cp "$GITHUB_WORKSPACE/libmpv-${{ matrix.abi }}.so" mova/tools/ffmpeg-slim/dist/${{ matrix.abi }}/libmpv.so
          git add mova/tools/ffmpeg-slim/dist/${{ matrix.abi }}/libmpv.so
          if git diff --cached --quiet; then
            echo "No size/content change, skip commit"
            exit 0
          fi
          git commit -m "chore(mova): rebuild slimmed libmpv.so (android ${{ matrix.abi }}) [skip ci]"
          # 3 matrix legs (armeabi-v7a/x86/x86_64) push to the same branch
          # concurrently — each only touches its own dist/<abi>/ path, so a
          # rebase on conflict is always trivial, never a real content clash.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (race with a sibling matrix leg), rebasing and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/${{ matrix.abi }}/libmpv.so after retries"
          exit 1

  # iOS + macOS share one upstream repo (media-kit/libmpv-darwin-build) built
  # via Nix + a pinned Xcode — there is no separate ios/macos repo despite
  # what earlier comments here assumed. `nix develop -c make` with no TARGET
  # builds the flake's default package, which is every ios/iossimulator/macos
  # arch×variant×flavor combination in one go (see create-cross-package.nix),
  # so this is one job, not a matrix. v1 ships the repo's own "video/default"
  # flavor as-is (videotoolbox hwaccel + libdav1d already enabled upstream)
  # rather than re-deriving our exact Android decoder/demuxer list through
  # Nix overrides — that's a follow-up, not a blocker for a first real build.
  darwin:
    name: "macOS (implemented, v1: upstream default flavor)"
    runs-on: macos-15
    # Disabled while we isolate the new `ios` job below (only-iOS validation run).
    if: false
    steps:
      - name: Platform info
        run: sw_vers; uname -m

      - name: Checkout dart-labs
        uses: actions/checkout@v4
        with:
          path: dart-labs

      - name: Checkout libmpv-darwin-build
        uses: actions/checkout@v4
        with:
          repository: media-kit/libmpv-darwin-build
          path: build-root
          # No pinned ref yet (first attempt at this platform) — unlike the
          # Android build's ANDROID_LIBMPV_BUILD_REF, we don't have a
          # known-good commit to pin to. Pin this once a build here succeeds.

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Resolve Xcode path
        id: xcode
        run: |
          # The repo's own CI pins Xcode_16.1.0.app; fall back to whatever
          # Xcode the runner has if that exact version isn't preinstalled.
          if [ -d /Applications/Xcode_16.1.0.app ]; then
            echo "path=$(realpath /Applications/Xcode_16.1.0.app)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Xcode_16.1.0.app not found, falling back to xcode-select's default — may not match what the flake expects"
            echo "path=$(xcode-select -p | sed 's|/Contents/Developer||')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (all darwin targets, upstream default flavor)
        working-directory: build-root
        run: nix develop -c make XCODE_PATH="${{ steps.xcode.outputs.path }}" VERSION=mova-ci

      - name: Verify and collect
        working-directory: build-root
        run: |
          ls -la result/
          test -n "$(ls result/*ios* 2>/dev/null)" || { echo "::error::no iOS archive in result/"; exit 1; }
          test -n "$(ls result/*macos* 2>/dev/null)" || { echo "::error::no macOS archive in result/"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/darwin-out"
          cp result/*.tar.gz result/*.zip "$GITHUB_WORKSPACE/darwin-out/" 2>/dev/null || true
          echo "### darwin build artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$GITHUB_WORKSPACE/darwin-out" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-darwin
          path: darwin-out/*
          retention-days: 30

      - name: Commit built artifacts to dist/
        working-directory: dart-labs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p mova/tools/ffmpeg-slim/dist/darwin
          cp "$GITHUB_WORKSPACE"/darwin-out/* mova/tools/ffmpeg-slim/dist/darwin/
          git add mova/tools/ffmpeg-slim/dist/darwin/
          if git diff --cached --quiet; then
            echo "No size/content change, skip commit"
            exit 0
          fi
          git commit -m "chore(mova): add darwin (ios+macos) libmpv build, v1 upstream default flavor [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/darwin/ after retries"
          exit 1

  # Full iOS pipeline (2026-08-12) — cross-builds ffmpeg AND mpv (plus every
  # library mpv hard-depends on for subtitle rendering: libass/freetype/
  # harfbuzz/fribidi) for iOS arm64, then links everything statically into a
  # single libmpv.dylib the same shape as Android's "ffmpeg statically linked
  # into libmpv.so": every dependency is a static .a, only system frameworks
  # (VideoToolbox/AudioToolbox/CoreText/...) and the final libmpv itself are
  # dynamic. This is a genuine first attempt (no prior CI run has gone green
  # on this) — expect iteration the same way linux/windows needed several
  # rounds of real-failure fixes before going green (see their step comments).
  #
  # All the cross-compiled deps use meson (dav1d/freetype/fribidi/harfbuzz/
  # libass/mpv all ship meson build files) sharing one cross file, mirroring
  # Android's buildscripts pattern (README's "进一步瘦身需要的 buildscripts 补丁"
  # section) of native-file + b_lto=false to route around meson's LTO-leaking-
  # into-host-tools bug for fribidi's own build-time table generator.
  ios:
    name: "iOS arm64 (v2: full libmpv, static deps)"
    runs-on: macos-15
    env:
      IOS_MIN_VERSION: "13.0"
      DEPS: ${{ github.workspace }}/deps
      PREFIX: ${{ github.workspace }}/prefix
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install nasm pkg-config ninja cmake automake libtool
          # Same pin as android/linux/windows (README's "meson 版本坑"): mpv's
          # own build passes --prefer-static, which older meson releases
          # don't recognize. Installed via pip, ahead of any brew meson on PATH.
          pip3 install --break-system-packages "meson==1.3.2"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          # mpv's TOOLS/macos-sdk-version.py (run unconditionally by
          # meson.build whenever host_machine.system() == 'darwin', which is
          # true for iOS too, not just macOS) imports the long-removed
          # `distutils` stdlib module. Python 3.12+ (what's on this runner)
          # dropped it; setuptools vendors a compatible shim that makes
          # `import distutils` work again without patching mpv's source.
          pip3 install --break-system-packages setuptools

      - name: Resolve iOS SDK + clang, write meson cross/native files
        id: ios
        run: |
          SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          AR=$(xcrun --sdk iphoneos --find ar)
          STRIP=$(xcrun --sdk iphoneos --find strip)
          echo "sysroot=$SYSROOT" >> "$GITHUB_OUTPUT"
          echo "cc=$CC" >> "$GITHUB_OUTPUT"

          # Shared across dav1d/freetype/fribidi/harfbuzz/libass/mpv. Mirrors
          # the Android flavor's optimization flags (gc-sections/-fvisibility=
          # hidden/LTO/-Os-equivalent minsize) — see README's "进一步瘦身" section
          # for why each one earns its keep. `debug = false` overrides
          # meson's minsize-buildtype default (minsize implies debug=true,
          # i.e. -g on every object file) — nothing here should ship DWARF
          # debug info.
          # `sed` strips this heredoc's YAML-block indentation — a raw
          # `cat <<EOF` here would write the leading spaces straight into the
          # ini file, which meson's cross-file parser is not guaranteed to
          # tolerate on section headers.
          cat <<EOF | sed -e 's/^[[:space:]]*//' > "$GITHUB_WORKSPACE/ios-arm64.meson.cross"
          [binaries]
          c = '$CC'
          cpp = '$CC'
          objc = '$CC'
          ar = '$AR'
          strip = '$STRIP'
          pkgconfig = 'pkg-config'

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$SYSROOT', '-mios-version-min=$IOS_MIN_VERSION', '-ffunction-sections', '-fdata-sections', '-fvisibility=hidden', '-fomit-frame-pointer']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$SYSROOT', '-mios-version-min=$IOS_MIN_VERSION', '-Wl,-dead_strip']
          cpp_args = ['-arch', 'arm64', '-isysroot', '$SYSROOT', '-mios-version-min=$IOS_MIN_VERSION', '-ffunction-sections', '-fdata-sections', '-fvisibility=hidden', '-fomit-frame-pointer']
          cpp_link_args = ['-arch', 'arm64', '-isysroot', '$SYSROOT', '-mios-version-min=$IOS_MIN_VERSION', '-Wl,-dead_strip']
          objc_args = ['-arch', 'arm64', '-isysroot', '$SYSROOT', '-mios-version-min=$IOS_MIN_VERSION']
          objc_link_args = ['-arch', 'arm64', '-isysroot', '$SYSROOT', '-mios-version-min=$IOS_MIN_VERSION']
          b_lto = true
          buildtype = 'minsize'
          debug = false

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          # Host-tool LTO-leak workaround (README: meson's cross-file
          # [built-in options] leak into native build-time tools, e.g.
          # fribidi's own gen-unicode-version table generator, which the
          # host's plain linker then can't parse as LTO bitcode).
          cat <<EOF | sed -e 's/^[[:space:]]*//' > "$GITHUB_WORKSPACE/native.ini"
          [built-in options]
          b_lto = false
          EOF

      - name: Cross-build dav1d for iOS arm64
        run: |
          git clone --depth 1 --branch 1.2.0 https://github.com/videolan/dav1d.git dav1d-src
          meson setup dav1d-build dav1d-src --cross-file ios-arm64.meson.cross \
            --prefix="$DEPS" --libdir=lib --default-library=static \
            -Denable_tools=false -Denable_tests=false
          ninja -C dav1d-build
          ninja -C dav1d-build install

      - name: Cross-build freetype for iOS arm64
        run: |
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git freetype-src
          # Minimal font rasterizer: no compressed-font/color-bitmap support,
          # no harfbuzz round-trip (harfbuzz depends on freetype, not the
          # other way round, for our use).
          meson setup freetype-build freetype-src --cross-file ios-arm64.meson.cross \
            --prefix="$DEPS" --libdir=lib --default-library=static \
            -Dbrotli=disabled -Dbzip2=disabled -Dharfbuzz=disabled -Dpng=disabled -Dzlib=disabled -Dmmap=disabled -Dtests=disabled
          ninja -C freetype-build
          ninja -C freetype-build install
        env:
          PKG_CONFIG_PATH: ${{ env.DEPS }}/lib/pkgconfig

      - name: Cross-build fribidi for iOS arm64
        run: |
          git clone --depth 1 --branch v1.0.13 https://github.com/fribidi/fribidi.git fribidi-src
          # --native-file: fribidi's own build runs a host-native table
          # generator (gen-unicode-version) that b_lto=true from the cross
          # file would otherwise poison (README's LTO-leak note).
          meson setup fribidi-build fribidi-src --cross-file ios-arm64.meson.cross --native-file native.ini \
            --prefix="$DEPS" --libdir=lib --default-library=static \
            -Ddocs=false -Dbin=false -Dtests=false -Ddeprecated=false
          ninja -C fribidi-build
          ninja -C fribidi-build install

      - name: Cross-build harfbuzz for iOS arm64
        run: |
          git clone --depth 1 --branch 8.3.0 https://github.com/harfbuzz/harfbuzz.git harfbuzz-src
          meson setup harfbuzz-build harfbuzz-src --cross-file ios-arm64.meson.cross \
            --prefix="$DEPS" --libdir=lib --default-library=static \
            -Dglib=disabled -Dgobject=disabled -Dcairo=disabled -Dchafa=disabled -Dicu=disabled \
            -Dgraphite=disabled -Dgraphite2=disabled -Dcoretext=disabled -Dfreetype=enabled \
            -Dtests=disabled -Dintrospection=disabled -Ddocs=disabled -Dutilities=disabled
          ninja -C harfbuzz-build
          ninja -C harfbuzz-build install
        env:
          PKG_CONFIG_PATH: ${{ env.DEPS }}/lib/pkgconfig

      - name: Cross-build libass for iOS arm64
        run: |
          git clone --depth 1 --branch 0.17.3 https://github.com/libass/libass.git libass-src
          # coretext=enabled: libass requires a system font provider
          # (fontconfig or coretext) or its build refuses to configure;
          # fontconfig isn't cross-built here, CoreText is a real iOS
          # framework so this is the correct (not a workaround) choice.
          meson setup libass-build libass-src --cross-file ios-arm64.meson.cross \
            --prefix="$DEPS" --libdir=lib --default-library=static \
            -Dfontconfig=disabled -Dcoretext=enabled -Ddirectwrite=disabled -Dasm=disabled \
            -Dlibunibreak=disabled -Dtest=false -Dprofile=false
          ninja -C libass-build
          ninja -C libass-build install
        env:
          PKG_CONFIG_PATH: ${{ env.DEPS }}/lib/pkgconfig

      - name: Download ffmpeg source
        run: git clone --depth 1 --branch n6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      - name: Build ffmpeg with iOS movaslim flavor
        working-directory: ffmpeg-src
        env:
          PKG_CONFIG_PATH: ${{ env.DEPS }}/lib/pkgconfig
        run: |
          cp ../mova/tools/ffmpeg-slim/flavors-mova-slim-ios.sh .
          chmod +x flavors-mova-slim-ios.sh
          ./flavors-mova-slim-ios.sh

      - name: Cross-build mpv for iOS arm64 (static deps, dynamic libmpv)
        env:
          PKG_CONFIG_PATH: ${{ env.DEPS }}/lib/pkgconfig:${{ env.PREFIX }}/lib/pkgconfig
        run: |
          git clone https://github.com/mpv-player/mpv.git mpv-src
          git -C mpv-src checkout 78d43740f52db817d98bcf24fb30a76ab6fa13ff
          # --default-library=shared + --prefer-static: the one dynamic
          # output is libmpv.dylib itself; every dependency it pulls in
          # (ffmpeg/dav1d/libass/freetype/harfbuzz/fribidi) is linked in
          # statically — same shape as Android's "ffmpeg statically linked
          # into libmpv.so". gpl=false is mandatory (mpv defaults to GPL).
          # Most feature/AO/VO toggles below are explicit disables for
          # subsystems this build has no cross-built dependency for, or
          # that don't apply off pure-iOS (cocoa/d3d11/vaapi/...); ios-gl is
          # the real iOS OpenGL ES + VideoToolbox hwdec interop path, kept
          # enabled; audiounit is the real iOS audio output, kept enabled.
          meson setup mpv-build mpv-src --cross-file ios-arm64.meson.cross \
            --prefix="$PREFIX" --libdir=lib --default-library=shared --prefer-static \
            -Dgpl=false -Dlibmpv=true -Dcplayer=false -Dtests=false -Dbuild-date=false \
            -Dcdda=disabled -Ddvbin=disabled -Ddvdnav=disabled -Diconv=disabled \
            -Djavascript=disabled -Dlcms2=disabled -Dlibarchive=disabled -Dlibavdevice=disabled \
            -Dlibbluray=disabled -Dlua=disabled -Drubberband=disabled -Dsdl2=disabled \
            -Dsdl2-gamepad=disabled -Duchardet=disabled -Dvapoursynth=disabled -Dzimg=disabled \
            -Dzlib=enabled -Dcplugins=disabled \
            -Dalsa=disabled -Daudiounit=enabled -Dcoreaudio=disabled -Djack=disabled \
            -Dopensles=disabled -Doss-audio=disabled -Dpipewire=disabled -Dpulse=disabled \
            -Dsdl2-audio=disabled -Dsndio=disabled -Dwasapi=disabled \
            -Dcaca=disabled -Dcocoa=disabled -Dd3d11=disabled -Ddirect3d=disabled \
            -Ddmabuf-wayland=disabled -Ddrm=disabled -Degl=disabled -Degl-android=disabled \
            -Dgbm=disabled -Dgl=enabled -Dgl-cocoa=disabled -Dgl-win32=disabled -Dgl-x11=disabled \
            -Djpeg=disabled -Dlibplacebo=disabled -Dsdl2-video=disabled -Dshaderc=disabled \
            -Dsixel=disabled -Dspirv-cross=disabled -Dplain-gl=enabled -Dvdpau=disabled \
            -Dvaapi=disabled -Dvulkan=disabled -Dwayland=disabled -Dx11=disabled -Dxv=disabled \
            -Dandroid-media-ndk=disabled -Dcuda-hwaccel=disabled -Dcuda-interop=disabled \
            -Dd3d-hwaccel=disabled -Dd3d9-hwaccel=disabled -Dgl-dxinterop-d3d9=disabled \
            -Dios-gl=enabled -Drpi-mmal=disabled -Dvideotoolbox-gl=disabled -Dvulkan-interop=disabled \
            -Dmacos-10-11-features=disabled -Dmacos-10-12-2-features=disabled \
            -Dmacos-10-14-features=disabled -Dmacos-cocoa-cb=disabled -Dmacos-media-player=disabled \
            -Dmacos-touchbar=disabled -Dswift-build=disabled \
            -Dhtml-build=disabled -Dmanpage-build=disabled -Dpdf-build=disabled
          ninja -C mpv-build
          ninja -C mpv-build install

      - name: Strip and verify
        run: |
          DYLIB=$(find "$PREFIX" -iname 'libmpv*.dylib' | head -1)
          test -n "$DYLIB" || { echo "::error::libmpv*.dylib not found under prefix/"; find "$PREFIX" -type f -print; exit 1; }
          # -x alone only drops global symbols not needed for linking — it
          # does NOT touch embedded DWARF debug info. -S drops that. This is
          # macOS's standard "shipping dylib" combo (Android's analogous
          # `llvm-strip --strip-all` does both in one flag).
          strip -S -x "$DYLIB"

          echo "### libmpv.dylib size (iOS arm64, movaslim, static deps)" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -f%z "$DYLIB")
          echo "$SIZE_BYTES bytes ($(echo "scale=2; $SIZE_BYTES/1048576" | bc) MiB)" >> "$GITHUB_STEP_SUMMARY"

          # Confirm nothing leaked in as a dynamic dependency other than
          # system frameworks — otool -L should show no path into $DEPS/$PREFIX.
          echo "### otool -L (expect only /usr/lib, /System, @rpath)"
          otool -L "$DYLIB"
          echo "### otool -L (expect only /usr/lib, /System, @rpath)" >> "$GITHUB_STEP_SUMMARY"
          otool -L "$DYLIB" >> "$GITHUB_STEP_SUMMARY"
          # otool -L's first TWO lines are the header ("path:") and the
          # dylib's own install-name entry (which legitimately lives under
          # $PREFIX since that's where we installed it) — skip both;
          # everything after should be a /usr/lib or /System/Library path.
          if otool -L "$DYLIB" | tail -n +3 | grep -qE "$DEPS|$PREFIX"; then
            echo "::error::libmpv.dylib links a dependency dynamically instead of statically — check --prefer-static/--default-library=static above"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/ios-out"
          cp "$DYLIB" "$GITHUB_WORKSPACE/ios-out/libmpv.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-ios-arm64-movaslim
          path: ios-out/*
          retention-days: 14

  # No upstream media-kit repo exists for Linux (unlike Android/darwin/win32)
  # — this builds ffmpeg+mpv from source natively on the runner itself, no
  # cross-compile toolchain needed. Dependencies (libass/freetype/harfbuzz/
  # fribidi/dav1d/mbedtls) come from apt instead of being built from source
  # like the Android buildscripts do, since a native Ubuntu build can just
  # link the system dev packages — there's no NDK-style sysroot to flatten.
  linux:
    name: "Linux x86_64 (implemented, v1: native build)"
    runs-on: ubuntu-22.04
    # Already green (run 31092096967) — disabled while iterating on windows.
    if: false
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - name: Install build + runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm autoconf automake libtool python3-pip \
            libass-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libdav1d-dev \
            libmbedtls-dev libvpx-dev zlib1g-dev libva-dev libvdpau-dev
          pip3 install --user "meson==1.3.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download ffmpeg and mpv sources
        run: |
          git clone --depth 1 --branch n6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          # mpv's main branch needs a newer libavcodec than ffmpeg n6.0 ships
          # (meson: "found 60.3.100 but need >= 60.31.102") — pin to the same
          # mpv commit the Android build already verified pairs with ffmpeg
          # 6.0 (see tools/ffmpeg-slim/README.md's "实测结果" section), instead
          # of guessing another ref.
          git clone https://github.com/mpv-player/mpv.git mpv-src
          git -C mpv-src checkout 78d43740f52db817d98bcf24fb30a76ab6fa13ff

      - name: Build slimmed ffmpeg (native, static)
        working-directory: ffmpeg-src
        run: |
          ./configure \
            --disable-gpl --disable-nonfree --enable-version3 \
            --enable-static --disable-shared --pkg-config-flags=--static \
            --disable-doc --disable-programs --disable-avdevice --disable-postproc \
            --disable-muxers --disable-decoders --disable-encoders --disable-demuxers \
            --disable-parsers --disable-protocols --disable-devices --disable-filters \
            --enable-small --enable-optimizations \
            --enable-mbedtls --enable-zlib --enable-libdav1d \
            --enable-vaapi --enable-vdpau \
            --enable-avutil --enable-avcodec --enable-avfilter --enable-avformat \
            --enable-swscale --enable-swresample \
            --enable-decoder=h264,hevc,vp9,libdav1d,png,aac,aac_latm,mp3,mp3float,opus,ac3,eac3,flac,vorbis,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_u8,ass,ssa,subrip,text,webvtt,movtext \
            --enable-encoder=png \
            --enable-parser=h264,hevc,vp9,av1,png,aac,aac_latm,ac3,flac,opus,vorbis,mpegaudio \
            --enable-demuxer=mov,matroska,webm_dash_manifest,mpegts,hls,flv,live_flv,data,mp3,flac,ogg,wav,aac,ac3,eac3,ass,srt,webvtt \
            --enable-protocol=file,fd,pipe,data,http,https,tcp,tls,crypto,rtmp,rtmps,rtmpt,rtmpts,ffrtmpcrypt,ffrtmphttp,udp,rtp \
            --enable-bsf=null,extract_extradata,h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc,vp9_superframe,vp9_superframe_split,av1_frame_split,av1_frame_merge,mov2textsub,dump_extradata,setts \
            --enable-network \
            --prefix="$GITHUB_WORKSPACE/prefix"
          make -j"$(nproc)"
          make install

      - name: Build mpv (native, against system libass/freetype and our ffmpeg)
        working-directory: mpv-src
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          # Force plain "lib" (not Ubuntu's multiarch "lib/x86_64-linux-gnu")
          # so Strip and verify can find prefix/lib/libmpv.so without guessing.
          # -Dgpl=false is not optional: mpv defaults to GPL, and this whole
          # slim build exists to stay LGPL (same flag the android flavor sets).
          # The dist/linux-x86_64/ artifact from run 31092096967 predates this
          # flag and must be rebuilt before it can ship.
          meson setup build --prefix="$GITHUB_WORKSPACE/prefix" --libdir=lib --default-library=shared \
            -Dgpl=false -Dlibmpv=true -Dcplayer=false -Dtests=false
          ninja -C build
          ninja -C build install

      - name: Strip and verify
        run: |
          # Resolve via the unversioned symlink (not a libmpv.so* glob — that
          # expands to multiple paths and breaks strip's single-arg expectation).
          # --libdir=lib above lands it here; without that meson uses Ubuntu's
          # multiarch lib/x86_64-linux-gnu and this path 404s (run 31090200118).
          test -e "$GITHUB_WORKSPACE/prefix/lib/libmpv.so" \
            || { echo "::error::libmpv.so not at prefix/lib/ — check meson --libdir"; find "$GITHUB_WORKSPACE/prefix" -name 'libmpv.so*' -print; exit 1; }
          LIBMPV=$(readlink -f "$GITHUB_WORKSPACE/prefix/lib/libmpv.so")
          strip --strip-all "$LIBMPV"

          echo "### libmpv.so size (linux x86_64)" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$LIBMPV")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES"))" >> "$GITHUB_STEP_SUMMARY"

          # Android statically embeds dav1d (defined-only nm check). This Linux
          # v1 links system libdav1d.so, so dav1d_open is undefined + DT_NEEDED
          # rather than defined — accept either shape.
          nm -D --defined-only "$LIBMPV" | grep -q dav1d_open \
            || ldd "$LIBMPV" | grep -q libdav1d \
            || { echo "::error::dav1d not linked (no defined dav1d_open, no libdav1d NEEDED) — AV1 decode silently dropped"; exit 1; }

          cp "$LIBMPV" "$GITHUB_WORKSPACE/libmpv-linux-x86_64.so"

      - name: Upload libmpv.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-linux-x86_64
          path: libmpv-linux-x86_64.so
          retention-days: 30

      - name: Commit built artifact to dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p mova/tools/ffmpeg-slim/dist/linux-x86_64
          cp "$GITHUB_WORKSPACE/libmpv-linux-x86_64.so" mova/tools/ffmpeg-slim/dist/linux-x86_64/libmpv.so
          git add mova/tools/ffmpeg-slim/dist/linux-x86_64/libmpv.so
          if git diff --cached --quiet; then
            echo "No size/content change, skip commit"
            exit 0
          fi
          git commit -m "chore(mova): add linux x86_64 libmpv build, v1 native [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/linux-x86_64/ after retries"
          exit 1

  # Same native-slim recipe as the linux job, on MSYS2 MINGW64. Do NOT drive
  # media-kit/libmpv-win32-video-build here — that project is a Linux→Windows
  # cross-compile that builds its own GCC/LLVM toolchain + ~98 deps from
  # source (LD_PRELOAD/mimalloc, Docker, rustup); it cannot run usefully on
  # windows-latest and ships the upstream full flavor, not our slim list.
  # Deps (libass/freetype/harfbuzz/fribidi/dav1d/mbedtls) come from pacman.
  # Hardaccel: d3d11va/dxva2 instead of linux's vaapi/vdpau.
  windows:
    name: "Windows x86_64 (implemented, v1: native MSYS2 slim)"
    runs-on: windows-latest
    # Disabled while we isolate the new `ios` job below (only-iOS validation run).
    if: false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout dart-labs
        uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-dav1d
            mingw-w64-x86_64-mbedtls
            mingw-w64-x86_64-zlib

      - name: Pin meson via pip
        run: |
          # Same pin as android/linux — keep meson versions aligned across jobs.
          pip3 install "meson==1.3.2"

      - name: Resolve MSYS-style workspace path
        run: |
          # $GITHUB_WORKSPACE is a Windows path (D:\a\dart-labs\dart-labs). Its
          # drive-letter colon collides with the ':' separator in
          # PKG_CONFIG_PATH, which is why meson couldn't see our libavcodec.pc
          # (run 31093497599) — every path below uses this POSIX form instead.
          echo "WS=$(cygpath -u "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

      - name: Download ffmpeg and mpv sources
        run: |
          # n6.0.1, not n6.0 like the android/linux jobs: ffmpeg 6.0's inline
          # asm in libavcodec/x86/mathops.h feeds a non-immediate operand to
          # shr/sar, which binutils >= 2.41 (what MSYS2 ships) rejects with
          # "operand type mismatch for `shr'" on aacdec/aacsbr/aacps
          # (run 31092943243). Upstream's fix is backported into 6.0.1, and
          # 6.0.x stays libavcodec 60.3.x so the mpv pairing below still holds.
          git clone --depth 1 --branch n6.0.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          # Same mpv↔ffmpeg 6.0 pairing the linux/android jobs already verified.
          git clone https://github.com/mpv-player/mpv.git mpv-src
          git -C mpv-src checkout 78d43740f52db817d98bcf24fb30a76ab6fa13ff

      - name: Patch mpv for current mingw-w64 headers
        run: |
          # ksmedia.h needs mmreg.h's WAVE_FORMAT_* macros but only includes
          # ks.h, and current mingw-w64 no longer pulls mmreg.h in transitively
          # (run 31094204221). Order matters: mmreg.h must come *before*
          # ksguid.h, because ksguid.h switches DEFINE_GUIDSTRUCT from emitting
          # extern declarations to emitting real GUID objects — put mmreg.h
          # after it and its GUIDs collide with ksmedia.h's (run 31095299330).
          # This is the include order upstream mpv uses under __MINGW32__; the
          # pinned commit predates that fix.
          FILES=$(grep -rl '#include <ksmedia.h>' mpv-src/audio mpv-src/osdep || true)
          test -n "$FILES" || { echo "::error::no ksmedia.h include found — mpv layout changed, revisit this patch"; exit 1; }
          for f in $FILES; do
            grep -q '^#include <ksguid.h>' "$f" || { echo "::error::$f includes ksmedia.h without ksguid.h — revisit this patch"; exit 1; }
            sed -i 's|^#include <ksguid.h>|#include <mmreg.h>\n#include <ksguid.h>\n#include <mmsystem.h>|' "$f"
            echo "patched $f"
          done

      - name: Build slimmed ffmpeg (native, static)
        working-directory: ffmpeg-src
        run: |
          # MSYS2/MINGW64 gcc is already the target toolchain — no --cross-prefix.
          # Windows hardaccel is d3d11va/dxva2 (not vaapi/vdpau).
          ./configure \
            --target-os=mingw32 \
            --arch=x86_64 \
            --disable-gpl --disable-nonfree --enable-version3 \
            --enable-static --disable-shared --pkg-config-flags=--static \
            --disable-doc --disable-programs --disable-avdevice --disable-postproc \
            --disable-muxers --disable-decoders --disable-encoders --disable-demuxers \
            --disable-parsers --disable-protocols --disable-devices --disable-filters \
            --enable-small --enable-optimizations \
            --enable-mbedtls --enable-zlib --enable-libdav1d \
            --enable-d3d11va --enable-dxva2 \
            --enable-avutil --enable-avcodec --enable-avfilter --enable-avformat \
            --enable-swscale --enable-swresample \
            --enable-decoder=h264,hevc,vp9,libdav1d,png,aac,aac_latm,mp3,mp3float,opus,ac3,eac3,flac,vorbis,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_u8,ass,ssa,subrip,text,webvtt,movtext \
            --enable-encoder=png \
            --enable-parser=h264,hevc,vp9,av1,png,aac,aac_latm,ac3,flac,opus,vorbis,mpegaudio \
            --enable-demuxer=mov,matroska,webm_dash_manifest,mpegts,hls,flv,live_flv,data,mp3,flac,ogg,wav,aac,ac3,eac3,ass,srt,webvtt \
            --enable-protocol=file,fd,pipe,data,http,https,tcp,tls,crypto,rtmp,rtmps,rtmpt,rtmpts,ffrtmpcrypt,ffrtmphttp,udp,rtp \
            --enable-bsf=null,extract_extradata,h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc,vp9_superframe,vp9_superframe_split,av1_frame_split,av1_frame_merge,mov2textsub,dump_extradata,setts \
            --enable-network \
            --prefix="$WS/prefix"
          make -j"$(nproc)"
          make install

      - name: Build mpv (native, against pacman libass/freetype and our ffmpeg)
        working-directory: mpv-src
        run: |
          export PKG_CONFIG_PATH="$WS/prefix/lib/pkgconfig:/mingw64/lib/pkgconfig"
          # -Dgpl=false is not optional: mpv defaults to GPL, and this whole
          # slim build exists to stay LGPL (same flag the android flavor sets).
          # --prefer-static: our ffmpeg is static-only, and a mingw DLL cannot
          # carry undefined symbols, so its Libs.private deps (mbedtls/dav1d/
          # zlib) have to come in at link time. It also keeps the shipped DLL
          # self-contained instead of trailing a dozen MSYS2 runtime DLLs.
          # -lstdc++/-ldwrite: static libharfbuzz.a is C++ and uses DirectWrite,
          # but libmpv is a C target so the C driver links neither (the
          # operator new/delete undefined refs in run 31096129335).
          meson setup build --prefix="$WS/prefix" --libdir=lib --default-library=shared \
            --prefer-static \
            -Dc_link_args="-lstdc++ -ldwrite -lole32 -lrpcrt4" \
            -Dgpl=false -Dlibmpv=true -Dcplayer=false -Dtests=false
          ninja -C build
          ninja -C build install

      - name: Strip and verify
        run: |
          # Meson on mingw names the shared lib libmpv-2.dll (soversion baked in).
          DLL=$(find "$WS/prefix" -iname 'libmpv*.dll' | head -1)
          test -n "$DLL" || { echo "::error::libmpv*.dll not found under prefix/"; find "$WS/prefix" -type f -print; exit 1; }
          strip -s "$DLL"

          echo "### libmpv.dll size (windows x86_64)" >> "$GITHUB_STEP_SUMMARY"
          SIZE_BYTES=$(stat -c%s "$DLL")
          echo "$SIZE_BYTES bytes ($(numfmt --to=iec-i --suffix=B "$SIZE_BYTES" 2>/dev/null || echo "$SIZE_BYTES B"))" >> "$GITHUB_STEP_SUMMARY"

          # Pacman dav1d is shared — expect either a defined symbol or a DLL import.
          nm --defined-only "$DLL" 2>/dev/null | grep -q dav1d_open \
            || objdump -p "$DLL" | grep -qi dav1d \
            || { echo "::error::dav1d not linked (no defined dav1d_open, no dav1d DLL import) — AV1 decode silently dropped"; exit 1; }

          cp "$DLL" "$WS/libmpv-2-windows-x86_64.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-libmpv-windows-x86_64
          path: libmpv-2-windows-x86_64.dll
          retention-days: 30

      - name: Commit built artifact to dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p mova/tools/ffmpeg-slim/dist/windows-x86_64
          cp "$WS/libmpv-2-windows-x86_64.dll" mova/tools/ffmpeg-slim/dist/windows-x86_64/libmpv-2.dll
          git add mova/tools/ffmpeg-slim/dist/windows-x86_64/libmpv-2.dll
          if git diff --cached --quiet; then
            echo "No size/content change, skip commit"
            exit 0
          fi
          git commit -m "chore(mova): add windows x86_64 libmpv-2.dll build, v1 native MSYS2 slim [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::failed to push dist/windows-x86_64/ after retries"
          exit 1
