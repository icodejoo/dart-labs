  #       working-directory: svgx/example
  #       run: flutter pub get
  #
  #     # cargokit's CMake ExternalProject step cross-compiles the Rust crate
  #     # and links it into the plugin's native library as part of this build —
  #     # no separate `cargo build` invocation needed.
  #     - name: flutter build windows
  #       working-directory: svgx/example
  #       run: flutter build windows

  build-android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android NDK 28
        run: |
          NDK_VERSION="28.0.13004108"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-cargo-android-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-cargo-android-

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: svgx-gradle-${{ hashFiles('svgx/example/android/**/*.gradle*', 'svgx/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            svgx-gradle-

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      # Unsigned debug build — no signing keys involved. cargokit's Gradle
      # hook cross-compiles the Rust crate for all 4 Android ABIs and bundles
      # the resulting .so files into the APK.
      - name: flutter build apk --debug
        working-directory: svgx/example
        run: flutter build apk --debug

  build-android-release:
    name: Build example (Android release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android NDK 28
        run: |
          NDK_VERSION="28.0.13004108"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Release platform builds go through cargokit's `release` configuration,
      # which svgx/rust/cargokit.yaml pins to a dated nightly plus
      # `-Z build-std=std,panic_abort` (the latter needs the `rust-src`
      # component). Installing it explicitly keeps the version visible here.
      - name: Install pinned nightly toolchain (build-std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
          components: rust-src

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-cargo-android-release-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-cargo-android-release-

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: svgx-gradle-${{ hashFiles('svgx/example/android/**/*.gradle*', 'svgx/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            svgx-gradle-

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      # Unsigned release build — no signing keys involved in CI. cargokit's
      # Gradle hook cross-compiles the Rust crate for all 4 Android ABIs
      # through the pinned nightly build-std release configuration and
      # bundles the resulting .so files into the APK. This is the first time
      # this path runs in CI (previously only verified locally) — see
      # svgx/CLAUDE.md.
      - name: flutter build apk --release
        working-directory: svgx/example
        run: flutter build apk --release

  build-ios:
    name: Build example (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Release platform builds go through cargokit's `release` configuration,
      # which svgx/rust/cargokit.yaml pins to a dated nightly plus
      # `-Z build-std=std,panic_abort` (the latter needs the `rust-src`
      # component). Installing it explicitly keeps the version visible here.
      - name: Install pinned nightly toolchain (build-std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
          components: rust-src

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-cargo-ios-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-cargo-ios-

      # Podfile.lock doesn't exist until `flutter pub get`/pod install has run
      # at least once, so the first CI run on a given Cargo/Flutter version
      # falls back to the restore-keys prefix; every run after that hits the
      # precise key.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            svgx/example/ios/Pods
          key: svgx-pods-ios-${{ hashFiles('svgx/example/ios/Podfile.lock') }}
          restore-keys: |
            svgx-pods-ios-

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      # --no-codesign: no signing identity/provisioning profile available in
      # CI. cargokit's Xcode build phase cross-compiles the Rust crate for
      # the iOS targets as part of this build.
      - name: flutter build ios --no-codesign
        working-directory: svgx/example
        run: flutter build ios --no-codesign

  build-macos:
    name: Build example (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # Release platform builds go through cargokit's `release` configuration,
      # which svgx/rust/cargokit.yaml pins to a dated nightly plus
      # `-Z build-std=std,panic_abort` (the latter needs the `rust-src`
      # component). Installing it explicitly keeps the version visible here.
      - name: Install pinned nightly toolchain (build-std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
          components: rust-src

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-cargo-macos-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-cargo-macos-

      # Podfile.lock doesn't exist until `flutter pub get`/pod install has run
      # at least once, so the first CI run on a given Cargo/Flutter version
      # falls back to the restore-keys prefix; every run after that hits the
      # precise key.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            svgx/example/macos/Pods
          key: svgx-pods-macos-${{ hashFiles('svgx/example/macos/Podfile.lock') }}
          restore-keys: |
            svgx-pods-macos-

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      - name: flutter build macos
        working-directory: svgx/example
        run: flutter build macos

  build-linux:
    name: Build example (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # Release platform builds go through cargokit's `release` configuration,
      # which svgx/rust/cargokit.yaml pins to a dated nightly plus
      # `-Z build-std=std,panic_abort` (the latter needs the `rust-src`
      # component). Installing it explicitly keeps the version visible here.
      - name: Install pinned nightly toolchain (build-std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
          components: rust-src

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-cargo-linux-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-cargo-linux-

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      - name: flutter build linux
        working-directory: svgx/example
        run: flutter build linux
