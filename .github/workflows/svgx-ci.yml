name: svgx CI
# (retrigger note: the two immediately-preceding pushes were interrupted by
# the following push before their runs reached a terminal state — this
# comment-only edit exists purely to get a clean push-triggered run.)

# svgx ships a Rust core (parsed via flutter_rust_bridge + cargokit) behind a
# Dart/Flutter plugin API. cargokit hooks the Rust cross-compile into each
# platform's native build step (Gradle for Android, Xcode build phase for
# iOS/macOS, CMake ExternalProject for Windows/Linux) — so CI verifies
# cross-compilation by driving `flutter build <platform>` on the example app,
# not by invoking `cargo build` per target manually. Pure-Rust unit tests
# (rust/src/**) get their own standalone `cargo test` job that doesn't need
# cargokit or Flutter at all.
#
# Toolchain policy (updated 2026-08-26 — nightly build-std is now wired into
# the real packaging pipeline):
#
#   * Test/analyze jobs (rust-test, dart-analyze, flutter-test) and any *debug*
#     platform build stay on **stable**. `cargo test` cannot run under
#     `-Z build-std` at all (it hits `duplicate lang item`, because build-std
#     compiles core/alloc for both host and target).
#   * Any job that runs a **release** platform build (build-windows /
#     build-ios / build-macos / build-linux) now goes through cargokit's
#     `release` configuration, which `svgx/rust/cargokit.yaml` pins to
#     `nightly-2026-06-24` + `-Z build-std=std,panic_abort` +
#     `RUSTFLAGS=-Zunstable-options -Cpanic=immediate-abort`. That shrinks the
#     packaged native library ~21.4% (624,640 -> 491,008 bytes on Windows,
#     measured through `flutter build windows`). Those jobs therefore install
#     the pinned nightly toolchain + the `rust-src` component explicitly.
#     (cargokit would auto-install both via rustup, but doing it as a visible
#     step keeps failures obvious and the version in one place.)
#   * build-android uses `flutter build apk --debug`, i.e. cargokit's `debug`
#     configuration, so it stays on stable and needs no nightly step.
#   * build-android-release (new 2026-08-26) verifies `flutter build apk
#     --release` in CI for the first time — this path had only been run
#     locally before. It follows the same nightly + rust-src pattern as the
#     other release jobs above.
#
# Bumping RUST_RELEASE_TOOLCHAIN must stay in sync with
# `svgx/rust/cargokit.yaml`, `svgx/rust/build-release.ps1`, `svgx/README.md`
# and `svgx/CLAUDE.md`.
on:
  push:
    branches: [main]
    paths:
      - 'svgx/**'
      - '.github/workflows/svgx-ci.yml'
  pull_request:
    paths:
      - 'svgx/**'
      - '.github/workflows/svgx-ci.yml'

env:
  FLUTTER_VERSION: '3.47.0'
  # Pinned nightly used by cargokit's `release` configuration (build-std).
  # Must match `svgx/rust/cargokit.yaml`.
  RUST_RELEASE_TOOLCHAIN: 'nightly-2026-06-24'

jobs:
  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-cargo-${{ runner.os }}-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-cargo-${{ runner.os }}-

      - name: cargo test
        working-directory: svgx/rust
        run: cargo test --all-features

  dart-analyze:
    name: Dart analyze + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: svgx
        run: flutter pub get

      - name: flutter analyze
        working-directory: svgx
        run: flutter analyze

      - name: dart format check
        working-directory: svgx
        # Scoped to the package's own sources — `dart format` (unlike
        # `flutter analyze`) does not honor analysis_options.yaml excludes,
        # so a bare `.` also tries to reformat the unparseable vendored
        # cargokit/build_tool sources and fails the whole check.
        run: dart format --output=none --set-exit-if-changed lib test example/lib

  flutter-test:
    name: Flutter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: svgx
        run: flutter pub get

      # No native build step here on purpose: svgx/test/*.dart wraps
      # RustLib.init() in try/catch and skips itself with a printed message
      # when the native library isn't loadable under plain `flutter test`
      # (host VM, no platform build) — see rust_gradient_smoke_test.dart and
      # rust_image_smoke_test.dart. Pure-Dart tests (animation/) still run
      # for real either way.
      - name: flutter test
        working-directory: svgx
        run: flutter test

  # Platform build jobs run CONCURRENTLY (2026-08-26: switched from a
  # sequential `needs:` chain — see CLAUDE.md "CI/CD 执行方针" for the
  # decision history). rust-test / dart-analyze / flutter-test are also
  # independent, fast, platform-agnostic checks.
  #
  # build-windows is temporarily commented out (2026-08-26): it already
  # passed on run 32934680568 (commit 7e1e74c) and isn't part of what's
  # currently being iterated on — commenting it out (rather than leaving it
  # running every push) keeps runner time focused on the platforms still
  # being fixed. MUST be restored (uncommented) once android /
  # android-release / linux / macos / ios are all green, so every push goes
  # back to validating all 6 platforms.
  # build-windows:
  #   name: Build example (Windows)
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: ${{ env.FLUTTER_VERSION }}
  #         cache: true
  #
  #     - name: Enable Windows desktop
  #       run: flutter config --enable-windows-desktop
  #
  #     # Release platform builds go through cargokit's `release` configuration,
  #     # which svgx/rust/cargokit.yaml pins to a dated nightly plus
  #     # `-Z build-std=std,panic_abort` (the latter needs the `rust-src`
  #     # component). Installing it explicitly keeps the version visible here.
  #     - name: Install pinned nightly toolchain (build-std)
  #       uses: dtolnay/rust-toolchain@master
  #       with:
  #         toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
  #         components: rust-src
  #
  #     - name: Cache Cargo registry + target
  #       uses: actions/cache@v4
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           svgx/rust/target
  #         key: svgx-cargo-windows-${{ hashFiles('svgx/rust/Cargo.lock') }}
  #         restore-keys: |
  #           svgx-cargo-windows-
  #
