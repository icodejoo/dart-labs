name: svgx CI

# svgx ships a Rust core (via flutter_rust_bridge) behind a Dart/Flutter plugin
# API. As of the precompiled-binary migration (see
# svgx/PRECOMPILED_MIGRATION_PLAN.md) the Rust crate is NOT compiled on a
# consumer's machine, and not compiled by this workflow either: the native
# libraries are committed under `svgx/prebuilt/` and the platform build files
# only reference them.
#
# That changes what CI has to prove, from "can cargokit cross-compile on each
# platform" to three separate things:
#
#   1. `prebuilt-sync` — do the committed binaries still correspond to the Rust
#      sources in the tree? Without this, editing rust/src/** and forgetting to
#      regenerate the binaries would ship a stale library silently. This is the
#      protection that replaces cargokit's content-hash mechanism.
#   2. `cargo-check` — does the Rust source still compile for every target
#      triple we ship? Type-check only (no build-std, no LTO, no link), so it is
#      cheap enough to run on every push while still catching platform-specific
#      breakage that a host-only `cargo test` would miss.
#   3. `build-*` — does a real downstream consumer build succeed, and does the
#      prebuilt binary actually end up inside the produced bundle? The second
#      half matters: the characteristic failure mode of precompiled distribution
#      is "the build passes but the library was never packaged", which then
#      explodes at runtime inside DynamicLibrary.open.
#
# Producing the binaries is a separate, manually triggered workflow:
# `.github/workflows/svgx-prebuilt.yml`.
on:
  push:
    branches: [main]
    paths:
      - 'svgx/**'
      - '.github/workflows/svgx-ci.yml'
  pull_request:
    paths:
      - 'svgx/**'
      - '.github/workflows/svgx-ci.yml'

env:
  FLUTTER_VERSION: '3.47.0'
  # NDK used for the `cargo check` legs of the Android triples. `cargo check`
  # still runs build scripts, and dart-sys compiles a C file, so a C compiler
  # for the target is required even though nothing is linked.
  ANDROID_NDK_VERSION: '28.0.13004108'

jobs:
  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-cargo-${{ runner.os }}-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-cargo-${{ runner.os }}-

      - name: cargo test
        working-directory: svgx/rust
        run: cargo test --all-features

  dart-analyze:
    name: Dart analyze + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: svgx
        run: flutter pub get

      - name: flutter analyze
        working-directory: svgx
        run: flutter analyze

      - name: dart format check
        working-directory: svgx
        # Scoped to the package's own sources. `dart format` (unlike
        # `flutter analyze`) does not honor analysis_options.yaml excludes, so a
        # bare `.` would also try to reformat benchmark/baseline_f.
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib

  flutter-test:
    name: Flutter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: svgx
        run: flutter pub get

      # No native build step here on purpose: svgx/test/*.dart wraps
      # RustLib.init() in try/catch and skips itself with a printed message when
      # the native library isn't loadable under plain `flutter test`. Pure-Dart
      # tests (animation/) still run for real either way.
      - name: flutter test
        working-directory: svgx
        run: flutter test

  # ---------------------------------------------------------------------------
  # 1. Artifact/source sync — the staleness guard.
  # ---------------------------------------------------------------------------
  prebuilt-sync:
    name: Prebuilt artifacts match Rust sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Package dependencies
        working-directory: svgx
        run: flutter pub get

      # Recomputes the SHA-256 of rust/Cargo.lock + rust/Cargo.toml +
      # rust/src/** and compares it against what prebuilt/MANIFEST.json records
      # for each committed binary, plus verifies each binary's own checksum.
      #
      # TODO(migration): drop `--allow-incomplete` once the Apple slices
      # (ios/device, ios/simulator, macos) and windows/arm64 have been produced
      # and committed. Until then that flag keeps "slice not built yet" a
      # warning while every staleness check stays fatal.
      - name: Verify prebuilt/MANIFEST.json
        working-directory: svgx
        run: dart run tool/check_prebuilt.dart --allow-incomplete

  # ---------------------------------------------------------------------------
  # 2. Per-triple compile sentinel — cheap, catches platform-specific breakage.
  # ---------------------------------------------------------------------------
  cargo-check:
    name: cargo check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
            groups: --group android
          - name: linux
            os: ubuntu-latest
            groups: --group linux
          - name: windows
            os: windows-latest
            groups: --group windows
          - name: apple
            os: macos-latest
            groups: --group ios --group macos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Android NDK
        if: matrix.name == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install aarch64 Linux cross compiler
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add Rust target triples
        working-directory: svgx
        shell: bash
        run: |
          for t in $(dart run tool/build_prebuilt.dart --list | awk '{print $2}'); do
            rustup target add "$t" || true
          done

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            svgx/rust/target
          key: svgx-check-${{ matrix.name }}-${{ hashFiles('svgx/rust/Cargo.lock') }}
          restore-keys: |
            svgx-check-${{ matrix.name }}-

      - name: Package dependencies
        working-directory: svgx
        run: flutter pub get

      # Type-check only: no -Z build-std, no LTO, no linking. The script reuses
      # the exact cross-compile environment (NDK clang, cross gcc) that the
      # artifact build uses, so a green check here means the same environment
      # would at least get as far as codegen.
      - name: cargo check per target
        working-directory: svgx
        run: dart run tool/build_prebuilt.dart --check ${{ matrix.groups }}

  # ---------------------------------------------------------------------------
  # 3. Downstream consumer builds — this is what a real user experiences.
  # ---------------------------------------------------------------------------
  # None of these install Rust, nightly, rust-src, or (for Android) an NDK.
  # That absence IS the test: if any of them still needed a Rust toolchain, the
  # migration would not have achieved its goal.
  build-windows:
    name: Consume prebuilt (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      - name: flutter build windows
        working-directory: svgx/example
        run: flutter build windows

      # The build passing is not sufficient — assert the DLL was actually
      # bundled, and that it is byte-identical to the committed artifact.
      - name: Assert svgx.dll was bundled
        working-directory: svgx
        shell: bash
        run: |
          bundled="example/build/windows/x64/runner/Release/svgx.dll"
          test -f "$bundled" || { echo "::error::svgx.dll missing from the runner bundle"; exit 1; }
          a=$(sha256sum "$bundled" | cut -d' ' -f1)
          b=$(sha256sum prebuilt/windows/x64/svgx.dll | cut -d' ' -f1)
          echo "bundled=$a prebuilt=$b"
          test "$a" = "$b" || { echo "::error::bundled DLL differs from prebuilt/"; exit 1; }

  build-android:
    name: Consume prebuilt (Android debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: svgx-gradle-${{ hashFiles('svgx/example/android/**/*.gradle*', 'svgx/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            svgx-gradle-

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      - name: flutter build apk --debug
        working-directory: svgx/example
        run: flutter build apk --debug

      - name: Assert libsvgx.so is in the APK
        working-directory: svgx/example
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libsvgx.so' \
            || { echo "::error::libsvgx.so missing from the APK"; exit 1; }
          unzip -l "$apk" | grep 'libsvgx.so'

  build-android-release:
    name: Consume prebuilt (Android release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: svgx-gradle-${{ hashFiles('svgx/example/android/**/*.gradle*', 'svgx/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            svgx-gradle-

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: svgx/example
        run: flutter build apk --release

      # 16 KB page alignment is a Google Play requirement for 64-bit native
      # libraries. tool/build_prebuilt.dart passes
      # `-Wl,-z,max-page-size=16384` when producing the .so files; this asserts
      # the property survived all the way into the packaged APK, since that is
      # the artifact Play actually inspects.
      - name: Assert 16 KB page alignment in the APK
        working-directory: svgx/example
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -o -q "$apk" 'lib/*/libsvgx.so' -d /tmp/svgx-apk
          fail=0
          for so in /tmp/svgx-apk/lib/*/libsvgx.so; do
            aligns=$(readelf -l "$so" | awk '/^  LOAD/ {print $NF}' | sort -u)
            echo "$so -> $aligns"
            for a in $aligns; do
              [ "$a" = "0x4000" ] || { echo "::error::$so has LOAD align $a, expected 0x4000 (16 KB)"; fail=1; }
            done
          done
          exit $fail

  build-linux:
    name: Consume prebuilt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Example dependencies
        working-directory: svgx/example
        run: flutter pub get

      - name: flutter build linux
        working-directory: svgx/example
        run: flutter build linux

      - name: Assert libsvgx.so was bundled
        working-directory: svgx/example
        run: |
          found=$(find build/linux -name libsvgx.so -path '*bundle*' | head -1)
          test -n "$found" || { echo "::error::libsvgx.so missing from the Linux bundle"; exit 1; }
          echo "bundled: $found"
          echo "--- max glibc requirement ---"
          objdump -T "$found" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

  build-ios:
    name: Consume prebuilt (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # TODO(migration): remove this guard once the iOS archives are committed.
      # Until then this job reports honestly instead of failing on an absence
      # that is expected and already documented.
      - name: Check prebuilt iOS archives exist
        id: guard
        run: |
          if [ -f svgx/prebuilt/ios/device/libsvgx.a ] && [ -f svgx/prebuilt/ios/simulator/libsvgx.a ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::svgx/prebuilt/ios/* not committed yet — run the svgx-prebuilt workflow to produce them."
          fi

      - name: Cache CocoaPods
        if: steps.guard.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            svgx/example/ios/Pods
          key: svgx-pods-ios-${{ hashFiles('svgx/example/ios/Podfile.lock') }}
          restore-keys: |
            svgx-pods-ios-

      - name: Example dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: svgx/example
        run: flutter pub get

      # Both SDKs must build: the whole point of the per-SDK OTHER_LDFLAGS
      # branch in ios/svgx.podspec is that device and simulator each pick the
      # right archive. Verifying only one of them verifies nothing.
      - name: flutter build ios --no-codesign (device)
        if: steps.guard.outputs.present == 'true'
        working-directory: svgx/example
        run: flutter build ios --no-codesign

      - name: flutter build ios --simulator
        if: steps.guard.outputs.present == 'true'
        working-directory: svgx/example
        run: flutter build ios --simulator

      # The migration promised static linking — no stray dynamic library in the
      # app bundle. Assert that, and assert -force_load actually preserved the
      # flutter_rust_bridge exports rather than letting them be dead-stripped.
      - name: Assert static linkage and surviving symbols
        if: steps.guard.outputs.present == 'true'
        working-directory: svgx/example
        run: |
          app=build/ios/iphoneos/Runner.app
          if otool -L "$app/Runner" | grep -i 'svgx'; then
            echo "::error::a dynamic svgx library leaked into the app bundle"; exit 1
          fi
          nm "$app/Runner" | grep -q 'frbgen' \
            || { echo "::error::flutter_rust_bridge symbols were dead-stripped — -force_load is not taking effect"; exit 1; }
          echo "static linkage OK, FRB symbols present"

  build-macos:
    name: Consume prebuilt (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # TODO(migration): remove this guard once macos/libsvgx.a is committed.
      - name: Check prebuilt macOS archive exists
        id: guard
        run: |
          if [ -f svgx/prebuilt/macos/libsvgx.a ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::svgx/prebuilt/macos/libsvgx.a not committed yet — run the svgx-prebuilt workflow to produce it."
          fi

      - name: Cache CocoaPods
        if: steps.guard.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            svgx/example/macos/Pods
          key: svgx-pods-macos-${{ hashFiles('svgx/example/macos/Podfile.lock') }}
          restore-keys: |
            svgx-pods-macos-

      - name: Example dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: svgx/example
        run: flutter pub get

      - name: flutter build macos
        if: steps.guard.outputs.present == 'true'
        working-directory: svgx/example
        run: flutter build macos

      - name: Assert static linkage and surviving symbols
        if: steps.guard.outputs.present == 'true'
        working-directory: svgx/example
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          bin="$app/Contents/MacOS/$(basename "$app" .app)"
          if otool -L "$bin" | grep -i 'svgx'; then
            echo "::error::a dynamic svgx library leaked into the app bundle"; exit 1
          fi
          nm "$bin" | grep -q 'frbgen' \
            || { echo "::error::flutter_rust_bridge symbols were dead-stripped — -force_load is not taking effect"; exit 1; }
          echo "static linkage OK, FRB symbols present"
