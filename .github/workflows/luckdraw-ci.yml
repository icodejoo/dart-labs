name: luckdraw CI

on:
  push:
    branches: [main]
    paths:
      - 'luckdraw/**'
      - '.github/workflows/luckdraw-ci.yml'
      - '!luckdraw/docs/**'
      - '!luckdraw/**/*.md'
  pull_request:
    paths:
      - 'luckdraw/**'
      - '.github/workflows/luckdraw-ci.yml'
      - '!luckdraw/docs/**'
      - '!luckdraw/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: analyze + test + gates (stable)
    # 当前 golden/parity 基线及容差均在 Windows 标定；Linux 逻辑另行全量验证。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: luckdraw
    steps:
      - uses: actions/checkout@v4
        # MANIFEST 校验原始字节，避免 Windows checkout 转换 JSON 换行。
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies (package only) and preserve analysis rules
        run: |
          cp analysis_options.yaml "$RUNNER_TEMP/luckdraw-analysis.yaml"
          flutter pub get --no-example
          if ! cmp -s analysis_options.yaml "$RUNNER_TEMP/luckdraw-analysis.yaml"; then
            diff -u "$RUNNER_TEMP/luckdraw-analysis.yaml" analysis_options.yaml || true
            cp "$RUNNER_TEMP/luckdraw-analysis.yaml" analysis_options.yaml
          fi
      - name: Test font present
        run: |
          font="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/roboto-regular.ttf"
          legacy_font="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf"
          if ! test -f "$font" && ! test -f "$legacy_font"; then
            flutter precache --universal
          fi
          test -f "$font" || test -f "$legacy_font"
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Tests with coverage
        id: tests
        run: |
          mkdir -p build
          flutter test --no-pub --concurrency=1 --coverage --coverage-path=coverage/ci.lcov --reporter json > build/test_run.json
      - name: Failed test details
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          python -X utf8 - <<'PY'
          import json
          from pathlib import Path

          tests, suites, messages = {}, {}, {}
          for line in Path('build/test_run.json').read_text(encoding='utf-8-sig').splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  print(line)
                  continue
              kind = event.get('type')
              if kind == 'suite':
                  suites[event['suite']['id']] = event['suite']['path']
              elif kind == 'testStart':
                  tests[event['test']['id']] = event['test']
              elif kind in ('error', 'print'):
                  messages.setdefault(event['testID'], []).append(
                      event.get('error', event.get('message', '')) + '\n' + event.get('stackTrace', ''))
              elif kind == 'testDone' and event['result'] in ('failure', 'error'):
                  test = tests.get(event['testID'], {})
                  print(f"FAILED: {suites.get(test.get('suiteID'), 'unknown suite')}: {test.get('name', event['testID'])}")
                  print('\n'.join(messages.get(event['testID'], ['No diagnostic events recorded'])))
          PY
      - name: Preserve test results
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: luckdraw-test-results
          path: |
            luckdraw/build/test_run.json
            luckdraw/coverage/ci.lcov
      - name: Coverage gate (100%)
        run: dart run tool/coverage.dart --min=100 --lcov=coverage/ci.lcov
      - name: Acceptance matrix
        run: dart run tool/check_acceptance.dart --from-json build/test_run.json
      - name: Import graph
        run: dart run tool/check_imports.dart
      # M4 adds the manifest generator; T0.1 keeps its future gate explicit.
      - name: Parity manifest
        if: hashFiles('luckdraw/tool/parity/generate.dart') != ''
        run: dart run tool/parity/generate.dart --verify-manifest

  example:
    name: example + bench analyze (when implemented)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Example
        if: hashFiles('luckdraw/example/pubspec.yaml') != ''
        working-directory: luckdraw/example
        run: |
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos
      - name: Example web build (deploy smoke)
        if: hashFiles('luckdraw/example/web/index.html') != ''
        working-directory: luckdraw/example
        run: flutter build web --release --base-href /dart-labs/luckdraw/
      - name: Bench app
        if: hashFiles('luckdraw/tool/bench/pubspec.yaml') != ''
        working-directory: luckdraw/tool/bench
        run: |
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos

  min-sdk:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum Flutter (3.24.5)
            version: '3.24.5'
            test-args: ''
          - label: stable Flutter (Linux, no goldens)
            version: ''
            test-args: '--coverage --coverage-path=coverage/linux.lcov'
    defaults:
      run:
        working-directory: luckdraw
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
          cache: true
      - name: Dependencies (package only) and preserve analysis rules
        run: |
          cp analysis_options.yaml "$RUNNER_TEMP/luckdraw-analysis-min.yaml"
          # Flutter 3.24 的后处理仍会读取未生成的 example 配置。
          # Dart pub 通过 FLUTTER_ROOT 解析 SDK，跳过该后处理。
          dart pub get --no-example
          if ! cmp -s analysis_options.yaml "$RUNNER_TEMP/luckdraw-analysis-min.yaml"; then
            diff -u "$RUNNER_TEMP/luckdraw-analysis-min.yaml" analysis_options.yaml || true
            cp "$RUNNER_TEMP/luckdraw-analysis-min.yaml" analysis_options.yaml
          fi
      - name: Test font present
        run: |
          font="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/roboto-regular.ttf"
          legacy_font="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf"
          if ! test -f "$font" && ! test -f "$legacy_font"; then
            flutter precache --universal
          fi
          test -f "$font" || test -f "$legacy_font"
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Tests (no goldens)
        run: flutter test --no-pub --concurrency=1 --exclude-tags golden ${{ matrix.test-args }}
      - name: Linux stable coverage gate (100%)
        if: matrix.version == ''
        run: dart run tool/coverage.dart --min=100 --lcov=coverage/linux.lcov

  treeshake-web:
    name: tree-shaking (web probes when implemented)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Probes
        if: hashFiles('luckdraw/tool/treeshake/check_treeshake.dart') != ''
        working-directory: luckdraw
        run: dart run tool/treeshake/check_treeshake.dart --backend=web

  treeshake-apk:
    name: tree-shaking (arm64 APK analyze-size)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Probes
        if: hashFiles('luckdraw/tool/treeshake/check_treeshake.dart') != ''
        working-directory: luckdraw
        run: dart run tool/treeshake/check_treeshake.dart --backend=apk --probe=baseline,wheel_only,grid_only,slot_only,all_games
