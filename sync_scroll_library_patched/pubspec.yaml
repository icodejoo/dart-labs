name: sync_scroll_library
description: A patched fork of fluttercandies/sync_scroll_library 1.1.0 (the scroll-link library behind extended_tabs) that fixes a stuck child after the parent takes over a drag and the finger reverses.
version: 1.1.0+patched.1
# Never publish under the upstream name; consume via dependency_overrides.
publish_to: none
homepage: https://github.com/icodejoo/dart-labs/tree/main/sync_scroll_library_patched
repository: https://github.com/icodejoo/dart-labs

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
