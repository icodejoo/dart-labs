name: json_annotation_lenient
description: "Lenient JSON conversion for json_serializable: coerces loose int/double/bool/String/DateTime values and fills type-based defaults for missing fields."
version: 1.3.0
homepage: https://github.com/icodejoo/dart-labs/tree/main/json_annotation_lenient
repository: https://github.com/icodejoo/dart-labs
issue_tracker: https://github.com/icodejoo/dart-labs/issues

topics:
  - json
  - json-serializable
  - build-runner
  - codegen
  - serialization

environment:
  # analyzer ^14.7.0 / json_serializable ^6.15.2 / build ^5.0.0 all require
  # sdk: ^3.13.0 — this floor must track theirs or pub.dev advertises a
  # compatibility this package can't actually deliver.
  sdk: ^3.13.0

# All regular dependencies (not dev_dependencies): this package is consumed
# as a build_runner plugin by other projects, so analyzer/build/dart_style/
# source_gen/pub_semver/json_serializable must be resolvable at the
# consuming project's pub-get time, not just this package's own dev cycle.
dependencies:
  json_annotation: ^4.12.0
  analyzer: ^14.7.0
  build: ^5.0.0
  dart_style: ^3.1.12
  source_gen: ^4.3.1
  pub_semver: ^2.2.0
  json_serializable: ^6.14.1
  # Parses a project's own analysis_options.yaml to auto-detect
  # formatter.page_width/trailing_commas — see
  # _detectFormatterOptionsFromAnalysisOptions in auto_default_builder.dart.
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.15
