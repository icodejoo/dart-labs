<svg viewBox="0 0 1400 1320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #FDE8D0; stroke: #333; stroke-width: 2; }
      .box-api { fill: #E8F5E9; stroke: #333; stroke-width: 1.5; }
      .box-plugin { fill: #FFF9C4; stroke: #333; stroke-width: 1.5; }
      .frame { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .text-title { font-size: 18px; font-weight: bold; font-family: Arial; }
      .text-label { font-size: 13px; font-family: Arial; }
      .text-small { font-size: 11px; font-family: Arial; }
      .text-api { font-size: 10px; font-family: 'Courier New', monospace; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-small { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-small); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-small" markerWidth="8" markerHeight="8" refX="7" refY="2" orient="auto">
      <polygon points="0 0, 8 2, 0 4" fill="#666"/>
    </marker>
  </defs>

  <text x="700" y="30" text-anchor="middle" class="text-title">Layerman 1.0.0 架构图</text>
  <text x="700" y="50" text-anchor="middle" class="text-label">headless 弹层队列编排器 | 只决定何时、哪个显示，渲染交给 present 后端</text>

  <!-- 应用代码 -->
  <rect x="50" y="80" width="220" height="130" class="box" rx="8"/>
  <text x="160" y="108" text-anchor="middle" class="text-title">应用代码</text>
  <text x="160" y="128" text-anchor="middle" class="text-label">Flutter App</text>
  <text x="160" y="152" text-anchor="middle" class="text-api">open&lt;T&gt;(present: ...)</text>
  <text x="160" y="167" text-anchor="middle" class="text-api">await Future&lt;T?&gt;</text>
  <text x="160" y="182" text-anchor="middle" class="text-api">addListener(...)</text>

  <path d="M 270 145 L 340 145" class="arrow"/>

  <!-- Layerman API -->
  <rect x="340" y="80" width="420" height="130" class="box" rx="8"/>
  <text x="550" y="108" text-anchor="middle" class="text-title">Layerman API</text>
  <text x="550" y="128" text-anchor="middle" class="text-label">ChangeNotifier | 公开入口</text>
  <text x="550" y="150" text-anchor="middle" class="text-api">open / close / dismiss / remove / clear / clearWhere</text>
  <text x="550" y="165" text-anchor="middle" class="text-api">setContext / update / pauseAll / resumeAll / pause / resume</text>
  <text x="550" y="180" text-anchor="middle" class="text-api">activeIds / resolvingIds / records / recordOf / ready()</text>
  <text x="550" y="196" text-anchor="middle" class="text-small">状态唯一事实来源：_byId</text>

  <!-- 路由观察者 -->
  <rect x="930" y="80" width="320" height="130" class="box-plugin" rx="8"/>
  <text x="1090" y="108" text-anchor="middle" class="text-title">LayermanNavigatorObserver</text>
  <text x="1090" y="130" text-anchor="middle" class="text-label">NavigatorObserver，只监听 didChangeTop</text>
  <text x="1090" y="150" text-anchor="middle" class="text-small">routeFilter 默认 PageRoute；pathOf 取路径</text>
  <text x="1090" y="166" text-anchor="middle" class="text-small">post-frame + scheduleFrame</text>
  <text x="1090" y="182" text-anchor="middle" class="text-api">setContext({contextKey: path})</text>
  <text x="1090" y="198" text-anchor="middle" class="text-small">isDisposed 前后各检查一次</text>

  <path d="M 930 145 L 760 145" class="arrow-small"/>
  <text x="845" y="136" text-anchor="middle" class="text-small">route 上下文</text>

  <!-- 内部框 -->
  <rect x="30" y="240" width="1340" height="290" class="frame" rx="10"/>
  <text x="50" y="260" class="text-label">Layerman 内部（lib/src/overlay_manager.dart）</text>

  <path d="M 550 210 L 550 240" class="arrow"/>

  <!-- 资格 -->
  <rect x="50" y="275" width="400" height="235" class="box-api" rx="8"/>
  <text x="250" y="302" text-anchor="middle" class="text-title">资格判断</text>
  <text x="250" y="322" text-anchor="middle" class="text-label">条件 + 冷却 + hydrate 门控</text>
  <text x="70" y="348" class="text-small">条件：route AND auth AND when</text>
  <text x="70" y="366" class="text-small">  仅 route 保留；auth / when 读取任意业务键</text>
  <text x="70" y="388" class="text-small">冷却：session / total / day / hour / minute / minGap</text>
  <text x="70" y="406" class="text-small">  本地日历桶，按 id 计数，必须显式 id</text>
  <text x="70" y="428" class="text-small">hydrate 前：带持久化上限的条目暂不满足</text>
  <text x="70" y="446" class="text-small">  串行排队，overlap 挂起；完成后统一重调度</text>
  <text x="70" y="468" class="text-small">不满足：串行等待；永久上限耗尽丢弃（capped）</text>
  <text x="70" y="486" class="text-small">auth / when 抛异常 = 不满足并上报（每条目一次）</text>

  <!-- 调度 -->
  <rect x="500" y="275" width="400" height="235" class="box" rx="8"/>
  <text x="700" y="302" text-anchor="middle" class="text-title">调度</text>
  <text x="700" y="322" text-anchor="middle" class="text-label">_slots / _overlaps / _pendingOverlaps / _delayedOverlaps</text>
  <text x="520" y="348" class="text-small">每个槽位：active(0..1) + queue + gap/delay/cooldown 计时器</text>
  <text x="520" y="368" class="text-small">_enqueue 有序插入：replace → priority 降序 → seq FIFO</text>
  <text x="520" y="388" class="text-small">_schedule：取第一个合格项；时间型冷却自唤醒</text>
  <text x="520" y="408" class="text-small">replace：自身合格、未暂停、当前项未 affix 才抢占</text>
  <text x="520" y="426" class="text-small">  被抢占者直接关闭不回队列，跳过 gap / delay</text>
  <text x="520" y="448" class="text-small">暂停 = _manualPaused OR _routeZonePaused OR holds</text>
  <text x="520" y="466" class="text-small">  冻结 duration，释放时重调度并放行挂起的 overlap</text>
  <text x="520" y="488" class="text-small">同 id 合格串行接管；expireAfter / maxQueued 限制等待</text>

  <path d="M 500 392 L 450 392" class="arrow-small"/>
  <text x="475" y="384" text-anchor="middle" class="text-small">查资格</text>

  <!-- 生命周期 -->
  <rect x="950" y="275" width="400" height="235" class="box" rx="8"/>
  <text x="1150" y="302" text-anchor="middle" class="text-title">条目生命周期</text>
  <text x="1150" y="322" text-anchor="middle" class="text-label">OverlayPhase: pending → resolving → open → closing</text>
  <text x="970" y="344" class="text-small">pending：串行等槽位；overlap delay 到点才判资格</text>
  <text x="970" y="358" class="text-small">resolving：resolveTimeout 默认 30s；replace 可抢占</text>
  <text x="970" y="374" class="text-small">open：调用 present、记冷却、起 duration 计时</text>
  <text x="970" y="390" class="text-small">两阶段关闭：close → 校验 result 类型 → beforeClose</text>
  <text x="970" y="408" class="text-small">  → settle + closing → 后端 dismiss → dismissed</text>
  <text x="970" y="426" class="text-small">  → exitDuration → 移除；dismissTimeout 防止卡槽</text>
  <text x="970" y="448" class="text-small">绕过守卫：remove / clear / duration 到期 /</text>
  <text x="970" y="464" class="text-small">  dismissWhenUnmet / replace</text>
  <text x="970" y="486" class="text-small">结果只交付一次；dismissRequested 限制关闭请求一次</text>

  <path d="M 900 392 L 950 392" class="arrow"/>
  <text x="925" y="384" text-anchor="middle" class="text-small">激活</text>

  <!-- 冷却存储 -->
  <rect x="50" y="590" width="400" height="110" class="box-plugin" rx="8"/>
  <text x="250" y="618" text-anchor="middle" class="text-title">_CooldownStore</text>
  <text x="250" y="640" text-anchor="middle" class="text-small">hydrate 合并（不覆盖），读同步，写串行化</text>
  <text x="250" y="658" text-anchor="middle" class="text-small">storageKey 下存一个 JSON；失败上报不阻塞调度</text>
  <text x="250" y="676" text-anchor="middle" class="text-small">session 计数只在内存</text>

  <path d="M 250 590 L 250 510" class="arrow-small"/>
  <text x="262" y="552" class="text-small">canShow / record</text>

  <rect x="50" y="760" width="400" height="100" class="box-api" rx="8"/>
  <text x="250" y="788" text-anchor="middle" class="text-title">OverlayCooldownStorage</text>
  <text x="250" y="810" text-anchor="middle" class="text-api">read(key) / write(key, value)</text>
  <text x="250" y="830" text-anchor="middle" class="text-small">默认 MemoryCooldownStorage</text>
  <text x="250" y="846" text-anchor="middle" class="text-small">可接 shared_preferences 等持久层</text>

  <path d="M 230 700 L 230 760" class="arrow-small"/>
  <path d="M 270 760 L 270 700" class="arrow-small"/>

  <!-- 0.3.0 旁路组件：沿用原画布与配色 -->
  <rect x="470" y="590" width="210" height="110" class="box-plugin" rx="8"/>
  <text x="575" y="614" text-anchor="middle" class="text-label">Route presenters</text>
  <text x="575" y="636" text-anchor="middle" class="text-api">DialogManager</text>
  <text x="575" y="654" text-anchor="middle" class="text-api">BottomSheetManager</text>
  <text x="575" y="676" text-anchor="middle" class="text-api">presentRoute / completed</text>
  <path d="M 680 645 L 700 645" class="arrow-small"/>
  <rect x="470" y="760" width="210" height="120" class="box-api" rx="8"/>
  <text x="575" y="784" text-anchor="middle" class="text-label">OverlayTicket / events</text>
  <text x="575" y="805" text-anchor="middle" class="text-api">result / outcome / data</text>
  <text x="575" y="825" text-anchor="middle" class="text-api">queued / shown / ended</text>
  <text x="575" y="847" text-anchor="middle" class="text-small">holds / LayermanLifecycle</text>
  <text x="575" y="866" text-anchor="middle" class="text-small">独立凭证，按 OR 暂停</text>
  <path d="M 485 760 L 485 530 L 575 530 L 575 510" class="arrow-small"/>

  <!-- present 后端 -->
  <rect x="700" y="590" width="650" height="110" class="box-plugin" rx="8"/>
  <text x="1025" y="618" text-anchor="middle" class="text-title">present 后端（调用方提供）</text>
  <text x="1025" y="640" text-anchor="middle" class="text-label">showDialog | GetX | bot_toast | 自管 OverlayEntry</text>
  <text x="1025" y="660" text-anchor="middle" class="text-small">负责全部渲染；present 同步抛异常 = 上报并丢弃该条目</text>
  <text x="1025" y="678" text-anchor="middle" class="text-small">PresentContext&lt;T&gt;：id / slot / data / dataListenable / close</text>

  <path d="M 1100 510 L 1100 590" class="arrow"/>
  <text x="1112" y="556" class="text-api">present(PresentContext)</text>

  <!-- PresentedOverlay -->
  <rect x="700" y="760" width="650" height="120" class="box-api" rx="8"/>
  <text x="1025" y="788" text-anchor="middle" class="text-title">PresentedOverlay&lt;T&gt;</text>
  <text x="1025" y="810" text-anchor="middle" class="text-api">dismissed: Future&lt;T?&gt;   dismiss: Future&lt;void&gt; Function([T?])?</text>
  <text x="1025" y="830" text-anchor="middle" class="text-small">dismissed 必须覆盖所有关闭路径，它的值就是 open() 的结果</text>
  <text x="1025" y="848" text-anchor="middle" class="text-small">dismiss 必须定点关闭这一个弹层，不能弹栈顶</text>
  <text x="1025" y="866" text-anchor="middle" class="text-small">异常隔离：dismiss 抛错只上报；replace / clear / remove 时尽力 dismiss</text>

  <path d="M 1000 700 L 1000 760" class="arrow-small"/>
  <path d="M 1050 760 L 1050 700" class="arrow-small"/>

  <!-- 返回路径：dismissed 驱动生命周期 -->
  <path d="M 1350 820 L 1380 820 L 1380 420 L 1350 420" class="arrow-small"/>
  <text x="1372" y="640" text-anchor="end" class="text-small" transform="rotate(-90 1372 640)">dismissed 驱动移除，dismiss 由关闭路径发出</text>

  <!-- 说明 -->
  <text x="700" y="915" text-anchor="middle" class="text-small">实线：主调用链 | 细线：旁路与回调 | 黄色：外部扩展点或旁路组件 | 绿色：资格与协议契约</text>
  <text x="700" y="932" text-anchor="middle" class="text-small">核心依赖 dart:async / dart:convert / flutter/foundation / scheduler；观察者/生命周期依赖 widgets；route presenters 依赖 Material</text>
  <!-- 1.0 类型契约与运行时边界，沿用原配色 -->
  <rect x="50" y="960" width="400" height="155" class="box-api" rx="8"/>
  <text x="250" y="985" text-anchor="middle" class="text-title">1.0 类型与分组</text>
  <text x="70" y="1010" class="text-api">mode: OverlayMode.queue / replace / overlap</text>
  <text x="70" y="1032" class="text-api">RouteMatcher.exact / anyOf / regex</text>
  <text x="70" y="1054" class="text-api">OverlayRecord.phase: OverlayPhase</text>
  <text x="70" y="1076" class="text-api">tags → read-only record.tags → clearTag</text>
  <text x="70" y="1098" class="text-small">随机测试与 debug 断言缓解风险；Gate / 状态机未做</text>
  <rect x="500" y="960" width="400" height="155" class="box" rx="8"/>
  <text x="700" y="985" text-anchor="middle" class="text-title">批量通知与帧后展示</text>
  <text x="520" y="1010" class="text-api">_batch → _notify → one manager notification</text>
  <text x="520" y="1032" class="text-small">persistentCallbacks → post-frame 调度与通知</text>
  <text x="520" y="1054" class="text-small">帧后重查 disposed / pause / 条件 / hydrate</text>
  <text x="520" y="1076" class="text-small">最外层 _batch → debugCheckInvariants() → 通知</text>
  <text x="520" y="1098" class="text-small">仅回收运行时 slot，保留 slots 配置</text>
  <rect x="950" y="960" width="400" height="155" class="box-plugin" rx="8"/>
  <text x="1150" y="985" text-anchor="middle" class="text-title">冷却查询与重置</text>
  <text x="970" y="1010" class="text-api">cooldownStatus → OverlayCooldownStatus</text>
  <text x="970" y="1032" class="text-api">canShow / permanentlyBlocked / wait</text>
  <text x="970" y="1054" class="text-api">resetCooldown(id) / clearCooldowns()</text>
  <text x="970" y="1076" class="text-small">清 session + 持久化计数，再调度并串行写回</text>
  <text x="970" y="1098" class="text-small">旧 id 不自动裁剪，保留 total 语义</text>
  <!-- 1.0 发布前补完：同源时钟与守卫关闭回路 -->
  <rect x="50" y="1150" width="620" height="130" class="box-plugin" rx="8"/>
  <text x="360" y="1177" text-anchor="middle" class="text-title">OverlayClock</text>
  <text x="70" y="1200" class="text-api">Layerman(clock: OverlayClock.system)</text>
  <text x="70" y="1222" class="text-small">clock.now() / clock.createTimer(...)：所有时间与计时器同源</text>
  <text x="70" y="1244" class="text-small">testing.dart → FakeOverlayClock → advance / pendingTimers</text>
  <text x="70" y="1266" class="text-small">普通 Dart test()，无需 Flutter 绑定</text>
  <rect x="700" y="1150" width="650" height="130" class="box-api" rx="8"/>
  <text x="1025" y="1177" text-anchor="middle" class="text-title">ctx.close 回路</text>
  <text x="720" y="1200" class="text-api">PresentContext&lt;T&gt;.close(result) → 身份校验 → beforeClose</text>
  <text x="720" y="1222" class="text-small">→ closing → 后端 dismiss → dismissed → 移除</text>
  <text x="720" y="1244" class="text-small">DialogManager / BottomSheetManager builder close 使用同一入口</text>
  <text x="720" y="1266" class="text-small">后端自行关闭绕过守卫；同步 ctx.close 后清理句柄、不起 duration</text>
  <path d="M 1340 1150 L 1390 1150 L 1390 390 L 1350 390" class="arrow-small"/>
  <path d="M 40 1150 L 20 1150 L 20 390 L 50 390" class="arrow-small"/>
</svg>
